  // Snapshot of the UI's current background. With "沿用所有設定" on, the
  // opacity/brightness/blur/saturation/tint/fit/position come along too.
  function spCaptureUiBackground(){
    const s = appSettings;
    const baseColor = spDefaultBase();
    if(!s.bgImage) return { source: "ui", dataUrl: null, adjust: null, baseColor: baseColor };
    return {
      source: "ui",
      dataUrl: s.bgImage,
      baseColor: baseColor,
      adjust: s.skillPrioBgFollowUi === false ? null : {
        opacity: s.bgOpacity != null ? s.bgOpacity : 100,
        brightness: s.bgBrightness != null ? s.bgBrightness : 100,
        blur: s.bgBlur || 0,
        saturation: s.bgSaturation != null ? s.bgSaturation : 100,
        tintColor: s.bgTintColor,
        tintOpacity: s.bgTintOpacity != null ? s.bgTintOpacity : 0,
        fit: s.bgFit || "cover",
        position: s.bgPosition || "center center"
      }
    };
  }

  // ---- 技能優先級 › 圖片格式：畫面設定 & 背景方案 ----
  // 上傳／貼上的背景可以調整畫面設定（透明度、亮度、模糊、飽和、疊加顏色、顯示方式、位置）。
  // 「無背景」和「介面背景」不能調。離開一張還沒存過的上傳背景時會詢問是否存成方案，
  // 方案最多 5 個，存在獨立的 IndexedDB（不影響主資料庫，也不佔 localStorage 空間）。
  const SP_ADJUST_DEFAULTS = {
    opacity: 100, brightness: 100, blur: 0, saturation: 100,
    tintColor: "#000000", tintOpacity: 0, fit: "cover", position: "center center"
  };
  const SP_PRESET_MAX = 5;

  function spNormAdjust(a){
    return Object.assign({}, SP_ADJUST_DEFAULTS, a || {});
  }

  // Same picture + same look? Uploaded backgrounds compare with default-filled
  // adjustments (so "never touched" equals "all defaults"); baseColor is ignored.
  function spSameBg(a, b){
    if(!a || !b) return !a && !b;
    if(a.source !== b.source || a.dataUrl !== b.dataUrl) return false;
    if(a.source === "upload") return JSON.stringify(spNormAdjust(a.adjust)) === JSON.stringify(spNormAdjust(b.adjust));
    return JSON.stringify(a.adjust || null) === JSON.stringify(b.adjust || null);
  }

  let spPresetDbPromise = null;
  function spPresetDb(){
    if(!spPresetDbPromise){
      spPresetDbPromise = new Promise(function(resolve, reject){
        const req = indexedDB.open("ba_roster_sp_presets", 1);
        req.onupgradeneeded = function(e){ e.target.result.createObjectStore("presets", { keyPath: "slot" }); };
        req.onsuccess = function(e){ resolve(e.target.result); };
        req.onerror = function(){ spPresetDbPromise = null; reject(req.error); };
      });
    }
    return spPresetDbPromise;
  }
  async function spPresetsLoad(){
    const slots = new Array(SP_PRESET_MAX).fill(null);
    try{
      const db = await spPresetDb();
      const all = await new Promise(function(resolve, reject){
        const r = db.transaction("presets", "readonly").objectStore("presets").getAll();
        r.onsuccess = function(){ resolve(r.result || []); };
        r.onerror = function(){ reject(r.error); };
      });
      all.forEach(function(rec){
        if(rec && rec.slot >= 1 && rec.slot <= SP_PRESET_MAX && rec.bg && rec.bg.dataUrl) slots[rec.slot - 1] = rec;
      });
    } catch(e){}
    return slots;
  }
  async function spPresetPut(rec){
    const db = await spPresetDb();
    await new Promise(function(resolve, reject){
      const t = db.transaction("presets", "readwrite");
      t.objectStore("presets").put(rec);
      t.oncomplete = resolve;
      t.onerror = function(){ reject(t.error); };
      t.onabort = function(){ reject(t.error); };
    });
  }
  async function spPresetDelete(slot){
    const db = await spPresetDb();
    await new Promise(function(resolve, reject){
      const t = db.transaction("presets", "readwrite");
      t.objectStore("presets").delete(slot);
      t.oncomplete = resolve;
      t.onerror = function(){ reject(t.error); };
    });
  }

  // Small preview of a background exactly as it will be drawn (adjustments included).
  async function spMakeBgThumb(bg){
    const W = 160, H = 90;
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const ctx = c.getContext("2d");
    ctx.fillStyle = bg.baseColor || spDefaultBase();
    ctx.fillRect(0, 0, W, H);
    const img = await spLoadImage(bg.dataUrl);
    if(img) spDrawBackground(ctx, W, H, img, bg.adjust || null);
    return c.toDataURL("image/jpeg", 0.8);
  }

  function spBgInfoText(bg){
    if(!bg) return "背景：無（透明）";
    if(bg.source === "upload") return "背景：已上傳的圖片";
    if(!bg.dataUrl) return "背景：介面底色（無背景圖片）";
    return bg.adjust ? "背景：介面背景（含所有設定）" : "背景：介面背景（只用圖片）";
  }

  function spShrinkDataUrl(dataUrl, maxDim){
    return new Promise(function(resolve){
      const img = new Image();
      img.onload = function(){
        const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
        if(scale >= 1){ resolve(dataUrl); return; }
        const c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * scale);
        c.height = Math.round(img.naturalHeight * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(/^data:image\/png/.test(dataUrl) ? c.toDataURL("image/png") : c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = function(){ resolve(dataUrl); };
      img.src = dataUrl;
    });
  }

  function spLoadImage(src){
    return new Promise(function(resolve){
      if(!src){ resolve(null); return; }
      const img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = function(){ resolve(null); };
      img.src = src;
    });
  }

  function spRatioValue(bgImg){
    const s = appSettings;
    let r = 16 / 9;
    if(s.skillPrioRatio === "4:3") r = 4 / 3;
    else if(s.skillPrioRatio === "1:1") r = 1;
    else if(s.skillPrioRatio === "bg" && bgImg) r = bgImg.naturalWidth / bgImg.naturalHeight;
    else if(s.skillPrioRatio === "custom"){
      const w = parseFloat(s.skillPrioCustomW), h = parseFloat(s.skillPrioCustomH);
      if(w > 0 && h > 0) r = w / h;
    }
    return Math.min(4, Math.max(0.25, r));
  }

  function spParsePosition(str){
    const parts = String(str || "center center").split(/\s+/);
    const fx = { left: 0, center: 0.5, right: 1 };
    const fy = { top: 0, center: 0.5, bottom: 1 };
    return {
      x: fx[parts[0]] != null ? fx[parts[0]] : 0.5,
      y: fy[parts[1]] != null ? fy[parts[1]] : 0.5
    };
  }

  function spRoundRect(ctx, x, y, w, h, r, append){
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    if(!append) ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  // Rounded rect with a separate radius per corner: [top-left, top-right, bottom-right, bottom-left].
  function spRoundRectCorners(ctx, x, y, w, h, radii){
    const tl = radii[0], tr = radii[1], br = radii[2], bl = radii[3];
    ctx.beginPath();
    ctx.moveTo(x + tl, y);
    ctx.lineTo(x + w - tr, y);
    ctx.arcTo(x + w, y, x + w, y + tr, tr);
    ctx.lineTo(x + w, y + h - br);
    ctx.arcTo(x + w, y + h, x + w - br, y + h, br);
    ctx.lineTo(x + bl, y + h);
    ctx.arcTo(x, y + h, x, y + h - bl, bl);
    ctx.lineTo(x, y + tl);
    ctx.arcTo(x, y, x + tl, y, tl);
    ctx.closePath();
  }

  // For browsers whose canvas has no ctx.filter (older Safari): brightness
  // and saturation done per pixel. Blur is skipped there.
  function spFallbackAdjust(ctx, W, H, brightness, saturation){
    const img = ctx.getImageData(0, 0, W, H);
    const d = img.data;
    const b = brightness / 100, sat = saturation / 100;
    for(let i = 0; i < d.length; i += 4){
      let r = d[i] * b, g = d[i + 1] * b, bl = d[i + 2] * b;
      const gray = 0.299 * r + 0.587 * g + 0.114 * bl;
      r = gray + (r - gray) * sat; g = gray + (g - gray) * sat; bl = gray + (bl - gray) * sat;
      d[i] = Math.max(0, Math.min(255, r));
      d[i + 1] = Math.max(0, Math.min(255, g));
      d[i + 2] = Math.max(0, Math.min(255, bl));
    }
    ctx.putImageData(img, 0, 0);
  }

  // Mirrors how the page's own background layer is drawn (see
  // applySettings): image placed by fit/position, tint on top, then
  // brightness → blur → saturate, then opacity over the base colour.
  function spDrawBackground(ctx, W, H, img, adj){
    const layer = document.createElement("canvas");
    layer.width = W; layer.height = H;
    const lc = layer.getContext("2d");
    const fit = adj ? (adj.fit || "cover") : "cover";
    const pos = spParsePosition(adj ? adj.position : "center center");
    const k = W / Math.max(1, window.innerWidth || W);
    const iw = img.naturalWidth, ih = img.naturalHeight;
    if(fit === "repeat"){
      const tw = Math.max(1, iw * k), th = Math.max(1, ih * k);
      let x0 = ((W - tw) * pos.x) % tw; if(x0 > 0) x0 -= tw;
      let y0 = ((H - th) * pos.y) % th; if(y0 > 0) y0 -= th;
      for(let y = y0; y < H; y += th){
        for(let x = x0; x < W; x += tw) lc.drawImage(img, x, y, tw, th);
      }
    } else {
      const scale = fit === "contain" ? Math.min(W / iw, H / ih) : Math.max(W / iw, H / ih);
      const dw = iw * scale, dh = ih * scale;
      lc.drawImage(img, (W - dw) * pos.x, (H - dh) * pos.y, dw, dh);
    }
    if(adj && adj.tintOpacity > 0){
      const t = hexToRgb(adj.tintColor);
      lc.fillStyle = "rgba(" + t.r + "," + t.g + "," + t.b + "," + (adj.tintOpacity / 100) + ")";
      lc.fillRect(0, 0, W, H);
    }
    if(!adj){ ctx.drawImage(layer, 0, 0); return; }
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, adj.opacity / 100));
    if(typeof ctx.filter === "string"){
      ctx.filter = "brightness(" + adj.brightness + "%) blur(" + (adj.blur * k) + "px) saturate(" + adj.saturation + "%)";
    } else {
      spFallbackAdjust(lc, W, H, adj.brightness, adj.saturation);
    }
    ctx.drawImage(layer, 0, 0);
    ctx.restore();
  }

  // ===== 邊框樣式 (設定 › 輸出模式 › 圖片設定) =====
  // The frame ring and the number square are always cut from the SAME sheet of material (same
  // gradient, same coordinates — see spMaterialFill), so their colours match by construction.
  const SP_FRAME_STYLES = [
    { id: "stripe", label: "條紋" },
    { id: "metal", label: "金屬" },
    { id: "plastic", label: "塑料" },
    { id: "flat", label: "純色" },
    { id: "gradient", label: "漸層" },
    { id: "glass", label: "玻璃" },
    { id: "neon", label: "霓虹" },
    { id: "retro", label: "復古" },
    { id: "dots", label: "圓點" },
    { id: "shine", label: "閃耀" }
  ];
  function spFrameStyleOf(id){
    return SP_FRAME_STYLES.some(function(f){ return f.id === id; }) ? id : "stripe";
  }
  const SP_FRAME_BASE = { yellow: "#FFC928", blue: "#3D9BFF", none: "#4a5168" };
  // Polished-metal look: a mirror "horizon" (bright sky above, a sharp dark line, bright ground
  // below), top to bottom. No grain, no noise — just smooth reflections.
  const SP_CHROME = {
    yellow: [[0, "#fff9dc"], [0.16, "#ffe680"], [0.34, "#f0b929"], [0.46, "#d29411"], [0.54, "#fff1a8"], [0.70, "#f8cb4a"], [0.88, "#e6a81e"], [1, "#f7d970"]],
    blue:   [[0, "#eef7ff"], [0.16, "#a9d4ff"], [0.34, "#4f9cf0"], [0.46, "#2560ae"], [0.54, "#bfe0ff"], [0.70, "#6db2fa"], [0.88, "#2f76d0"], [1, "#4f93e6"]],
    none:   [[0, "#f4f6fb"], [0.16, "#cfd5e4"], [0.34, "#96a0b8"], [0.46, "#565d73"], [0.54, "#d3d9e8"], [0.70, "#a1a9bf"], [0.88, "#5f6882"], [1, "#858ea8"]]
  };

  // 閃耀: a thin, bright frame. Base tones are all light (no dark shading); a brighter tone lights up the
  // left edge between the top-left corner and the middle, and the opposite spot on the right edge.
  const SP_SHINE = {
    yellow: [[0, "#FFE274"], [0.5, "#FFD75A"], [1, "#FFDE6C"]],
    blue:   [[0, "#6FB8FF"], [0.5, "#4FA2FC"], [1, "#68AEFF"]],
    none:   [[0, "#A4ACC0"], [0.5, "#969FB5"], [1, "#9EA6BA"]]
  };
  const SP_SHINE_HI = { yellow: "255,251,222", blue: "240,248,255", none: "244,246,252" };
  // Frame width per style, as a fraction of the avatar size (the others use 0.07).
  function spFrameWidthFor(style){ return style === "shine" ? 0.045 : 0.07; }

  // hex colour moved toward white (amt > 0) or black (amt < 0).
  // With `alpha` given it returns an rgba() colour instead.
  function spShade(hex, amt, alpha){
    const c = hexToRgb(hex), t = amt >= 0 ? 255 : 0, k = Math.abs(amt);
    const m = function(v){ return Math.round(v + (t - v) * k); };
    return alpha === undefined
      ? "rgb(" + m(c.r) + "," + m(c.g) + "," + m(c.b) + ")"
      : "rgba(" + m(c.r) + "," + m(c.g) + "," + m(c.b) + "," + alpha + ")";
  }

  // The base paint for a style, as one avatar-sized sheet (x, y, size). The ring and the number
  // square are both filled from it.
  function spMaterialFill(ctx, style, kind, x, y, size){
    const base = SP_FRAME_BASE[kind];
    if(style === "metal"){
      const g = ctx.createLinearGradient(x, y, x, y + size);
      SP_CHROME[kind].forEach(function(st){ g.addColorStop(st[0], st[1]); });
      return g;
    }
    if(style === "plastic"){
      const g = ctx.createLinearGradient(x, y, x, y + size);
      g.addColorStop(0, spShade(base, 0.32));
      g.addColorStop(0.5, base);
      g.addColorStop(1, spShade(base, -0.28));
      return g;
    }
    if(style === "gradient"){
      const g = ctx.createLinearGradient(x, y, x + size, y + size);
      g.addColorStop(0, spShade(base, 0.42));
      g.addColorStop(0.55, base);
      g.addColorStop(1, spShade(base, -0.22));
      return g;
    }
    if(style === "glass"){
      const g = ctx.createLinearGradient(x, y, x + size, y + size);
      g.addColorStop(0, spShade(base, 0.3, 0.96));
      g.addColorStop(1, spShade(base, 0, 0.88));
      return g;
    }
    if(style === "shine"){
      const g = ctx.createLinearGradient(x, y, x + size, y + size);
      SP_SHINE[kind].forEach(function(st){ g.addColorStop(st[0], st[1]); });
      return g;
    }
    if(style === "neon") return spShade(base, 0.12);
    return base;            // flat, dots, retro
  }

  // A light edge on the top-left and a shadow on the bottom-right (swapped for an inset edge).
  // `pathFn` builds the outline to stroke; draw inside a clip so only the inner half shows.
  function spBevel(ctx, x, y, size, pathFn, width, lightA, darkA, inset){
    const g = ctx.createLinearGradient(x, y, x + size, y + size);
    const hi = "rgba(255,255,255," + lightA + ")", lo = "rgba(0,0,0," + darkA + ")";
    g.addColorStop(0, inset ? lo : hi);
    g.addColorStop(0.5, "rgba(128,128,128,0)");
    g.addColorStop(1, inset ? hi : lo);
    ctx.save();
    pathFn();
    ctx.lineWidth = width;
    ctx.strokeStyle = g;
    ctx.stroke();
    ctx.restore();
  }

  // The inner outline of the frame, with the number square's corner cut out of it. The frame
  // ring and the number square are then ONE shape (outer outline minus this), painted in a single
  // pass — so there is no seam or edge line where the square meets the ring.
  function spTraceNotchedInner(ctx, x, y, size, lw, radius, s, append){
    const ix = x + lw, iy = y + lw, iw = size - 2 * lw, r = Math.max(0, radius - lw);
    const tx = x + size - s, ty = y + size - s;
    if(!append) ctx.beginPath();
    ctx.moveTo(ix + r, iy);
    ctx.lineTo(ix + iw - r, iy);
    ctx.arcTo(ix + iw, iy, ix + iw, iy + r, r);
    ctx.lineTo(ix + iw, ty);
    ctx.lineTo(tx, ty);
    ctx.lineTo(tx, iy + iw);
    ctx.lineTo(ix + r, iy + iw);
    ctx.arcTo(ix, iy + iw, ix, iy + iw - r, r);
    ctx.lineTo(ix, iy + r);
    ctx.arcTo(ix, iy, ix + r, iy, r);
    ctx.closePath();
  }

  // Restrict the clip to everything except the number square's rectangle.
  function spClipOutTab(ctx, x, y, size, tx, ty){
    ctx.beginPath();
    ctx.rect(x - size, y - size, size * 3, size * 3);
    ctx.rect(tx, ty, size, size);
    ctx.clip("evenodd");
  }

  // Everything drawn on top of the base material, inside the clip of what is being painted.
  // geo = { part: "frame" (ring + number square as one shape) | "tab" (number square alone, for
  //         the unframed avatar), lw, radius, tx, ty, s }.
  // Edge lines are only put along the frame's own outline — never along the number square's
  // edges — so the square reads as a widening of the frame, not a separate piece stuck on.
  function spMaterialDecor(ctx, style, kind, x, y, size, geo){
    const base = SP_FRAME_BASE[kind];
    const frame = geo.part === "frame";
    const outerPath = function(){ spRoundRect(ctx, x, y, size, size, geo.radius); };
    const innerPath = function(inset){
      return function(){ spRoundRect(ctx, x + inset, y + inset, size - 2 * inset, size - 2 * inset, Math.max(0, geo.radius - inset)); };
    };
    const sheen = function(alpha, from, to){
      const sh = ctx.createLinearGradient(x, y, x + size, y + size);
      sh.addColorStop(0, "rgba(255,255,255,0)");
      sh.addColorStop(from, "rgba(255,255,255,0)");
      sh.addColorStop((from + to) / 2, "rgba(255,255,255," + alpha + ")");
      sh.addColorStop(to, "rgba(255,255,255,0)");
      sh.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = sh;
      ctx.fillRect(x, y, size, size);
    };
    // The inset edge along the frame's inside. It stops at the number square instead of running through it.
    const insetEdge = function(width, lightA, darkA){
      ctx.save();
      spClipOutTab(ctx, x, y, size, geo.tx, geo.ty);
      spBevel(ctx, x, y, size, innerPath(geo.lw), width, lightA, darkA, true);
      ctx.restore();
    };

    if(style === "metal"){
      sheen(0.30, 0.16, 0.46);
      sheen(0.14, 0.62, 0.84);
      if(frame){
        const lw = geo.lw;
        spBevel(ctx, x, y, size, innerPath(lw * 0.3), lw * 0.14, 0.95, 0, false);   // crisp specular line
        spBevel(ctx, x, y, size, outerPath, lw * 0.34, 0.9, 0.5, false);
        insetEdge(lw * 0.34, 0.6, 0.5);
      }
    } else if(style === "plastic"){
      const gg = ctx.createLinearGradient(x, y, x + size * 0.85, y + size * 0.85);
      gg.addColorStop(0, "rgba(255,255,255,0.62)");
      gg.addColorStop(0.3, "rgba(255,255,255,0.16)");
      gg.addColorStop(0.55, "rgba(255,255,255,0)");
      ctx.fillStyle = gg;
      ctx.fillRect(x, y, size, size);
      if(frame){
        const lw = geo.lw;
        spBevel(ctx, x, y, size, innerPath(lw * 0.32), lw * 0.16, 0.95, 0, false);
        spBevel(ctx, x, y, size, outerPath, lw * 0.3, 0.45, 0.4, false);
        insetEdge(lw * 0.28, 0.25, 0.4);
      }
    } else if(style === "shine"){
      // Two thin bright streaks running ALONG the edge itself (not a glow spreading outward): one on
      // the left edge between the top-left corner and the middle, one at the opposite point
      // (diagonally) on the right edge. Confined to the ring's own width. Each fades out to nothing
      // on its own well before it would reach the number square, so the streak stays one smooth,
      // uninterrupted taper rather than being cut off by the square's edge.
      const hi = SP_SHINE_HI[kind];
      // A vertical streak of the given length centred at (cx, cy), as wide as the ring itself,
      // fading to nothing at both ends.
      const streak = function(cx, cy, len, alpha){
        const g = ctx.createLinearGradient(0, cy - len / 2, 0, cy + len / 2);
        g.addColorStop(0, "rgba(" + hi + ",0)");
        g.addColorStop(0.5, "rgba(" + hi + "," + alpha + ")");
        g.addColorStop(1, "rgba(" + hi + ",0)");
        ctx.fillStyle = g;
        ctx.fillRect(cx - geo.lw / 2, cy - len / 2, geo.lw, len);
      };
      if(frame){    // (the lone number square of an unframed avatar stays plain, so its digits keep their contrast)
        streak(x + geo.lw / 2, y + size * 0.22, size * 0.38, 0.95);
        streak(x + size - geo.lw / 2, y + size * 0.56, size * 0.38, 0.95);
      }
    } else if(style === "gradient"){
      if(frame) spBevel(ctx, x, y, size, outerPath, geo.lw * 0.22, 0.4, 0.22, false);
    } else if(style === "glass"){
      sheen(0.36, 0.0, 0.42);
      if(frame){
        spBevel(ctx, x, y, size, outerPath, geo.lw * 0.2, 0.75, 0.25, false);
        insetEdge(geo.lw * 0.2, 0.9, 0.15);
      }
    } else if(style === "neon"){
      if(frame){
        // bright tube down the middle of the ring; it ends where the number square begins
        ctx.save();
        spClipOutTab(ctx, x, y, size, geo.tx, geo.ty);
        innerPath(geo.lw / 2)();
        ctx.lineWidth = geo.lw * 0.3;
        ctx.strokeStyle = "rgba(255,255,255,0.85)";
        ctx.stroke();
        ctx.restore();
      }
    } else if(style === "retro"){
      // hard, unblended bevel: light on the top and left, dark on the bottom and right
      const hi = spShade(base, 0.4), lo = spShade(base, -0.4);
      if(frame){
        const t = geo.lw * 0.34;
        ctx.fillStyle = hi;
        ctx.fillRect(x, y, size, t);
        ctx.fillRect(x, y, t, size);
        ctx.fillStyle = lo;
        ctx.fillRect(x, y + size - t, size, t);
        ctx.fillRect(x + size - t, y, t, size);
      } else {
        const t = geo.s * 0.14;
        ctx.fillStyle = hi;
        ctx.fillRect(geo.tx, geo.ty, geo.s, t);
        ctx.fillRect(geo.tx, geo.ty, t, geo.s);
        ctx.fillStyle = lo;
        ctx.fillRect(geo.tx, geo.ty + geo.s - t, geo.s, t);
        ctx.fillRect(geo.tx + geo.s - t, geo.ty, t, geo.s);
      }
    } else if(style === "dots"){
      // a staggered grid of light dots, the same over the ring and the number square
      const step = Math.max(5, size * 0.035);
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      let row = 0;
      for(let py = y; py < y + size + step; py += step * 0.86, row++){
        for(let px = x + (row % 2 ? step / 2 : 0); px < x + size + step; px += step){
          ctx.beginPath();
          ctx.arc(px, py, step * 0.24, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  // The original number square (stripe style only): drawn under the frame ring, which overlaps it.
  function spPaintStripeTab(ctx, kind, x, y, size, s){
    const tx = x + size - s, ty = y + size - s;
    ctx.fillStyle = SP_FRAME_BASE[kind];
    ctx.fillRect(tx, ty, s, s);
    // Same light diagonal stripes (and phase) as the frame, a little softer
    // so the number stays easy to read.
    const stripeStep = Math.max(6, size * 0.07 * 0.9);
    ctx.strokeStyle = "rgba(255,255,255," + (kind === "none" ? 0.2 : 0.32) + ")";
    ctx.lineWidth = stripeStep * 0.4;
    ctx.beginPath();
    for(let t = -size; t < size * 2; t += stripeStep){
      ctx.moveTo(x + t, y + size);
      ctx.lineTo(x + t + size, y);
    }
    ctx.stroke();
  }

  // Every style except stripe: frame ring and number square painted as one piece of material.
  function spPaintFrame(ctx, style, kind, x, y, size, radius, s){
    const tx = x + size - s, ty = y + size - s, lw = size * spFrameWidthFor(style);
    if(style === "neon" && kind !== "none") spNeonGlow(ctx, kind, x, y, size, lw, radius, s);
    ctx.save();
    if(kind === "none"){
      // no ring: just the number square, clipped to the avatar's rounded corner
      spRoundRect(ctx, x, y, size, size, radius);
      ctx.clip();
      ctx.beginPath();
      ctx.rect(tx, ty, s, s);
      ctx.clip();
      ctx.fillStyle = spMaterialFill(ctx, style, kind, x, y, size);
      ctx.fillRect(tx, ty, s, s);
      spMaterialDecor(ctx, style, kind, x, y, size, { part: "tab", lw: lw, radius: radius, tx: tx, ty: ty, s: s });
    } else {
      spRoundRect(ctx, x, y, size, size, radius);
      spTraceNotchedInner(ctx, x, y, size, lw, radius, s, true);
      ctx.clip("evenodd");
      ctx.fillStyle = spMaterialFill(ctx, style, kind, x, y, size);
      ctx.fillRect(x, y, size, size);
      spMaterialDecor(ctx, style, kind, x, y, size, { part: "frame", lw: lw, radius: radius, tx: tx, ty: ty, s: s });
    }
    ctx.restore();
  }

  // Neon only: the glow the frame casts inward onto the avatar (it wraps around the number square too).
  // Drawn BEFORE the frame, and clipped to the whole avatar rather than to the inside of the frame:
  // the frame then simply covers the overlap. (Clipping both to the same edge leaves a faint seam
  // where their anti-aliased edges meet.)
  function spNeonGlow(ctx, kind, x, y, size, lw, radius, s){
    const base = SP_FRAME_BASE[kind];
    ctx.save();
    spRoundRect(ctx, x, y, size, size, radius);
    ctx.clip();
    spTraceNotchedInner(ctx, x, y, size, lw, radius, s);
    ctx.shadowColor = spShade(base, 0.1);
    ctx.shadowBlur = lw * 2;
    ctx.lineWidth = lw * 0.6;
    ctx.strokeStyle = spShade(base, 0.12);
    ctx.stroke();
    ctx.restore();
  }

  // Small preview for the settings: a yellow, a blue and an unframed sample (numbers 1, 6, 10).
  function spDrawFramePreview(canvas, styleId, numFontId){
    if(!canvas || !canvas.getContext) return;
    const ctx = canvas.getContext("2d");
    if(!ctx) return;
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#161a27";
    ctx.fillRect(0, 0, W, H);
    const size = Math.round(H * 0.72), gap = Math.round(size * 0.22);
    const x0 = Math.round((W - (3 * size + 2 * gap)) / 2), y0 = Math.round((H - size) / 2);
    const nf = spFontById(numFontId);
    const fam = spFontStack(nf, "sans-serif");
    ["yellow", "blue", "none"].forEach(function(kind, i){
      spDrawAvatar(ctx, { name: "" }, null, x0 + i * (size + gap), y0, size, kind, [1, 6, 10][i], nf, fam, spFrameStyleOf(styleId));
    });
  }

  function spDrawAvatar(ctx, st, img, x, y, size, kind, order, numFont, numFamily, frameStyle){
    const style = spFrameStyleOf(frameStyle);
    const radius = size * 0.1;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.35)";
    ctx.shadowBlur = size * 0.08;
    ctx.shadowOffsetY = size * 0.03;
    spRoundRect(ctx, x, y, size, size, radius);
    ctx.fillStyle = "#2b3245";
    ctx.fill();
    ctx.restore();

    ctx.save();
    spRoundRect(ctx, x, y, size, size, radius);
    ctx.clip();
    if(img){
      const sc = Math.max(size / img.naturalWidth, size / img.naturalHeight);
      const dw = img.naturalWidth * sc, dh = img.naturalHeight * sc;
      ctx.drawImage(img, x + (size - dw) / 2, y + (size - dh) / 2, dw, dh);
    } else {
      // No avatar: fall back to the name so the slot is still identifiable.
      let fontPx = size * 0.2;
      const label = st.name;
      ctx.fillStyle = "#cfd6e6";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for(let i = 0; i < 14; i++){
        ctx.font = "700 " + fontPx + "px sans-serif";
        if(ctx.measureText(label).width <= size * 0.86) break;
        fontPx *= 0.88;
      }
      ctx.fillText(label, x + size / 2, y + size / 2);
    }
    ctx.restore();

    // Number square: bottom-right corner, in the frame's colour. Stripe style keeps the original
    // layering — the square is drawn *underneath* the frame ring, which overlaps it, so it looks tucked
    // under the border (clipped to the avatar's rounded outline so the corner follows the curve).
    // Every other style paints ring + square as one piece of material (spPaintFrame).
    const tabSide = size * SP_TAB_RATIO;
    if(style !== "stripe"){
      spPaintFrame(ctx, style, kind, x, y, size, radius, tabSide);
    } else {
      ctx.save();
      spRoundRect(ctx, x, y, size, size, radius);
      ctx.clip();
      ctx.beginPath();
      ctx.rect(x + size - tabSide, y + size - tabSide, tabSide, tabSide);
      ctx.clip();
      spPaintStripeTab(ctx, kind, x, y, size, tabSide);
      ctx.restore();

      if(kind !== "none"){
        // Frame = ring between the outer and inner rounded rects, with light
        // diagonal stripes drawn over it (clipped to the ring).
        const lw = size * 0.07;
        ctx.save();
        spRoundRect(ctx, x, y, size, size, radius);
        spRoundRect(ctx, x + lw, y + lw, size - 2 * lw, size - 2 * lw, Math.max(0, radius - lw), true);
        ctx.fillStyle = SP_FRAME_COLORS[kind];
        ctx.fill("evenodd");
        ctx.clip("evenodd");
        const step = Math.max(6, lw * 0.9);
        ctx.strokeStyle = "rgba(255,255,255,0.42)";
        ctx.lineWidth = step * 0.4;
        ctx.beginPath();
        for(let t = -size; t < size * 2; t += step){
          ctx.moveTo(x + t, y + size);
          ctx.lineTo(x + t + size, y);
        }
        ctx.stroke();
        ctx.restore();
      }
    }

    // The number, on top of everything, centred in the whole number square
    // (frame ring included) — the same size and position for every frame
    // colour, exactly as on the uncoloured last square. The glyph's real
    // bounding box is measured so the digits are optically centred, then the
    // centre is nudged slightly up-left: the square sits in the avatar's
    // rounded bottom-right corner (and under the ring), which otherwise makes
    // a mathematically centred number look pushed toward the corner.
    let numPx = tabSide * 0.66;
    const numColor = kind === "yellow" ? "#2a2200" : "#ffffff";
    const numStr = String(order);
    const nudge = tabSide * 0.025;
    const cx = x + size - tabSide / 2 - nudge;
    const cy = y + size - tabSide / 2 - nudge;
    const embedded = !!(numFont && numFont.family);
    const fam = numFamily || "sans-serif";
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    if(embedded){
      // Fonts differ a lot in how tall their digits are: scale so the digits
      // are as tall as the default font's (~47.5% of the square).
      ctx.font = "900 100px " + fam;
      const m0 = ctx.measureText("0");
      const h0 = m0.actualBoundingBoxAscent + m0.actualBoundingBoxDescent;
      if(h0 > 0) numPx = 100 * tabSide * 0.475 / h0;
    }
    ctx.font = "900 " + numPx + "px " + fam;
    let tm = ctx.measureText(numStr);
    if(embedded){
      // ...and keep wide two-digit numbers (10) inside the square.
      const wNum = tm.actualBoundingBoxLeft + tm.actualBoundingBoxRight;
      const wMax = tabSide * 0.92;
      if(wNum > wMax){
        numPx *= wMax / wNum;
        ctx.font = "900 " + numPx + "px " + fam;
        tm = ctx.measureText(numStr);
      }
    }
    let numX = cx, numY = cy + numPx * 0.36;   // fallback if metrics are unavailable
    if(tm && typeof tm.actualBoundingBoxAscent === "number"){
      numX = cx - (tm.actualBoundingBoxRight - tm.actualBoundingBoxLeft) / 2;
      numY = cy + (tm.actualBoundingBoxAscent - tm.actualBoundingBoxDescent) / 2;
    }
    // Stroke in the same colour as the fill to make the digits heavier.
    ctx.lineJoin = "round";
    // Extra "heavier digits" outline; very heavy fonts (numStroke: 0) don't need it
    // and it would fill in their counters (6, 8, 9, 0).
    const numStrokeK = (numFont && typeof numFont.numStroke === "number") ? numFont.numStroke : 0.06;
    ctx.lineWidth = numPx * (numStrokeK + (numFont && numFont.boost ? numFont.boost : 0));
    ctx.strokeStyle = numColor;
    if(style !== "stripe" && style !== "shine"){
      // Shiny/plain surfaces need a little help: a soft halo behind the digits.
      ctx.shadowColor = kind === "yellow" ? "rgba(255,255,255,0.55)" : "rgba(0,0,0,0.5)";
      ctx.shadowBlur = numPx * 0.12;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = numPx * 0.03;
    }
    ctx.strokeText(numStr, numX, numY);
    ctx.fillStyle = numColor;
    ctx.fillText(numStr, numX, numY);
    ctx.restore();
  }

  const SP_TITLE_FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif';

  // `ranks[i]` (optional) = priority position (0-based) of list[i]. Avatars stay in
  // `list` order (same as 輸出模式); only the frame colour and number follow the rank.
  async function spRenderCanvas(canvas, list, bg, cache, isCurrent, title, ranks, wm){
    const load = function(src){
      if(!src) return Promise.resolve(null);
      if(!cache.has(src)) cache.set(src, spLoadImage(src));
      return cache.get(src);
    };
    const bgImg = bg && bg.dataUrl ? await load(bg.dataUrl) : null;
    const avatarImgs = await Promise.all(list.map(function(st){ return load(st.avatar); }));
    await spLoadFonts();
    if(!isCurrent()) return;
    const titleFont = spFontById(appSettings.skillPrioTitleFont);
    const numFont = spFontById(appSettings.skillPrioNumFont);
    const titleFamily = spFontStack(titleFont, SP_TITLE_FONT);
    const numFamily = spFontStack(numFont, "sans-serif");
    const frameStyle = spFrameStyleOf(appSettings.skillPrioFrameStyle);

    const LONG = 1600;
    const ratio = spRatioValue(bgImg);
    const W = ratio >= 1 ? LONG : Math.round(LONG * ratio);
    const H = ratio >= 1 ? Math.round(LONG / ratio) : LONG;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");

    // No background at all (背景：無) stays transparent in the PNG; the base
    // colour is only painted once a background has been chosen (upload / UI).
    if(bg){
      ctx.fillStyle = bg.baseColor || spDefaultBase();
      ctx.fillRect(0, 0, W, H);
    }
    if(bgImg) spDrawBackground(ctx, W, H, bgImg, bg.adjust || null);
    const wmUnder = !!(wm && wm.layer === "under");
    if(wmUnder) spDrawWatermark(ctx, W, H, wm);   // 底層: behind the title and the avatars

    const n = list.length;
    const rows = spRowSplit(n);
    const kinds = spFrameKinds(n);
    const GAP = 0.14;
    const margin = 0.06 * Math.min(W, H);

    // Vertical layout: the space above the title, between the title and the
    // avatars, and below the avatars is all the same, so the title sits
    // the same distance from the edge as from the characters.
    const titleSize = Math.round(Math.min(W, H) * 0.075);
    const titleH = titleSize * 0.95;
    const minGap = margin * 0.8;
    const maxCols = Math.max.apply(null, rows);
    const wLimit = (W - 2 * margin) / (maxCols + GAP * (maxCols - 1));
    const vUnits = rows.length + (rows.length - 1) * GAP;
    const hLimit = (H - titleH - 3 * minGap) / vUnits;
    const multiRow = rows.length > 1;
    let size = Math.floor(Math.max(1, Math.min(wLimit, hLimit, H * 0.5)));
    // Two-row layouts (7–9 people) used to grow until they filled the whole
    // height and felt cramped. Cap them at about the size of a 6-per-row
    // avatar so they get the same breathing room the 10-person layout has.
    // Fewer than 6 people: keep the avatars at the size of a full 6-person
    // row (just centred) instead of letting them grow huge.
    const refSize = (W - 2 * margin) / (6 + GAP * 5);
    if(multiRow){
      size = Math.min(size, Math.floor(refSize * 1.08));
    } else {
      size = Math.min(size, Math.floor(refSize));
    }
    const gap = size * GAP;
    const rowGap = gap;
    const totalH = rows.length * size + (rows.length - 1) * rowGap;
    const edgeGap = Math.max(minGap, (H - titleH - totalH) / 3);
    // Single row: don't spread the leftover height into three equal gaps
    // (that pushed the avatars to the bottom half). Keep the title close to
    // the avatars and centre that title+avatars group vertically instead.
    // Two rows keep the original equal-thirds spacing.
    const titleGap = multiRow ? edgeGap : Math.min(edgeGap, Math.max(minGap, size * 0.45));
    const topPad = multiRow ? edgeGap : Math.max(0, (H - (titleH + titleGap + totalH)) / 2);
    const titleY = topPad + titleH / 2;
    ctx.save();
    ctx.font = "800 " + titleSize + "px " + titleFamily;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.lineWidth = titleSize * 0.16;
    ctx.strokeStyle = "rgba(20,24,38,0.75)";
    ctx.strokeText(title, W / 2, titleY);
    if(titleFont.boost){
      // Light-weight-only font: thicken it with a white stroke.
      ctx.lineWidth = titleSize * titleFont.boost;
      ctx.strokeStyle = "#ffffff";
      ctx.strokeText(title, W / 2, titleY);
    }
    ctx.fillStyle = "#ffffff";
    ctx.fillText(title, W / 2, titleY);
    ctx.restore();

    let y = topPad + titleH + titleGap;
    let idx = 0;
    rows.forEach(function(count){
      const totalW = count * size + (count - 1) * gap;
      let x = (W - totalW) / 2;
      for(let i = 0; i < count; i++){
        const rk = ranks ? ranks[idx] : idx;
        spDrawAvatar(ctx, list[idx], avatarImgs[idx], Math.round(x), Math.round(y), size, kinds[rk], rk + 1, numFont, numFamily, frameStyle);
        x += size + gap;
        idx++;
      }
      y += size + rowGap;
    });
    if(!wmUnder) spDrawWatermark(ctx, W, H, wm);
  }

  // ---- 匯出除錯資料 ----
  // 長字串（圖片 data URL、字型等）只留「類型＋長度」，其餘原樣保留。
  function diagSanitize(v, depth){
    if(typeof v === "string"){
      if(v.length <= 300) return v;
      const m = /^data:([^;,]+)/.exec(v);
      return "[字串 " + v.length + " 字元" + (m ? "，" + m[1] : "") + "]";
    }
    if(v == null || typeof v !== "object") return v;
    if((depth || 0) > 6) return "[巢狀過深]";
    if(Array.isArray(v)) return v.map(function(x){ return diagSanitize(x, (depth || 0) + 1); });
    const o = {};
    Object.keys(v).forEach(function(k){ o[k] = diagSanitize(v[k], (depth || 0) + 1); });
    return o;
  }
  async function diagSafe(fn){
    try{ return await fn(); }
    catch(err){ return { _error: String((err && err.message) || err) }; }
  }
  async function buildDiagnostics(){
    const nav = navigator;
    const mm = function(q){ return window.matchMedia ? window.matchMedia(q).matches : null; };
    const out = {
      type: "ba-roster-diagnostics", version: 1,
      exportedAt: new Date().toISOString(),
      note: "不含圖片；長字串只記長度。",
      env: {
        userAgent: nav.userAgent, platform: nav.platform, language: nav.language,
        online: nav.onLine, cookieEnabled: nav.cookieEnabled,
        screen: screen.width + "x" + screen.height, viewport: innerWidth + "x" + innerHeight,
        devicePixelRatio: window.devicePixelRatio,
        hoverCapable: mm("(hover:hover)"), coarsePointer: mm("(pointer:coarse)"),
        prefersDark: mm("(prefers-color-scheme: dark)"), prefersReducedMotion: mm("(prefers-reduced-motion: reduce)"),
        compressionStream: typeof CompressionStream !== "undefined",
        decompressionStream: typeof DecompressionStream !== "undefined",
        // 只記協定、網域和檔名；本機檔案不記資料夾路徑（會帶出使用者名稱）
        pageUrl: location.protocol + "//" + (location.host || "（本機檔案）") + "/" + (location.pathname.split("/").pop() || "")
      },
      appSettings: diagSanitize(appSettings),
      storageEstimate: await diagSafe(async function(){
        if(!(nav.storage && nav.storage.estimate)) return null;
        const e = await nav.storage.estimate();
        return { usage: e.usage, quota: e.quota };
      }),
      localStorage: await diagSafe(function(){
        const o = {};
        for(let i = 0; i < localStorage.length; i++){
          const k = localStorage.key(i);
          // 同一個網域下的 localStorage 可能被其他網頁共用，只匯出本工具自己的項目
          if(k.indexOf("ba-roster") !== 0) continue;
          const raw = localStorage.getItem(k) || "";
          if(k === SYNC_KEY){ o[k] = { chars: raw.length, value: "（已隱藏：含雲端同步 token）" }; continue; }
          let val = raw;
          if(raw.length > 300){
            try{ val = diagSanitize(JSON.parse(raw)); }catch(_){ val = diagSanitize(raw); }
            if(typeof val === "string" && val.length > 300) val = diagSanitize(raw);
          } else {
            try{ val = JSON.parse(raw); }catch(_){}
          }
          o[k] = { chars: raw.length, value: val };
        }
        return o;
      }),
      database: await diagSafe(async function(){
        const schools = await getAllSchools();
        const students = await getAllStudents();
        return {
          name: DB_NAME, version: DB_VERSION,
          schoolCount: schools.length, studentCount: students.length,
          schools: schools.map(function(x){ return diagSanitize(x); }),
          students: students.map(function(x){ return diagSanitize(x); })
        };
      }),
      presetsDb: await diagSafe(async function(){
        if(!indexedDB.databases) return "（此瀏覽器無法列出資料庫）";
        const list = await indexedDB.databases();
        if(!list.some(function(d){ return d.name === "ba_roster_sp_presets"; })) return "（不存在）";
        const pdb = await new Promise(function(res, rej){
          const r = indexedDB.open("ba_roster_sp_presets", 1);
          r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); };
        });
        try{
          const rows = await new Promise(function(res, rej){
            const r = pdb.transaction("presets", "readonly").objectStore("presets").getAll();
            r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); };
          });
          return rows.map(function(x){ return diagSanitize(x); });
        } finally { pdb.close(); }
      }),
      recentErrors: diagErrorLog.slice()
    };
    return out;
  }
  async function exportDiagnostics(){
    try{
      const info = await buildDiagnostics();
      const blob = new Blob([JSON.stringify(info, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "ba-roster-diagnostics-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast("已匯出除錯資料");
    } catch(err){
      alert("匯出除錯資料失敗：" + ((err && err.message) || err));
    }
  }

  // 匯出用：依設定把卡片圖片轉成匯出檔要的格式（只動匯出檔的副本，不會改資料庫）
  async function convertAvatarForExport(dataUrl, mode){
    if(mode !== "none" && mode !== "all") return dataUrl;
    if(typeof dataUrl !== "string" || !/^data:image\//.test(dataUrl)) return dataUrl;
    const isWebp = /^data:image\/webp/.test(dataUrl);
    if(mode === "none" && !isWebp) return dataUrl;
    if(mode === "all" && isWebp) return dataUrl;
    try{
      const img = await new Promise(function(res, rej){
        const im = new Image(); im.onload = function(){ res(im); }; im.onerror = rej; im.src = dataUrl;
      });
      const c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext("2d").drawImage(img, 0, 0);
      if(mode === "none") return c.toDataURL("image/png");
      const w = c.toDataURL("image/webp", 0.9);
      return /^data:image\/webp/.test(w) ? w : dataUrl;   // 不支援輸出 WebP 時保留原圖
    } catch(_){ return dataUrl; }
  }

  // 備份內容（匯出檔與雲端同步共用）。avMode：卡片圖片的匯出格式（none／keep／all）
  async function buildBackupPayload(avMode){
    const allSchools = await getAllSchools();
    const allStudents = await Promise.all((await getAllStudents()).filter(function(s){ return !s.borrowed; }).map(async function(st){
      if(!st.avatar || (avMode !== "none" && avMode !== "all")) return st;
      return Object.assign({}, st, { avatar: await convertAvatarForExport(st.avatar, avMode) });
    }));
    const payload = {
      type: "ba-roster-backup", version: 3,
      exportedAt: new Date().toISOString(),
      // iconRaw (the un-baked master behind a black-background icon) is only
      // meaningful — and only included — for schools that actually have the
      // black background applied; for every other school it's identical to
      // icon anyway, so omitting it there keeps backups roughly half the
      // size for icon data without losing anything importBackup needs (see
      // putSchool call below, which falls back to icon when it's absent).
      schools: allSchools.map(function(s){
        return {
          id:s.id, name:s.name, icon:s.icon || null,
          iconRaw: s.iconBlackBg ? (s.iconRaw || null) : null,
          iconBlackBg:!!s.iconBlackBg
        };
      }),
      students: allStudents,
      // Abbreviation meanings and custom variant-group definitions live in
      // localStorage, not IndexedDB, so they're included here explicitly —
      // otherwise a restore on a different browser/device would silently
      // lose every meaning the user typed in and every custom group name.
      abbrevList: loadAbbrevList(),
      variantGroups: loadVariantGroupsMap()
    };
    return payload;
  }

  async function exportBackup(){
    const payload = await buildBackupPayload(appSettings.avatarExportWebp);
    // Gzip the JSON before downloading when the setting requests it and the
    // browser supports CompressionStream (native, no library needed) —
    // backups are mostly base64 image data and JSON structure, both of
    // which compress well, so this typically shrinks the file
    // substantially. The person can opt out in 通用設定 → 進階設定 for a
    // plain, human-readable/editable .json instead — that path uses
    // indented JSON (2-space) so it's actually readable/editable in a text
    // editor, which is the whole point of choosing "plain" in the first
    // place; the gzip path uses compact JSON since indentation there just
    // adds bytes to compress for no benefit (nobody reads the raw bytes of
    // a .gz file directly). importBackup() always auto-detects which kind
    // it's looking at by content (gzip magic bytes), not by file extension
    // or this setting, so both remain importable regardless of which was
    // chosen at export time.
    const stamp = new Date().toISOString().slice(0,10);
    let blob, filename;
    if(appSettings.exportFormat !== "plain" && typeof CompressionStream !== "undefined"){
      try{
        const compactJson = JSON.stringify(payload);
        const stream = new Blob([compactJson]).stream().pipeThrough(new CompressionStream("gzip"));
        blob = await new Response(stream).blob();
        filename = "ba-roster-backup-" + stamp + ".json.gz";
      } catch(err){
        blob = null;
      }
    }
    if(!blob){
      const readableJson = JSON.stringify(payload, null, 2);
      blob = new Blob([readableJson], { type:"application/json" });
      filename = "ba-roster-backup-" + stamp + ".json";
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // Combines a locally-stored abbreviation list with one from an imported
  // backup: existing entries are kept as-is (never overwritten), entries
  // that only exist in the import are added, and if a shared abbreviation
  // has no meaning locally but does in the import, that meaning is filled
  // in. Used for "merge" imports; "replace" imports use the import as-is.
  function mergeAbbrevLists(localList, importedList){
    if(!Array.isArray(importedList)) return localList;
    const map = {};
    (localList || []).forEach(function(r){
      map[(r.abbr || "").toLowerCase()] = { abbr: r.abbr, meaning: r.meaning || "" };
    });
    importedList.forEach(function(r){
      const key = (r.abbr || "").toLowerCase();
      if(!key) return;
      if(!map[key]) map[key] = { abbr: r.abbr, meaning: r.meaning || "" };
      else if(!map[key].meaning && r.meaning) map[key].meaning = r.meaning;
    });
    return Object.keys(map).map(function(k){ return map[k]; })
      .sort(function(a, b){ return (a.abbr || "").toLowerCase().localeCompare((b.abbr || "").toLowerCase()); });
  }

  // Combines locally-stored custom variant-group definitions (keyed by base
  // character name) with ones from an imported backup: groups are matched
  // by id, existing groups are kept as-is, and groups that only exist in
  // the import are added under their base name. Used for "merge" imports;
  // "replace" imports use the import as-is.
  function mergeVariantGroupsMaps(localMap, importedMap){
    if(!importedMap || typeof importedMap !== "object") return localMap || {};
    const result = Object.assign({}, localMap || {});
    Object.keys(importedMap).forEach(function(baseName){
      const importedGroups = Array.isArray(importedMap[baseName]) ? importedMap[baseName] : [];
      const existingGroups = Array.isArray(result[baseName]) ? result[baseName].slice() : [];
      const existingIds = {};
      existingGroups.forEach(function(g){ if(g && g.id) existingIds[g.id] = true; });
      importedGroups.forEach(function(g){
        if(g && g.id && !existingIds[g.id]){
          existingGroups.push(g);
          existingIds[g.id] = true;
        }
      });
      if(existingGroups.length) result[baseName] = existingGroups;
    });
    return result;
  }

  // One-time cleanup for records saved before custom variant groups
  // existed (or by earlier versions of this app that always wrote
  // variantIndependent:false on every save): each student still carrying
  // this now-unused field is cleaned up — a true flag is migrated into a
  // real, named, stored group (mirroring what happened automatically the
  // next time such a record used to be opened and saved in the student
  // form); either way the dead field itself is removed so it doesn't keep
  // getting carried around (and re-exported in backups) forever.
  async function migrateLegacyVariantIndependent(){
    const all = await getAllStudents();
    let changed = false;
    for(const s of all){
      if(!("variantIndependent" in s)) continue;
      if(s.variantIndependent){
        const baseName = getBaseVariantName(s.name);
        const groups = getVariantGroupsForBase(baseName);
        const newGroup = { id: uid(), name: "組別" + (groups.length + 2) };
        groups.push(newGroup);
        setVariantGroupsForBase(baseName, groups);
        s.variantGroupId = newGroup.id;
      }
      delete s.variantIndependent;
      await putStudent(s);
      changed = true;
    }
    return changed;
  }

  // 讀取檔案內容：自動判斷是否 gzip，再解析成 JSON。label 用在錯誤訊息（例如「備份檔」「設定檔」）
  async function readJsonBuffer(buffer, label){
    let text;
    try{
      const head = new Uint8Array(buffer.slice(0, 2));
      const isGzip = head[0] === 0x1f && head[1] === 0x8b;
      if(isGzip){
        if(typeof DecompressionStream === "undefined"){
          throw new Error("這個瀏覽器不支援解壓縮檔案，請改用較新版的 Chrome / Edge / Safari。");
        }
        const stream = new Blob([buffer]).stream().pipeThrough(new DecompressionStream("gzip"));
        text = await new Response(stream).text();
      } else {
        text = new TextDecoder("utf-8").decode(buffer);
      }
    } catch(err){
      if(err && /瀏覽器不支援/.test(err.message)) throw err;
      throw new Error("這個檔案不是有效的" + label + "。");
    }
    try{ return JSON.parse(text); }
    catch(err){ throw new Error("這個檔案不是有效的 JSON " + label + "。"); }
  }

  // 讀取備份內容（檔案或雲端共用），格式不對會丟出帶中文訊息的 Error
  async function parseBackupBuffer(buffer){
    const data = await readJsonBuffer(buffer, "備份檔");
    if(!data || !Array.isArray(data.schools) || !Array.isArray(data.students)){
      throw new Error("檔案格式不符，無法匯入。");
    }
    return data;
  }

  // ---------- 設定備份：所有設定與圖片（含背景圖片、各背景方案）----------
  // 不含學生資料（那是「匯出備份」）；也不含雲端同步的 token，簡寫清單與變體群組屬於資料備份，同樣不放在這裡。
  const SETTINGS_EXPORT_SKIP = ["ba-roster-sync", "ba-roster-abbrev-list", "ba-roster-variant-groups"];
  function settingsKeyOk(k){ return typeof k === "string" && k.indexOf("ba-roster") === 0 && SETTINGS_EXPORT_SKIP.indexOf(k) < 0; }
  function settingsLocalKeys(){
    const out = [];
    for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(settingsKeyOk(k)) out.push(k); }
    return out;
  }
  async function exportSettingsFile(){
    await bgSlotsReady;
    const ls = {};
    settingsLocalKeys().forEach(function(k){ ls[k] = localStorage.getItem(k); });
    const slots = {};
    for(let i = 1; i <= BG_SLOT_MAX; i++){ if(bgSlotCache[i]) slots[i] = bgSlotCache[i]; }
    const payload = { type: "ba-roster-settings", version: 1, exportedAt: new Date().toISOString(), localStorage: ls, bgSlots: slots };
    const bytes = await syncPack(payload);
    const gz = bytes.length > 1 && bytes[0] === 0x1f && bytes[1] === 0x8b;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([bytes], { type: gz ? "application/gzip" : "application/json" }));
    a.download = "ba-roster-settings-" + new Date().toISOString().slice(0, 10) + (gz ? ".json.gz" : ".json");
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }
  async function importSettingsFile(file){
    let data;
    try{ data = await readJsonBuffer(await file.arrayBuffer(), "設定檔"); }
    catch(err){ alert(err.message); return; }
    if(!data || data.type !== "ba-roster-settings" || !data.localStorage || typeof data.localStorage !== "object"){
      alert("這不是設定匯出檔（請選用「匯出設定」產生的檔案）。"); return;
    }
    const entries = Object.keys(data.localStorage).filter(function(k){ return settingsKeyOk(k) && typeof data.localStorage[k] === "string"; });
    const slotNums = Object.keys(data.bgSlots || {}).map(Number).filter(function(n){ return n >= 1 && n <= BG_SLOT_MAX && data.bgSlots[n] && typeof data.bgSlots[n] === "object"; });
    if(!entries.length && !slotNums.length){ alert("檔案裡沒有可匯入的設定。"); return; }
    if(!window.confirm("匯入設定會取代目前所有的設定（含背景圖片與各背景方案），學生資料不受影響。\n\n檔案內容：" + entries.length + " 項設定、" + slotNums.length + " 個背景方案。\n要繼續嗎？")) return;
    const old = {};
    settingsLocalKeys().forEach(function(k){ old[k] = localStorage.getItem(k); });
    try{
      Object.keys(old).forEach(function(k){ localStorage.removeItem(k); });
      entries.forEach(function(k){ localStorage.setItem(k, data.localStorage[k]); });
    }catch(err){
      // 寫到一半失敗（例如瀏覽器儲存空間不足）：還原成原本的設定
      try{
        settingsLocalKeys().forEach(function(k){ localStorage.removeItem(k); });
        Object.keys(old).forEach(function(k){ localStorage.setItem(k, old[k]); });
      }catch(_){}
      alert("匯入失敗：瀏覽器儲存空間不足，已保留原本的設定。");
      return;
    }
    try{
      await bgSlotsReady;
      for(let i = 1; i <= BG_SLOT_MAX; i++){
        if(slotNums.indexOf(i) >= 0) await bgSlotPut(i, bgSlotSnapshot(data.bgSlots[i]));
        else await bgSlotDelete(i);
      }
    }catch(_){}
    bgSlotsDiscardPending();
    alert("設定已匯入，頁面將重新載入。");
    location.reload();
  }

  // 把備份內容寫進資料庫。mode："merge" 合併｜"replace" 先清空再匯入
  async function applyBackupData(data, mode){
    if(mode === "replace"){
      await clearAll();
      localStorage.removeItem("ba-roster-abbrev-list");
      localStorage.removeItem("ba-roster-variant-groups");
    }
    for(const s of data.schools){ await putSchool({ id:s.id, name:s.name, count:0, icon:s.icon || null, iconRaw:s.iconRaw || s.icon || null, iconBlackBg:!!s.iconBlackBg }); }
    for(const st of data.students){ await putStudent(st); }

    // Restore the abbreviation meanings and custom variant-group names
    // from the backup, if present — older (version 2 and earlier)
    // backups predate this and simply won't have these fields, in which
    // case backfillAbbrevFromStudents() below still reconstructs bare
    // abbreviation prefixes (with empty meanings) from the student names.
    if(Array.isArray(data.abbrevList)){
      const mergedAbbrev = mode === "replace" ? data.abbrevList : mergeAbbrevLists(loadAbbrevList(), data.abbrevList);
      saveAbbrevList(mergedAbbrev);
    }
    if(data.variantGroups && typeof data.variantGroups === "object"){
      const mergedGroups = mode === "replace" ? data.variantGroups : mergeVariantGroupsMaps(loadVariantGroupsMap(), data.variantGroups);
      saveVariantGroupsMap(mergedGroups);
    }

    await backfillAbbrevFromStudents();
    await migrateLegacyVariantIndependent();

    schools = await getAllSchools();
    await refreshCounts();
    if(!currentSchoolId && schools.length) currentSchoolId = schools[0].id;
    await renderMain();
  }

  function importBackup(file){
    const reader = new FileReader();
    reader.onload = async function(e){
      let data;
      try{ data = await parseBackupBuffer(e.target.result); }
      catch(err){ alert(err.message); return; }
      const mode = confirm(
        "選擇「確定」= 合併匯入（保留現有資料，新增/更新匯入的內容）\n選擇「取消」= 完全取代（先清空現有資料，再匯入）"
      ) ? "merge" : "replace";
      if(mode === "replace"){
        if(!confirm("即將清空目前所有資料並以備份檔取代，確定繼續？")) return;
      }
      await applyBackupData(data, mode);
      alert("匯入完成。");
    };
    reader.readAsArrayBuffer(file);
  }

  // ================= 雲端同步（GitHub）：推送／拉取 =================
  // 整份備份覆蓋，沒有自動合併。設定（含 token）只存在這台裝置的 localStorage，
  // 不會進匯出備份，也不會進除錯資料。
  const SYNC_KEY = "ba-roster-sync";
  function syncDefaultDevice(){
    return /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent || "") ? "手機" : "電腦";
  }
  function syncLoadCfg(){
    let saved = {};
    try{ saved = JSON.parse(localStorage.getItem(SYNC_KEY) || "{}") || {}; }catch(_){}
    return Object.assign({ repo:"", token:"", device:"", branch:"", path:"ba-roster-backup.json.gz", lastSha:null, lastSyncAt:null, checkOnOpen:true, pullBackup:"always" }, saved);
  }
  function syncSaveCfg(cfg){ localStorage.setItem(SYNC_KEY, JSON.stringify(cfg)); }
  function syncDeviceName(cfg){ return (cfg.device || "").trim() || syncDefaultDevice(); }

  function syncFmtTime(iso){
    const d = new Date(iso);
    if(isNaN(d.getTime())) return "";
    const p = function(n){ return String(n).padStart(2, "0"); };
    return d.getFullYear() + "/" + p(d.getMonth() + 1) + "/" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function syncStatusIdle(cfg){
    return cfg.lastSyncAt ? "上次同步：" + syncFmtTime(cfg.lastSyncAt) : "尚未同步過。";
  }
  function syncInfoText(info){
    if(!info) return "（無法取得來源資訊）";
    return (info.device ? "來自「" + info.device + "」，" : "") + syncFmtTime(info.date);
  }

  function syncBytesToB64(bytes){
    let bin = "";
    const CH = 0x8000;
    for(let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(bin);
  }
  function syncB64ToBytes(b64){
    const bin = atob(String(b64).replace(/\s/g, ""));
    const out = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  // 打包：優先 gzip（備份多半是 base64 圖片與 JSON，壓縮效果很好）
  async function syncPack(payload){
    const json = JSON.stringify(payload);
    if(typeof CompressionStream !== "undefined"){
      try{
        const stream = new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"));
        return new Uint8Array(await new Response(stream).arrayBuffer());
      }catch(_){}
    }
    return new TextEncoder().encode(json);
  }

  function SyncError(message, kind){
    const e = new Error(message);
    e.name = "SyncError"; e.kind = kind || "other";
    return e;
  }
  function syncValidate(cfg){
    if(!/^[\w.-]+\/[\w.-]+$/.test((cfg.repo || "").trim())) throw SyncError("repo 格式不對，請填「帳號/名稱」，例如 myname/ba-roster-data。", "config");
    if(!(cfg.token || "").trim()) throw SyncError("還沒有填 token。", "config");
  }
  async function syncGh(cfg, path, opts){
    opts = opts || {};
    let res;
    try{
      res = await fetch("https://api.github.com" + path, {
        method: opts.method || "GET",
        cache: "no-store",   // GitHub 的回應可能被瀏覽器快取一分鐘，同步一定要拿最新的
        headers: Object.assign({
          "Authorization": "Bearer " + cfg.token.trim(),
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28"
        }, opts.json ? { "Content-Type": "application/json" } : {}),
        body: opts.json ? JSON.stringify(opts.json) : undefined
      });
    }catch(_){
      throw SyncError("連不上 GitHub，請確認網路連線後再試。", "network");
    }
    if(res.ok || (opts.allow404 && res.status === 404)) return res;
    let detail = "";
    try{ detail = (await res.json()).message || ""; }catch(_){}
    const st = res.status;
    if(st === 401) throw SyncError("token 無效或已過期，請到 GitHub 重新產生一個。", "auth");
    if(st === 403){
      if(res.headers.get("x-ratelimit-remaining") === "0") throw SyncError("已達 GitHub 的請求上限，請稍後再試。", "limit");
      throw SyncError("沒有權限：請確認 token 對這個 repo 有 Contents 的讀寫權限。", "auth");
    }
    if(st === 404) throw SyncError("找不到 repo 或檔案：請確認 repo 名稱正確，且 token 有權存取這個 repo。", "notfound");
    if(st === 409 || st === 422) throw SyncError("雲端剛剛被更新了（或檔案版本不符），請重新操作一次。", "conflict");
    if(st === 429 || st >= 500) throw SyncError("GitHub 暫時無法使用（狀態碼 " + st + "），請稍後再試。", "server");
    throw SyncError("GitHub 回應錯誤（" + st + "）" + (detail ? "：" + detail : ""), "other");
  }
  function syncFilePath(cfg){
    return "/repos/" + cfg.repo.trim() + "/contents/" + cfg.path.split("/").map(encodeURIComponent).join("/");
  }
  async function syncGetMeta(cfg){
    const res = await syncGh(cfg, syncFilePath(cfg) + (cfg.branch ? "?ref=" + encodeURIComponent(cfg.branch) : ""), { allow404: true });
    if(res.status === 404) return null;
    const j = await res.json();
    if(Array.isArray(j) || !j.sha) throw SyncError("雲端的路徑「" + cfg.path + "」不是檔案。", "other");
    return { sha: j.sha, size: j.size };
  }
  async function syncGetLastCommit(cfg){
    try{
      const q = "?path=" + encodeURIComponent(cfg.path) + "&per_page=1" + (cfg.branch ? "&sha=" + encodeURIComponent(cfg.branch) : "");
      const res = await syncGh(cfg, "/repos/" + cfg.repo.trim() + "/commits" + q);
      const arr = await res.json();
      if(!Array.isArray(arr) || !arr.length) return null;
      const c = arr[0].commit || {};
      const m = /裝置：(.+?)｜/.exec(c.message || "");
      return { device: m ? m[1] : "", date: (c.committer && c.committer.date) || (c.author && c.author.date) || "" };
    }catch(_){ return null; }   // 只是顯示用的資訊，取不到不影響同步
  }

  // ---------- 開啟網頁時檢查雲端有沒有新版本（只提示，不自動套用）----------
  let syncOpBusy = false;         // 正在推送／拉取／檢查時，不要同時再檢查
  let syncLastCheckAt = 0;
  let syncDismissedSha = null;    // 按過「稍後」的版本，同一版不再重複提示
  let syncHintSha = null;         // 目前提示列對應的雲端版本

  function syncIsConfigured(cfg){
    return /^[\w.-]+\/[\w.-]+$/.test((cfg.repo || "").trim()) && !!(cfg.token || "").trim();
  }
  function syncHideHint(){
    const el = document.getElementById("syncHint");
    if(el) el.remove();
    syncHintSha = null;
  }
  function syncHintMessage(cfg, info){
    const from = syncInfoText(info);
    return cfg.lastSha
      ? "雲端有新版本（" + from + "）。"
      : "雲端已有備份（" + from + "），這台還沒有拉取過。";
  }
  function syncShowHint(cfg, sha, info){
    syncHintSha = sha;
    let el = document.getElementById("syncHint");
    if(!el){
      el = document.createElement("div");
      el.id = "syncHint"; el.className = "sync-hint"; el.setAttribute("role", "status");
      el.innerHTML = '<span class="sync-hint-text"></span>' +
        '<span class="sync-hint-actions">' +
          '<button type="button" class="btn btn-sm" id="syncHintPull">拉取</button>' +
          '<button type="button" class="btn btn-sm" id="syncHintLater">稍後</button>' +
        '</span>';
      document.body.appendChild(el);
      document.getElementById("syncHintLater").addEventListener("click", function(){
        syncDismissedSha = syncHintSha; syncHideHint();
      });
      document.getElementById("syncHintPull").addEventListener("click", syncHintPull);
    }
    el.querySelector(".sync-hint-text").textContent = syncHintMessage(cfg, info);
    el.dataset.msg = el.querySelector(".sync-hint-text").textContent;
  }
  async function syncHintPull(){
    const el = document.getElementById("syncHint");
    if(!el || syncOpBusy) return;
    const textEl = el.querySelector(".sync-hint-text");
    const btns = el.querySelectorAll("button");
    btns.forEach(function(b){ b.disabled = true; });
    syncOpBusy = true;
    const cfg = syncLoadCfg();
    const hintSha = syncHintSha;
    try{
      await syncPull(cfg, function(t){ textEl.textContent = String(t).split("\n")[0]; });
      if(syncLoadCfg().lastSha === hintSha){ syncHideHint(); showToast("已從雲端拉取"); }
      else textEl.textContent = el.dataset.msg;     // 在確認視窗按了取消：維持提示，不動資料
    }catch(err){
      textEl.textContent = "❌ " + ((err && err.message) || err);
    }
    syncOpBusy = false;
    btns.forEach(function(b){ b.disabled = false; });
  }
  async function syncCheckRemote(force){
    const cfg = syncLoadCfg();
    if(!syncIsConfigured(cfg) || cfg.checkOnOpen === false){ syncHideHint(); return; }
    if(syncOpBusy) return;
    if(!force && Date.now() - syncLastCheckAt < 60000) return;   // 切回分頁時最多每分鐘檢查一次
    syncOpBusy = true; syncLastCheckAt = Date.now();
    try{
      const meta = await syncGetMeta(cfg);
      if(!meta || meta.sha === cfg.lastSha){ syncHideHint(); }
      else if(meta.sha !== syncDismissedSha){
        const info = await syncGetLastCommit(cfg);
        syncShowHint(cfg, meta.sha, info);
      }
    }catch(_){ /* 背景檢查失敗（斷網、token 失效…）不打擾使用者，手動按按鈕時才會顯示原因 */ }
    syncOpBusy = false;
  }
  // 在設定頁按推送／拉取之後，若提示列對應的版本已經是這台的版本就收起來
  function syncRefreshHintAfterOp(){
    if(syncHintSha && syncLoadCfg().lastSha === syncHintSha) syncHideHint();
  }

  // ---------- 拉取前要不要先下載本機備份：比較本機與雲端內容 ----------
  // 只比對實際資料（學校、學生、縮寫表、變體群組），不看匯出時間這類每次都不同的欄位。
  function syncCanon(v){
    if(Array.isArray(v)) return v.map(syncCanon);
    if(v && typeof v === "object"){
      const o = {};
      Object.keys(v).sort().forEach(function(k){ o[k] = syncCanon(v[k]); });
      return o;
    }
    return v;
  }
  // 回傳 "same"（完全一致）｜"student"（只有「學生資料」不同，且兩邊是同一批學生）｜"other"（其他差異）
  // 學生資料 = 學生編輯視窗裡的內容：名稱、圖片、所屬學校、等級、各項數值、屬性、裝甲、群組、縮寫說明…
  // 學校清單、縮寫表、變體群組，以及新增／刪除學生，都不算在內。
  function syncCompareBackups(local, cloud){
    const byId = function(arr){
      return (Array.isArray(arr) ? arr.slice() : []).sort(function(x, y){ return String(x && x.id).localeCompare(String(y && y.id)); });
    };
    const rest = function(d){ return { schools: byId(d.schools), abbrevList: d.abbrevList || [], variantGroups: d.variantGroups || {} }; };
    const ls = byId(local.students), cs = byId(cloud.students);
    const sameRest = JSON.stringify(syncCanon(rest(local))) === JSON.stringify(syncCanon(rest(cloud)));
    if(sameRest && JSON.stringify(syncCanon(ls)) === JSON.stringify(syncCanon(cs))) return "same";
    const sameIds = ls.length === cs.length && ls.every(function(st, i){ return String(st && st.id) === String(cs[i] && cs[i].id); });
    return (sameRest && sameIds) ? "student" : "other";
  }

  async function syncTest(cfg, say){
    syncValidate(cfg);
    say("連線中…");
    const res = await syncGh(cfg, "/repos/" + cfg.repo.trim());
    const repo = await res.json();
    const lines = ["連線成功：" + repo.full_name + "（" + (repo.private ? "私人" : "公開") + " repo）。"];
    if(!repo.private) lines.push("⚠ 這個 repo 是公開的，推送的資料任何人都看得到，請改用私人 repo。");
    if(repo.permissions && repo.permissions.push === false) lines.push("⚠ 這個 token 看起來沒有寫入權限，推送會失敗。");
    const meta = await syncGetMeta(cfg);
    lines.push(meta ? "雲端已有備份檔，可以拉取。" : "雲端還沒有備份檔，第一次推送會建立。");
    say(lines.join("\n"));
  }

  async function syncPush(cfg, say){
    syncValidate(cfg);
    say("檢查雲端中…");
    const repo = await (await syncGh(cfg, "/repos/" + cfg.repo.trim())).json();
    if(!repo.private && !window.confirm("⚠ 這個 repo 是「公開」的，推送的學生資料任何人都看得到。\n\n確定要繼續嗎？（建議改用私人 repo）")){
      say("已取消推送。"); return;
    }
    const meta = await syncGetMeta(cfg);
    if(meta && meta.sha !== cfg.lastSha){
      const info = await syncGetLastCommit(cfg);
      if(!window.confirm("雲端已有一份備份（" + syncInfoText(info) + "），而且不是這台裝置上次同步的版本。\n\n推送會覆蓋它。要繼續嗎？\n（如果不確定，請先取消並按「從雲端拉取」）")){
        say("已取消推送。"); return;
      }
    }
    say("打包資料中…");
    const device = syncDeviceName(cfg);
    const payload = await buildBackupPayload("keep");   // 圖片維持現有格式，不在同步時重新壓縮
    payload.syncMeta = { device: device, pushedAt: new Date().toISOString() };
    const bytes = await syncPack(payload);
    say("上傳中…（" + Math.max(1, Math.round(bytes.length / 1024)) + " KB）");
    const body = {
      message: "ba-roster 同步｜裝置：" + device + "｜" + new Date().toISOString(),
      content: syncBytesToB64(bytes)
    };
    if(meta) body.sha = meta.sha;
    if(cfg.branch) body.branch = cfg.branch;
    const res = await syncGh(cfg, syncFilePath(cfg), { method: "PUT", json: body });
    const out = await res.json();
    cfg.lastSha = out && out.content && out.content.sha;
    cfg.lastSyncAt = new Date().toISOString();
    syncSaveCfg(cfg);
    say("推送完成：" + payload.students.length + " 位學生。\n" + syncStatusIdle(cfg));
  }

  async function syncPull(cfg, say){
    syncValidate(cfg);
    say("檢查雲端中…");
    const meta = await syncGetMeta(cfg);
    if(!meta){ say("雲端還沒有備份檔，請先在另一台裝置推送。"); return; }
    say("下載中…");
    const blobRes = await syncGh(cfg, "/repos/" + cfg.repo.trim() + "/git/blobs/" + meta.sha);
    const blob = await blobRes.json();
    const bytes = syncB64ToBytes(blob.content);
    let data;
    try{ data = await parseBackupBuffer(bytes.buffer); }
    catch(err){ throw SyncError("雲端的檔案無法讀取：" + err.message, "other"); }
    const info = await syncGetLastCommit(cfg);
    const localCount = (await getAllStudents()).filter(function(st){ return !st.borrowed; }).length;
    const same = meta.sha === cfg.lastSha ? "\n（雲端版本和你上次同步的相同）" : "";
    // 依設定決定要不要先下載本機備份：never 不下載｜same 內容一致才不下載｜edit 只有學生資料不同也不下載｜always 永遠下載
    // （舊版的 "numeric" 選項視同 "edit"）
    const bkMode = cfg.pullBackup === "numeric" ? "edit" : (cfg.pullBackup || "always");
    let relation = "other";
    if(bkMode === "same" || bkMode === "edit") relation = syncCompareBackups(await buildBackupPayload("keep"), data);
    const doBackup = bkMode === "always" || (bkMode === "same" && relation !== "same") || (bkMode === "edit" && relation === "other");
    const relNote = relation === "same" ? "\n本機與雲端的內容完全一致。" : (relation === "student" && bkMode === "edit" ? "\n本機與雲端只有學生資料（編輯視窗的內容）不同。" : "");
    if(!window.confirm("從雲端拉取會用雲端的資料「取代」這台的資料。\n\n本機：" + localCount + " 位學生 → 雲端：" + data.students.length + " 位學生\n雲端版本：" + syncInfoText(info) + same + relNote + "\n\n" + (doBackup ? "覆蓋前會先自動下載一份本機備份。" : "依你的設定，這次不會下載本機備份。") + "要繼續嗎？")){
      say("已取消拉取。"); return;
    }
    say(doBackup ? "備份本機資料並套用中…" : "套用中…");
    if(doBackup) await exportBackup();       // 先把本機資料下載成備份檔，拉錯可以還原
    await applyBackupData(data, "replace");
    cfg.lastSha = meta.sha;
    cfg.lastSyncAt = new Date().toISOString();
    syncSaveCfg(cfg);
    say("拉取完成：" + data.students.length + " 位學生。\n" + syncStatusIdle(cfg));
  }

  // Sidebar drag-to-resize
  (function setupSidebarResize(){
    const sidebarEl = document.getElementById("sidebar");
    const resizer = document.getElementById("sidebarResizer");
    const savedWidth = parseInt(localStorage.getItem("ba-roster-sidebar-width"), 10);
    if(savedWidth) sidebarEl.style.width = savedWidth + "px";

    let dragging = false;
    function onMove(clientX){
      const min = 160, max = 440;
      const w = Math.max(min, Math.min(max, clientX));
      sidebarEl.style.width = w + "px";
    }
    function startDrag(clientX){
      dragging = true;
      resizer.classList.add("dragging");
      document.body.style.userSelect = "none";
      onMove(clientX);
    }
    function endDrag(){
      if(!dragging) return;
      dragging = false;
      resizer.classList.remove("dragging");
      document.body.style.userSelect = "";
      localStorage.setItem("ba-roster-sidebar-width", parseInt(sidebarEl.style.width, 10) || 220);
    }
    resizer.addEventListener("mousedown", function(e){ e.preventDefault(); startDrag(e.clientX); });
    document.addEventListener("mousemove", function(e){ if(dragging) onMove(e.clientX); });
    document.addEventListener("mouseup", endDrag);
    resizer.addEventListener("touchstart", function(e){ startDrag(e.touches[0].clientX); }, { passive:true });
    document.addEventListener("touchmove", function(e){ if(dragging) onMove(e.touches[0].clientX); }, { passive:true });
    document.addEventListener("touchend", endDrag);
  })();

  // Sort: one button that opens the rules panel
  document.getElementById("sortBtn").addEventListener("click", function(e){
    e.stopPropagation();
    if(document.getElementById("sortPanel")) closeSortPanel(); else openSortPanel();
  });

  // Card display: dropdown + style button
  document.getElementById("cardDisplaySelect").addEventListener("change", async function(){
    const mode = this.value;

  });
  document.getElementById("filterBtn").addEventListener("click", function(e){
    e.stopPropagation();
    if(document.getElementById("filterPanel")) closeFilterPanel(); else openFilterPanel();
  });
  document.getElementById("badgeBtn").addEventListener("click", function(e){
    e.stopPropagation();
    if(document.getElementById("badgePanel")) closeBadgePanel(); else openBadgePanel();
  });
  document.addEventListener("mousedown", function(e){
    const fp = document.getElementById("filterPanel");
    if(fp && !fp.contains(e.target) && !e.target.closest("#filterBtn")) closeFilterPanel();
    const sp = document.getElementById("sortPanel");
    if(sp && !sp.contains(e.target) && !e.target.closest("#sortBtn")) closeSortPanel();
    const bp = document.getElementById("badgePanel");
    if(bp && !bp.contains(e.target) && !e.target.closest("#badgeBtn")) closeBadgePanel();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){ closeFilterPanel(); closeSortPanel(); closeBadgePanel(); }
  });
  window.addEventListener("resize", function(){ closeFilterPanel(); closeSortPanel(); closeBadgePanel(); });
  syncSortUI();
  syncCardDisplayUI();

  document.getElementById("btnAddSchoolSidebar").addEventListener("click", openAddSchoolModal);
  document.getElementById("btnEditSchool").addEventListener("click", openEditSchoolModal);
  document.getElementById("btnAddStudent").addEventListener("click", function(){ openStudentModal(null); });
  document.getElementById("btnExport").addEventListener("click", exportBackup);
  document.getElementById("btnImport").addEventListener("click", function(){
    document.getElementById("importFileInput").click();
  });
  document.getElementById("importFileInput").addEventListener("change", function(e){
    const file = e.target.files[0];
    if(file) importBackup(file);
    e.target.value = "";
  });
  document.getElementById("btnAbbrevList").addEventListener("click", openAbbrevListModal);
  document.getElementById("btnSettings").addEventListener("click", openSettingsModal);

  // ----- Mobile top bar: hamburger menu (匯出/匯入/簡寫清單/通用設定) and
  // search toggle. Purely presentational — reuses the same .actions /
  // .search-box elements and buttons as desktop, just shows/hides them as
  // a dropdown / expandable row. Only visible at the mobile breakpoint via
  // CSS (.mobile-only-btn), so this has no effect on desktop.
  (function setupMobileTopBar(){
    const menuBtn = document.getElementById("btnMobileMenuToggle");
    const searchBtn = document.getElementById("btnMobileSearchToggle");
    const actionsEl = document.querySelector(".topbar .actions");
    const searchBoxEl = document.querySelector(".topbar .search-box");
    if(!menuBtn || !searchBtn || !actionsEl || !searchBoxEl) return;

    function closeActions(){ actionsEl.classList.remove("open"); }
    function closeSearch(){ searchBoxEl.classList.remove("mobile-open"); }

    menuBtn.addEventListener("click", function(e){
      e.stopPropagation();
      closeSearch();
      actionsEl.classList.toggle("open");
    });
    searchBtn.addEventListener("click", function(e){
      e.stopPropagation();
      closeActions();
      searchBoxEl.classList.toggle("mobile-open");
      if(searchBoxEl.classList.contains("mobile-open")){
        const input = document.getElementById("searchInput");
        if(input) input.focus();
      }
    });
    // Any action inside the dropdown (export/import/abbrev/settings) opens
    // its own modal — tuck the dropdown away once that happens.
    actionsEl.querySelectorAll(".btn").forEach(function(btn){
      btn.addEventListener("click", closeActions);
    });
    document.addEventListener("click", function(e){
      if(actionsEl.classList.contains("open") && !actionsEl.contains(e.target) && e.target !== menuBtn){
        closeActions();
      }
    });
  })();

  document.getElementById("searchInput").addEventListener("input", async function(){
    searchQuery = this.value.trim();
    await renderMain();
  });

  document.addEventListener("keydown", function(e){
    if((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "z"){
      if(overlay.style.display === "flex") return;
      const active = document.activeElement;
      const tag = active && active.tagName;
      if(tag === "INPUT" || tag === "TEXTAREA" || (active && active.isContentEditable)) return;
      if(outputMode){
        e.preventDefault();
        undoLastSelection();
      }
      return;
    }
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.key === "Backspace"){
      if(overlay.style.display === "flex") return;
      const active = document.activeElement;
      const tag = active && active.tagName;
      if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (active && active.isContentEditable)) return;
      const searchInput = document.getElementById("searchInput");
      if(!searchInput || searchInput.disabled || !searchInput.value) return;
      e.preventDefault();
      searchInput.value = searchInput.value.slice(0, -1);
      searchInput.dispatchEvent(new Event("input"));
      searchInput.focus();
      return;
    }
    if(e.key.length !== 1) return;
    if(overlay.style.display === "flex") return;
    const active = document.activeElement;
    const tag = active && active.tagName;
    if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (active && active.isContentEditable)) return;
    const searchInput = document.getElementById("searchInput");
    if(!searchInput || searchInput.disabled) return;
    searchInput.focus();
    searchInput.value += e.key;
    searchInput.dispatchEvent(new Event("input"));
    e.preventDefault();
  });

  document.getElementById("btnEnterOutput").addEventListener("click", function(){ toggleOutputMode(true); });
  document.getElementById("btnCancelOutput").addEventListener("click", function(){ toggleOutputMode(false); });
  document.getElementById("btnViewOutput").addEventListener("click", openExportModal);
  document.getElementById("outputCount").addEventListener("click", function(){
    toggleDeselectMode(!deselectMode);
  });

  document.querySelectorAll("#sidebarTabs .sidebar-tab, #mobileTabs .sidebar-tab").forEach(function(btn){
    btn.addEventListener("click", function(){ switchSidebarTab(btn.getAttribute("data-tab")); });
  });

  document.getElementById("appTitle").addEventListener("click", function(){
    if(appSettings.titleClickAction === "none") return;
    if(appSettings.titleClickAction === "schoolPicker") return goToSchoolPicker();
    return goToAllStudents();
  });

  (function setupStickyMainHead(){
    const scrollEl = document.getElementById("mainScroll");
    const headEl = document.querySelector(".main-head");
    if(!scrollEl || !headEl) return;
    scrollEl.addEventListener("scroll", function(){
      headEl.classList.toggle("is-stuck", scrollEl.scrollTop > 0);
    });
  })();

  (async function init(){
    await openDB();
    await migrateLegacyVariantIndependent();
    schools = await getAllSchools();
    await refreshCounts();
    switchSidebarTab(sidebarTab);
    updateAbbrevNotifDot();
    syncCheckRemote(true);      // 開啟網頁時檢查一次雲端有沒有新版本
  })();
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") syncCheckRemote(false);
  });
  window.addEventListener("online", function(){ syncCheckRemote(true); });
})();
</script>
</body>
</html>
