  function resizeBackgroundImageFile(file){
    return new Promise(function(resolve, reject){
      const reader = new FileReader();
      reader.onload = function(e){
        const img = new Image();
        img.onload = function(){
          const maxDim = 3840;
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          const isTransparent = file.type === "image/png" || file.type === "image/gif" || file.type === "image/webp";
          resolve(isTransparent ? canvas.toDataURL("image/png") : canvas.toDataURL("image/jpeg", 0.85));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---- 背景圖片方案 ----
  // 目前使用的方案，內容就存在一般設定的 bg* 欄位裡（跟以前完全一樣）；
  // 其他方案的快照存在獨立的 IndexedDB（圖片很大，放 localStorage 會很快爆掉）。
  // 切換方案時，離開的那個方案只會先暫存在記憶體（bgSlotPending），
  // 按「儲存」時才一次寫入 IndexedDB；不儲存就整批丟棄，行為和其他設定一致。
  const BG_SLOT_MAX = 6;
  const BG_SLOT_KEYS = ["bgImage", "bgOpacity", "bgBrightness", "bgBlur", "bgSaturation", "bgTintColor", "bgTintOpacity", "bgFit", "bgPosition", "bgFallbackColor"];
  const bgSlotCache = {};   // slot number (1-based) -> snapshot object | undefined
  function bgSlotSnapshot(src){
    const o = {};
    BG_SLOT_KEYS.forEach(function(k){ o[k] = src[k]; });
    return o;
  }
  function bgSlotDefaults(){
    const o = {};
    BG_SLOT_KEYS.forEach(function(k){ o[k] = DEFAULT_SETTINGS[k]; });
    return o;
  }
  let bgSlotDbPromise = null;
  function bgSlotDb(){
    if(!bgSlotDbPromise){
      bgSlotDbPromise = new Promise(function(resolve, reject){
        const req = indexedDB.open("ba_roster_bg_slots", 1);
        req.onupgradeneeded = function(e){ e.target.result.createObjectStore("slots", { keyPath: "slot" }); };
        req.onsuccess = function(e){ resolve(e.target.result); };
        req.onerror = function(){ bgSlotDbPromise = null; reject(req.error); };
      });
    }
    return bgSlotDbPromise;
  }
  async function bgSlotsLoad(){
    try{
      const db = await bgSlotDb();
      const all = await new Promise(function(resolve, reject){
        const r = db.transaction("slots", "readonly").objectStore("slots").getAll();
        r.onsuccess = function(){ resolve(r.result || []); };
        r.onerror = function(){ reject(r.error); };
      });
      all.forEach(function(rec){ if(rec && rec.slot >= 1 && rec.slot <= BG_SLOT_MAX && rec.data) bgSlotCache[rec.slot] = rec.data; });
    } catch(e){}
  }
  async function bgSlotPut(slot, data){
    const db = await bgSlotDb();
    await new Promise(function(resolve, reject){
      const t = db.transaction("slots", "readwrite");
      t.objectStore("slots").put({ slot: slot, data: data });
      t.oncomplete = resolve;
      t.onerror = function(){ reject(t.error); };
      t.onabort = function(){ reject(t.error); };
    });
    bgSlotCache[slot] = data;
  }
  async function bgSlotDelete(slot){
    const db = await bgSlotDb();
    await new Promise(function(resolve, reject){
      const t = db.transaction("slots", "readwrite");
      t.objectStore("slots").delete(slot);
      t.oncomplete = resolve;
      t.onerror = function(){ reject(t.error); };
    });
    delete bgSlotCache[slot];
  }

  // 尚未儲存的方案快照（只在記憶體）。讀取方案內容時，暫存的優先於 IndexedDB 的。
  const bgSlotPending = {};
  function bgSlotGet(i){
    return Object.prototype.hasOwnProperty.call(bgSlotPending, i) ? bgSlotPending[i] : bgSlotCache[i];
  }
  function bgSlotNormKey(d){
    const full = Object.assign(bgSlotDefaults(), d || {});
    return JSON.stringify(BG_SLOT_KEYS.map(function(k){ return full[k]; }));
  }
  // 暫存中、且內容和已儲存版本不同的方案編號。
  // 目前使用中的方案，已儲存版本以 saved（appSettings）為準。
  function bgSlotsDirtyList(saved){
    return Object.keys(bgSlotPending).map(Number).filter(function(i){
      const base = (saved && i === saved.bgSlotIdx) ? saved : bgSlotCache[i];
      return bgSlotNormKey(bgSlotPending[i]) !== bgSlotNormKey(base);
    }).sort(function(a, b){ return a - b; });
  }
  function bgSlotsDirty(saved){ return bgSlotsDirtyList(saved).length > 0; }
  function bgSlotsDiscardPending(){
    Object.keys(bgSlotPending).forEach(function(k){ delete bgSlotPending[k]; });
  }
  // 按「儲存」時呼叫：先同步更新記憶體快取，再非同步寫進 IndexedDB
  function bgSlotsCommitPending(){
    const keys = Object.keys(bgSlotPending);
    if(!keys.length) return Promise.resolve();
    const jobs = keys.map(function(k){
      const data = bgSlotPending[k];
      bgSlotCache[k] = data;
      delete bgSlotPending[k];
      return bgSlotPut(Number(k), data);
    });
    return Promise.all(jobs).catch(function(){
      showToast("背景方案寫入失敗，重新整理後可能會還原");
    });
  }

  // Detects character variants such as "S.Mika" (swimsuit Mika) sharing a
  // base character name "Mika". Convention: a short letter prefix + "." + name.
  //
  // Within a base name, students can be split into separate "groups" (e.g.
  // "組別1", "組別2", ...) via variantGroupId — affinity is only cross-
  // referenced/exported between students in the *same* group; different
  // groups never see or influence each other's affinity. variantGroupId is
  // null/undefined for the default, always-present "組別1" (i.e. "no group"
  // — this is the normal state, matching every other same-name variant).
  // Custom groups (2+) are named and stored separately per base name — see
  // getVariantGroupsForBase/setVariantGroupsForBase below — since a group
  // name only makes sense in the context of one particular character.
  function getBaseVariantName(name){
    if(!name) return "";
    const trimmed = String(name).trim();
    const m = trimmed.match(/^([A-Za-z]{1,4})\.\s*(.+)$/);
    return (m ? m[2] : trimmed).trim();
  }

  function getVariantPrefix(name){
    const trimmed = String(name || "").trim();
    const m = trimmed.match(/^([A-Za-z]{1,4})\.\s*(.+)$/);
    return m ? m[1] : "O";
  }

  // Custom (2+) variant groups, stored per base character name since a
  // group's name/membership only means anything in the context of that one
  // character. "組別1" (the default/no-group state) is never stored here —
  // it's simply what a student falls back to when variantGroupId is empty.
  function loadVariantGroupsMap(){
    try{
      const raw = localStorage.getItem("ba-roster-variant-groups");
      if(!raw) return {};
      const parsed = JSON.parse(raw);
      return (parsed && typeof parsed === "object" && !Array.isArray(parsed)) ? parsed : {};
    } catch(e){
      return {};
    }
  }
  function saveVariantGroupsMap(map){
    localStorage.setItem("ba-roster-variant-groups", JSON.stringify(map));
  }
  function getVariantGroupsForBase(baseName){
    const map = loadVariantGroupsMap();
    return Array.isArray(map[baseName]) ? map[baseName] : [];
  }
  function setVariantGroupsForBase(baseName, groups){
    const map = loadVariantGroupsMap();
    if(groups && groups.length){
      map[baseName] = groups;
    } else {
      delete map[baseName];
    }
    saveVariantGroupsMap(map);
  }

  // A custom group with no students actually assigned to it serves no
  // purpose, so it's removed automatically whenever a change might have
  // left it empty (a student switching to a different group, a student
  // being deleted, or a newly-created group never actually being used
  // before the modal closes).
  async function cleanupEmptyVariantGroup(baseName, groupId){
    if(!groupId) return;
    const groups = getVariantGroupsForBase(baseName);
    if(!groups.some(function(g){ return g.id === groupId; })) return;
    const all = await getAllStudents();
    const stillHasMember = all.some(function(s){ return effectiveGroupId(s) === groupId; });
    if(stillHasMember) return;
    const remaining = groups.filter(function(g){ return g.id !== groupId; });
    setVariantGroupsForBase(baseName, remaining);
  }

  // Resolves which group a student effectively belongs to for affinity
  // grouping purposes: an explicit variantGroupId wins; otherwise null
  // means "組別1" (default/no group). NOTE: this assumes
  // migrateLegacyVariantIndependent() has already run (it's called from
  // init() before any rendering, and after every backup import) — that
  // pass is what guarantees no student record still carries the old
  // variantIndependent:true flag by the time this function ever reads one.
  // If that migration's call site is ever moved to run after data is read
  // instead of before, this function needs a legacy fallback again.
  function effectiveGroupId(student){
    return student.variantGroupId || null;
  }

  // 借用學生: only an avatar and a name, no growth data, never shares an
  // affinity/variant group with anyone, and at most one may exist at a time.
  function isBorrowed(st){ return !!(st && st.borrowed); }
  const BORROWED_NO_GROWTH_TEXT = "借用角色不支援養成顯示";
  async function findOtherBorrowed(exceptId){
    const all = await getAllStudents();
    return all.find(function(s){ return s.borrowed && s.id !== exceptId; }) || null;
  }

  // A-Z sort that keeps default-group ("組別1") variants of a character
  // together, but does NOT force other groups of that same character to sit
  // next to them — a variant moved into its own custom group sorts by its
  // own name like any unrelated student, rather than always trailing the
  // base character. Within any single group, the non-variant ("O" prefix)
  // student comes first followed by its variants.
  function sortStudentsGrouped(students){
    const groups = {};
    const order = [];
    students.forEach(function(s){
      const gid = effectiveGroupId(s);
      const key = isBorrowed(s) ? ("__borrowed__" + s.id) : (gid ? ("__group__" + gid) : getBaseVariantName(s.name));
      if(!groups[key]){ groups[key] = []; order.push(key); }
      groups[key].push(s);
    });
    // Default-group clusters sort by their shared base name so all of a
    // character's default-group variants land together. Custom-group
    // clusters sort by their first member's own full name instead, so
    // they take whatever alphabetical spot that name earns rather than
    // being pulled next to the default-group cluster of the same base name.
    const clusters = order.map(function(key){
      const group = groups[key];
      const nameKey = key.indexOf("__group__") === 0 ? group[0].name : getBaseVariantName(group[0].name);
      group.sort(function(a, b){
        const pa = getVariantPrefix(a.name), pb = getVariantPrefix(b.name);
        if(pa === "O" && pb !== "O") return -1;
        if(pb === "O" && pa !== "O") return 1;
        if(pa === pb) return a.name.localeCompare(b.name, "zh-Hant");
        return pa.localeCompare(pb);
      });
      return { group: group, head: group[0], nameKey: nameKey };
    });
    // Clusters follow the sort rules, judged by the cluster's first member.
    clusters.sort(function(ca, cb){
      return compareBySortRules(ca.head, cb.head, ca.nameKey, cb.nameKey);
    });
    const result = [];
    clusters.forEach(function(c){ result.push.apply(result, c.group); });
    return result;
  }

  async function findRawVariantMatches(name, excludeId){
    const base = getBaseVariantName(name);

    const all = await getAllStudents();
    return all.filter(function(s){

    });

  let schoolDragActive = false;

  function makeSchoolItemDraggable(li, school){
    li.dataset.schoolId = school.id;
    let dragMode = false;
    let moved = false;
    let activePointerId = null;
    let startX = 0, startY = 0;
    let longPressTimer = null;
    const DRAG_THRESHOLD = 6;
    const LONG_PRESS_MS = 150;
    let rafPending = false;
    let lastMoveEvent = null;
    let grabOffsetY = 0;

    function beginDragMode(){
      if(dragMode) return;
      if(schoolDragActive) return;
      schoolDragActive = true;
      dragMode = true;
      moved = true;
      li.classList.remove("item-in");
      li.style.animation = "none";
      li.classList.add("dragging");
    }

    function processDragMove(e){
      const list = document.getElementById("schoolList");
      const allItems = Array.from(list.querySelectorAll(".school-item[data-school-id]"));

      // Clear any in-flight FLIP animation first so measurements below reflect
      // true layout position, not a mid-transition visual offset.
      allItems.forEach(function(el){
        el.style.transition = "none";
        el.style.transform = "";
      });

      const oldRects = new Map();
      allItems.forEach(function(el){ oldRects.set(el, el.getBoundingClientRect()); });

      const others = allItems.filter(function(b){ return b !== li; });
      let target = null;
      for(const sib of others){
        const r = sib.getBoundingClientRect();
        if(e.clientY < r.top + r.height / 2){ target = sib; break; }
      }
      let changed = false;
      if(target){
        if(target !== li.nextSibling){ list.insertBefore(li, target); changed = true; }
      } else {
        if(list.lastElementChild !== li){ list.appendChild(li); changed = true; }
      }

      if(changed){
        allItems.forEach(function(el){
          if(el === li) return;
          const oldRect = oldRects.get(el);
          const newRect = el.getBoundingClientRect();
          const dy = oldRect.top - newRect.top;
          if(dy && motionOn("reorder")){
            el.style.transition = "none";
            el.style.transform = "translateY(" + dy + "px)";
            requestAnimationFrame(function(){
              el.style.transition = "transform .15s ease";
              el.style.transform = "";
            });
          }
        });
      }

      // Keep the dragged item itself tracking the pointer smoothly, regardless
      // of which slot it currently occupies in the flow.
      const naturalTop = li.getBoundingClientRect().top;
      const targetTop = e.clientY - grabOffsetY;
      li.style.transform = "translateY(" + (targetTop - naturalTop) + "px) scale(1.02)";
    }

    function onDocPointerMove(e){
      if(e.pointerId !== activePointerId) return;
      lastMoveEvent = e;
      if(!dragMode){
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if(Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD){
          clearTimeout(longPressTimer);
          beginDragMode();
        } else {
          return;
        }
      }
      if(rafPending) return;
      rafPending = true;
      requestAnimationFrame(function(){
        rafPending = false;
        // Guard against a frame that was already queued right before
        // pointerup fired and reset everything — without this check the
        // stale move would re-apply a transform after cleanup, making the
        // item appear to "fly off" to wherever the pointer last was.
        if(!dragMode) return;
        if(lastMoveEvent) processDragMove(lastMoveEvent);
      });
    }

    function onDocPointerUp(e){
      if(e.pointerId !== activePointerId) return;
      clearTimeout(longPressTimer);
      const wasDragging = dragMode;
      dragMode = false;
      activePointerId = null;
      li.classList.remove("dragging");
      li.dataset.dragMoved = wasDragging && moved ? "1" : "0";
      li.style.transition = "";
      li.style.transform = "";
      document.removeEventListener("pointermove", onDocPointerMove);
      document.removeEventListener("pointerup", onDocPointerUp);
      document.removeEventListener("pointercancel", onDocPointerUp);
      if(wasDragging){ schoolDragActive = false; }
      if(wasDragging && moved) persistSchoolOrder();
    }

    li.addEventListener("pointerdown", function(e){
      if(schoolDragActive) return;
      dragMode = false;
      moved = false;
      activePointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      grabOffsetY = e.clientY - li.getBoundingClientRect().top;
      document.addEventListener("pointermove", onDocPointerMove);

  async function toggleOutputMode(on){

    const searchInput = document.getElementById("searchInput");
    if(searchInput) searchInput.disabled = false;
    // Hide normalControls immediately when *entering* output mode so it
    // can't stay visible side-by-side with outputControls while renderMain()
    // is still awaiting its (async, IndexedDB-backed) data — that overlap is
    // what caused the outputControls buttons to visibly jump/flicker once
    // normalControls finally disappeared a moment later.
    //
    // When *leaving* output mode we mirror that fix: restore normalControls
    // synchronously right here using the last state setNormalControlsVisible
    // computed (before we ever entered output mode), instead of leaving it
    // hidden until the async render pipeline finishes its IndexedDB fetch.
    // Without this, outputControls disappears immediately but normalControls
    // stays empty for a beat until renderMain() resolves, so the whole
    // control area briefly goes blank before normalControls pops in — which
    // reads as the outputControls buttons flickering. renderMain() below
    // will still recompute and correct the state right after, so this is
    // just an optimistic, already-correct placeholder in the common case.
    if(on){
      document.getElementById("normalControls").style.display = "none";
    } else {
      setNormalControlsVisible(
        lastNormalControlsState.showEdit,
        lastNormalControlsState.showAdd,

  async function toggleSelectStudent(id, name){

        showToast("已移除「" + (name || "該學生") + "」");

      const allForCheck = await getAllStudents();
      const target = allForCheck.find(function(s){ return s.id === id; });
      if(target){
        const sameName = function(a, b){ return (a.name || "").trim().toLowerCase() === (b.name || "").trim().toLowerCase(); };
        const clash = allForCheck.find(function(s){
          return s.id !== id && selectedIds.indexOf(s.id) !== -1 && sameName(s, target) && (!!s.borrowed !== !!target.borrowed);
        });

  // Shows/hides the "排序" and "卡片顯示" toggles (each including its own
  // label) independently, and hides their shared background box entirely
  // when neither is shown — otherwise an empty labelled box would linger
  // when nothing is selectable.
  // One sorter for every grid view, driven by sortRules / sortGrouped.
  // Borrowed students have no numbers, so they go last in number-based rules.
  function sortValue(st, key){
    if(key === "affinity") return st.affinity || 0;
    if(key === "level") return st.level || 0;
    if(key === "star") return st.weaponStar || 0;
    if(key === "attribute"){
      const i = ATTRIBUTES.findIndex(function(x){ return x.id === st.attribute; });
      return i === -1 ? 99 : i;
    }
    if(key === "armor"){
      const i = ARMORS.findIndex(function(x){ return x.id === st.armor; });
      return i === -1 ? 99 : i;
    }
    return 0;
  }
  // nameA/nameB let grouped mode compare cluster names instead of member names.
  function compareBySortRules(a, b, nameA, nameB){
    const na = nameA != null ? nameA : (a.name || "");
    const nb = nameB != null ? nameB : (b.name || "");
    for(let i = 0; i < sortRules.length; i++){
      const rule = sortRules[i];
      const dir = rule.dir === "asc" ? 1 : -1;
      let c;
      if(rule.key === "name"){
        c = dir * na.localeCompare(nb, "zh-Hant");
      } else {
        if(!!a.borrowed !== !!b.borrowed) return a.borrowed ? 1 : -1;
        c = dir * (sortValue(a, rule.key) - sortValue(b, rule.key));
      }
      if(c) return c;
    }
    return na.localeCompare(nb, "zh-Hant");
  }
  function applyStudentSort(list){
    if(sortGrouped) return sortStudentsGrouped(list);
    return list.sort(function(a, b){ return compareBySortRules(a, b); });

  // 篩選: tick several values per group. Within a group any match counts (OR),
  // across groups all must match (AND). Saved so it survives a reload.
  const studentFilter = { attr: [], armor: [], star: [] };
  (function loadFilterState(){
    try{
      const saved = JSON.parse(localStorage.getItem("ba-roster-filter") || "null");
      if(!saved) return;
      studentFilter.attr = (saved.attr || []).filter(function(id){ return ATTRIBUTES.some(function(a){ return a.id === id; }); });
      studentFilter.armor = (saved.armor || []).filter(function(id){ return ARMORS.some(function(a){ return a.id === id; }); });
      studentFilter.star = (saved.star || []).filter(function(n){ return Number.isInteger(n) && n >= 1 && n <= 9; });

  function saveFilterState(){

  function filterCount(){

  function studentFilterActive(){ return filterCount() > 0; }
  // The attribute group is ignored while browsing a single attribute (it would be redundant).
  function filterIgnoresAttr(){ return sidebarTab === "attribute"; }
  function applyStudentFilter(list){
    if(!studentFilterActive()) return list;
    const useAttr = !filterIgnoresAttr() && studentFilter.attr.length > 0;
    return list.filter(function(s){
      if(s.borrowed) return false;
      if(useAttr && studentFilter.attr.indexOf(s.attribute) === -1) return false;
      if(studentFilter.armor.length && studentFilter.armor.indexOf(s.armor) === -1) return false;
      if(studentFilter.star.length && studentFilter.star.indexOf(s.weaponStar || 0) === -1) return false;
      return true;
    });

  function renderSortPanel(){
    const p = document.getElementById("sortPanel");
    if(!p) return;
    const used = sortRules.map(function(r){ return r.key; });
    const sameRules = function(a, b){
      return a.length === b.length && a.every(function(r, i){ return r.key === b[i].key && r.dir === b[i].dir; });
    };
    let html = '<div class="filter-title">快速套用</div><div class="filter-chips">' +

      }).join("") + '</div>' +

      '<button type="button" class="sort-btn filter-chip' + (sortGrouped ? " active" : "") + '" id="sortGroupedBtn" aria-pressed="' + sortGrouped + '">同名角色聚在一起</button></div>' +
      '<div class="filter-title">排序條件</div>';
    sortRules.forEach(function(rule, i){
      html += '<div class="sort-rule" data-i="' + i + '"><span class="sort-rule-no">' + (i + 1) + '</span>' +
        '<select class="view-select sort-rule-key" aria-label="排序條件 ' + (i + 1) + '">' +
        SORT_KEYS.map(function(k){
          if(k.id !== rule.key && used.indexOf(k.id) !== -1) return "";
          if(k.id === "name" && i !== sortRules.length - 1) return "";
          return '<option value="' + k.id + '"' + (k.id === rule.key ? " selected" : "") + '>' + k.label + '</option>';
        }).join("") + '</select>' +
        '<button type="button" class="sort-btn sort-rule-dir" title="切換升序／降序">' + (rule.dir === "asc" ? "↑ 升序" : "↓ 降序") + '</button>' +
        '<button type="button" class="sort-btn sort-rule-up" title="提高優先"' + ((i === 0 || rule.key === "name") ? " disabled" : "") + '>▲</button>' +
        '<button type="button" class="sort-btn sort-rule-down" title="降低優先"' + ((i === sortRules.length - 1 || sortRules[i + 1].key === "name") ? " disabled" : "") + '>▼</button>' +
        '<button type="button" class="sort-btn sort-rule-del" title="刪除"' + (sortRules.length === 1 ? " disabled" : "") + '>✕</button></div>';
    });
    const lastIsName = sortRules[sortRules.length - 1].key === "name";
    const canAdd = !lastIsName && sortRules.length < MAX_SORT_RULES && SORT_KEYS.some(function(k){ return used.indexOf(k.id) === -1; });
    html += '<div class="filter-foot"><span style="display:flex;align-items:center;gap:8px;">' +
      '<button type="button" class="btn btn-ghost btn-sm" id="sortAddBtn"' + (canAdd ? "" : " disabled") + '>＋ 新增條件</button>' +
      (lastIsName ? '<span class="filter-hint">名字只能放最後</span>' : "") + '</span>' +
      '<button type="button" class="btn btn-ghost btn-sm" id="sortResetBtn">重設</button></div>';
    p.innerHTML = html;

    p.querySelectorAll(".sort-preset").forEach(function(b){
      b.addEventListener("click", function(){
        const pr = SORT_PRESETS[parseInt(b.getAttribute("data-p"), 10)];
        sortRules = pr.rules.map(function(r){ return Object.assign({}, r); });
        sortStateChanged();
      });
    });
    document.getElementById("sortGroupedBtn").addEventListener("click", function(){ sortGrouped = !sortGrouped; sortStateChanged(); });
    p.querySelectorAll(".sort-rule").forEach(function(row){
      const i = parseInt(row.getAttribute("data-i"), 10);
      row.querySelector(".sort-rule-key").addEventListener("change", function(){
        const k = SORT_KEYS.find(function(x){ return x.id === this.value; }, this);
        sortRules[i] = { key: k.id, dir: k.dir };
        normalizeSortRules();
        sortStateChanged();
      });
      row.querySelector(".sort-rule-dir").addEventListener("click", function(){
        sortRules[i].dir = sortRules[i].dir === "asc" ? "desc" : "asc";
        sortStateChanged();
      });
      row.querySelector(".sort-rule-up").addEventListener("click", function(){
        if(i === 0) return;
        const t = sortRules[i - 1]; sortRules[i - 1] = sortRules[i]; sortRules[i] = t;
        sortStateChanged();
      });
      row.querySelector(".sort-rule-down").addEventListener("click", function(){
        if(i >= sortRules.length - 1) return;
        const t = sortRules[i + 1]; sortRules[i + 1] = sortRules[i]; sortRules[i] = t;
        sortStateChanged();
      });
      row.querySelector(".sort-rule-del").addEventListener("click", function(){
        if(sortRules.length <= 1) return;
        sortRules.splice(i, 1);
        sortStateChanged();
      });
    });
    document.getElementById("sortAddBtn").addEventListener("click", function(){
      const k = SORT_KEYS.find(function(x){ return used.indexOf(x.id) === -1; });
      if(!k || sortRules.length >= MAX_SORT_RULES) return;
      sortRules.push({ key: k.id, dir: k.dir });
      sortStateChanged();
    });
    document.getElementById("sortResetBtn").addEventListener("click", function(){
      sortGrouped = false;
      sortRules = DEFAULT_SORT_RULES.map(function(r){ return Object.assign({}, r); });
      sortStateChanged();
    });
  }

  // Re-renders the 撤銷模式 grid to match the current selectedIds order,
  // sliding each card from its old position to its new one instead of
  // just snapping — used when the order changes from *outside* the grid
  // itself (dragging avatars inside the 輸出資料 modal), since that reorder
  // doesn't touch this grid's own DOM directly.
  async function refreshDeselectGridWithReorderAnimation(){
    if(!deselectMode) return;
    const grid = document.getElementById("studentGrid");
    if(!grid) return;
    const oldRects = new Map();
    grid.querySelectorAll(".avatar-card[data-student-id]").forEach(function(el){
      oldRects.set(el.dataset.studentId, el.getBoundingClientRect());
    });
    await renderDeselectView();
    const newGrid = document.getElementById("studentGrid");
    if(!newGrid) return;
    newGrid.querySelectorAll(".avatar-card[data-student-id]").forEach(function(el){
      const old = oldRects.get(el.dataset.studentId);
      if(!old) return;
      const newRect = el.getBoundingClientRect();
      const dx = old.left - newRect.left;
      const dy = old.top - newRect.top;
      if((dx || dy) && motionOn("reorder")){
        el.style.transition = "none";
        el.style.transform = "translate(" + dx + "px, " + dy + "px)";
        requestAnimationFrame(function(){
          el.style.transition = "transform .2s ease";
          el.style.transform = "";
        });
      }
    });
  }

  // Populates the student grid, only replaying the card entrance animation
  // when the "view" actually changed (different school/tab/attribute/search),
  // not on every incidental re-render (e.g. toggling a selection, typing a
  // search key) which would otherwise cause distracting re-flashing.
  //
  // Every "empty state" branch elsewhere (no school/attribute selected yet,
  // no students to show, no search matches, etc.) clears the grid directly
  // and returns without calling this function — so each of those branches
  // also resets lastGridViewKey to null. Otherwise, passing through such a
  // placeholder screen and landing back on the exact same specific view you
  // were on before (e.g. switching tabs without picking anything new, then
  // switching back) would compare equal to the stale lastGridViewKey and
  // wrongly skip the entrance animation, even though the grid had actually
  // been emptied out and repopulated in between.
  function populateGrid(students, viewKey, cardOpts){
    currentGridStudents = Array.isArray(students) ? students.slice() : [];
    const grid = document.getElementById("studentGrid");
    const shouldAnimate = viewKey !== lastGridViewKey;
    lastGridViewKey = viewKey;
    grid.innerHTML = "";
    grid.classList.toggle("reorderable-grid", !!(cardOpts && cardOpts.reorderable));
    const schoolOpt = document.querySelector('#cardDisplaySelect option[value="school"]');
    const showSchool = !!(cardOpts && cardOpts.showSchool);
    if(schoolOpt){ schoolOpt.hidden = !showSchool; schoolOpt.disabled = !showSchool; }
    if(showSchool && restoreSchoolModeOnMultiView && cardDisplayMode !== "school"){
      cardDisplayMode = "school";
      localStorage.setItem("ba-roster-card-display", cardDisplayMode);
      syncCardDisplayUI();
      restoreSchoolModeOnMultiView = false;
    }
    students.forEach(function(st){
      const card = renderStudentCard(st, cardOpts);
      if(!shouldAnimate){
        card.style.animation = "none";
      }
      grid.appendChild(card);
    });
    // "完整顯示" name style: after layout, split any name-tag whose
    // name+meaning text doesn't fit on one line onto two lines instead of
    // letting it get cut off with an ellipsis (see .name-tag.stacked above).
    grid.querySelectorAll(".name-tag").forEach(function(tagEl){
      if(!tagEl.querySelector(".name-tag-full")) return;
      tagEl.classList.toggle("stacked", tagEl.scrollWidth > tagEl.clientWidth + 0.5);
    });
  }

  // Splits a student's "完整顯示" (full) name-tag content into a base name
  // and its meaning, e.g. "S.Hanako" -> { base:"Hanako", meaning:"Swimsuit" },
  // looked up from the abbreviation list. When the prefix has no meaning
  // recorded yet, or has 2+ possible meanings but the student hasn't picked
  // which one applies (already flagged separately via the card's warning
  // dot), meaning comes back empty and base is the name exactly as typed
  // (e.g. "T.Shiroko") — there's no meaning to safely guess or split off.
  // The name spelled out for assistive tech and tooltips: "Mika (Swimsuit)" for "S.Mika" when the
  // abbreviation list knows what S means, otherwise just the name as typed.
  function studentFullName(st){
    const parts = buildFullNameParts(st);
    return parts.meaning ? parts.base + " (" + parts.meaning + ")" : st.name;
  }

  function buildFullNameParts(st){
    const prefix = getVariantPrefix(st.name);
    if(prefix === "O") return { base: st.name, meaning: "" };
    const meanings = getMeaningsForPrefix(prefix);
    let meaning = "";
    if(meanings.length === 1){
      meaning = meanings[0];
    } else if(meanings.length >= 2){
      const chosen = st.abbrevMeaning || "";
      meaning = meanings.indexOf(chosen) !== -1 ? chosen : "";
    }
    if(!meaning) return { base: st.name, meaning: "" };
    return { base: getBaseVariantName(st.name), meaning: meaning };
  }

  // Drag-to-reorder for cards shown in "撤銷模式" (renderDeselectView), which
  // lists exactly the selected students and is the one place their order is
  // both visible and meaningful (it drives the export modal's avatar order
  // and page numbering). Same long-press-then-drag interaction already used
  // for the school sidebar list and the export modal's avatar row, just
  // reordering `selectedIds` and operating on the CSS grid's cards instead.
  function makeStudentCardDraggable(card){
    let dragMode = false;
    let moved = false;
    let activePointerId = null;
    let startX = 0, startY = 0;
    let longPressTimer = null;
    const DRAG_THRESHOLD = 6;
    const LONG_PRESS_MS = 150;
    let rafPending = false;
    let lastMoveEvent = null;
    let grabOffsetX = 0;
    let grabOffsetY = 0;

    function beginDragMode(){
      if(dragMode) return;
      if(deselectDragActive) return;
      deselectDragActive = true;
      dragMode = true;
      moved = true;
      card.classList.add("dragging");
    }

    // Row-aware "should the dragged item go before this sibling" check,
    // same as the export avatar row / school list draggers.
    function isBefore(pointerX, pointerY, r){
      if(pointerY < r.top) return true;
      if(pointerY > r.bottom) return false;
      return pointerX < r.left + r.width / 2;
    }

    function processDragMove(e){
      const grid = document.getElementById("studentGrid");
      if(!grid) return;
      const allItems = Array.from(grid.querySelectorAll(".avatar-card[data-student-id]"));

      allItems.forEach(function(el){
        el.style.transition = "none";
        el.style.transform = "";
      });

      const oldRects = new Map();
      allItems.forEach(function(el){ oldRects.set(el, el.getBoundingClientRect()); });

      const others = allItems.filter(function(b){ return b !== card; });
      let target = null;
      for(const sib of others){
        const r = sib.getBoundingClientRect();
        if(isBefore(e.clientX, e.clientY, r)){ target = sib; break; }
      }
      let changed = false;
      if(target){
        if(target !== card.nextSibling){ grid.insertBefore(card, target); changed = true; }
      } else {
        if(grid.lastElementChild !== card){ grid.appendChild(card); changed = true; }
      }

      if(changed){
        allItems.forEach(function(el){
          if(el === card) return;
          const oldRect = oldRects.get(el);
          const newRect = el.getBoundingClientRect();
          const dx = oldRect.left - newRect.left;
          const dy = oldRect.top - newRect.top;
          if((dx || dy) && motionOn("reorder")){
            el.style.transition = "none";
            el.style.transform = "translate(" + dx + "px, " + dy + "px)";
            requestAnimationFrame(function(){
              el.style.transition = "transform .15s ease";
              el.style.transform = "";
            });
          }
        });
      }

      const naturalRect = card.getBoundingClientRect();
      const targetLeft = e.clientX - grabOffsetX;
      const targetTop = e.clientY - grabOffsetY;
      card.style.transform = "translate(" + (targetLeft - naturalRect.left) + "px, " + (targetTop - naturalRect.top) + "px) scale(1.04)";
    }

    function onDocPointerMove(e){
      if(e.pointerId !== activePointerId) return;
      lastMoveEvent = e;
      if(!dragMode){
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if(Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD){
          clearTimeout(longPressTimer);
          beginDragMode();
        } else {
          return;
        }
      }
      if(rafPending) return;
      rafPending = true;
      requestAnimationFrame(function(){
        rafPending = false;
        if(!dragMode) return;
        if(lastMoveEvent) processDragMove(lastMoveEvent);
      });
    }

    function onDocPointerUp(e){
      if(e.pointerId !== activePointerId) return;
      clearTimeout(longPressTimer);
      const wasDragging = dragMode;
      dragMode = false;
      activePointerId = null;
      card.classList.remove("dragging");
      // Read by the click handler so a drag's pointerup doesn't also fire
      // as a click that removes the card from the selection.
      card.dataset.dragMoved = wasDragging && moved ? "1" : "0";
      card.style.transition = "";
      card.style.transform = "";
      document.removeEventListener("pointermove", onDocPointerMove);
      document.removeEventListener("pointerup", onDocPointerUp);
      document.removeEventListener("pointercancel", onDocPointerUp);
      if(wasDragging){ deselectDragActive = false; }
      if(wasDragging && moved){
        const grid = document.getElementById("studentGrid");
        const orderedIds = grid
          ? Array.from(grid.querySelectorAll(".avatar-card[data-student-id]")).map(function(el){ return el.dataset.studentId; })
          : [];
        selectedIds.sort(function(a, b){
          return orderedIds.indexOf(String(a)) - orderedIds.indexOf(String(b));
        });
        renderMain();
      }
    }

    card.addEventListener("pointerdown", function(e){
      if(deselectDragActive) return;
      // Stops the browser's own text/image selection drag from starting
      // (the blue highlight) alongside our custom pointer-based reordering.
      e.preventDefault();
      dragMode = false;
      moved = false;
      activePointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      const startRect = card.getBoundingClientRect();
      grabOffsetX = e.clientX - startRect.left;
      grabOffsetY = e.clientY - startRect.top;
      document.addEventListener("pointermove", onDocPointerMove);
      document.addEventListener("pointerup", onDocPointerUp);
      document.addEventListener("pointercancel", onDocPointerUp);
      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(beginDragMode, LONG_PRESS_MS);
    });
  }

  let activeRippleEl = null;
  let activeJumpCardEl = null;
  let jumpRemoveTimer = null;
  let rippleSpawnFrame = null;
  let activeJumpAnimEndHandler = null;

  function cancelCardJumpAnimation(){
    if(activeRippleEl && activeRippleEl.parentNode){
      activeRippleEl.parentNode.removeChild(activeRippleEl);
    }
    activeRippleEl = null;
    if(activeJumpCardEl){
      if(activeJumpAnimEndHandler) activeJumpCardEl.removeEventListener("animationend", activeJumpAnimEndHandler);
      activeJumpCardEl.classList.remove("just-jumped");
      activeJumpCardEl = null;
    }
    activeJumpAnimEndHandler = null;
    clearTimeout(jumpRemoveTimer);
    jumpRemoveTimer = null;
    if(rippleSpawnFrame){
      cancelAnimationFrame(rippleSpawnFrame);
      rippleSpawnFrame = null;
    }
  }

  function spawnCardRipple(cardEl){
    const rawScale = appSettings.rippleScale != null ? appSettings.rippleScale : 50;
    if(!rawScale) return; // 擴散範圍 = 0 時完全不顯示擴散效果
    if(!cardEl || !cardEl.isConnected) return;
    if(!motionOn("ripple")) return;
    const r = cardEl.getBoundingClientRect();
    const ring = document.createElement("div");
    ring.className = "card-ripple";
    ring.style.left = r.left + "px";
    ring.style.top = r.top + "px";
    ring.style.width = r.width + "px";
    ring.style.height = r.height + "px";
    const color = appSettings.rippleColor || "#5FB0FF";
    const brightnessPct = appSettings.rippleBrightness != null ? appSettings.rippleBrightness : 100;
    // 擴散範圍滑桿現在是 0-100，對應到實際擴散倍率 100%~280%（效果上限跟原本一樣）
    const scalePct = 100 + (rawScale / 100) * 180;
    const rgb = hexToRgb(color);
    const glowAlpha = Math.min(1, (brightnessPct / 100) * .6);
    ring.style.borderColor = color;
    ring.style.boxShadow = "0 0 16px 2px rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + "," + glowAlpha + ")";
    ring.style.filter = "brightness(" + brightnessPct + "%)";
    ring.style.setProperty("--ripple-end-scale", scalePct / 100);
    document.body.appendChild(ring);
    activeRippleEl = ring;
    const remove = function(){
      ring.removeEventListener("animationend", remove);
      if(ring.parentNode) ring.parentNode.removeChild(ring);
      if(activeRippleEl === ring) activeRippleEl = null;
    };
    ring.addEventListener("animationend", remove);
    setTimeout(remove, 1100);
  }

  let toastHideTimer = null;
  let toastRemoveTimer = null;
  let toastAnimEndHandler = null;
  // Screen-reader announcement. The visual toast disappears too quickly to be read reliably, so
  // the same text also goes to a persistent, visually hidden live region (cleared first so the
  // same message twice in a row is still announced).
  let announceTimer = null;
  function announce(msg){
    const region = document.getElementById("a11yLive");
    if(!region) return;
    clearTimeout(announceTimer);
    region.textContent = "";
    announceTimer = setTimeout(function(){ region.textContent = msg; }, 60);
  }

  // True when animation/smooth scrolling should be skipped: the app's own 減少動畫 setting or
  // the operating system's "reduce motion" preference.
  function motionCalm(){
    return !!(appSettings && appSettings.reduceMotion) ||
      !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  // Whether one kind of animation (an id from MOTION_ITEMS) may play: not when the master
  // switch / the OS asks for less motion, and not when that animation is switched off.
  function motionOn(id){
    if(motionCalm()) return false;
    const it = MOTION_BY_ID[id];
    return !(it && appSettings && appSettings[it.key] === false);
  }

  function showToast(msg, ms){
    announce(msg);
    if(ms == null) ms = Math.min(2800, Math.max(1200, 700 + String(msg).length * 60));
    let el = document.getElementById("appToast");
    clearTimeout(toastHideTimer);
    clearTimeout(toastRemoveTimer);
    if(el && toastAnimEndHandler){
      el.removeEventListener("animationend", toastAnimEndHandler);
      toastAnimEndHandler = null;
    }
    if(el){
      // Already visible: restart its entrance animation so repeated
      // triggers still feel responsive instead of sitting static.
      el.classList.remove("toast-out");
      el.style.animation = "none";
      void el.offsetWidth;
      el.style.animation = "";
      el.textContent = msg;
    } else {
      el = document.createElement("div");
      el.id = "appToast";
      el.className = "toast";
      el.textContent = msg;
      document.body.appendChild(el);
    }
    toastHideTimer = setTimeout(function(){
      if(!el || !el.parentNode) return;
      el.classList.add("toast-out");
      const remove = function(){
        el.removeEventListener("animationend", remove);
        if(toastAnimEndHandler === remove) toastAnimEndHandler = null;
        if(el.parentNode) el.parentNode.removeChild(el);
      };
      toastAnimEndHandler = remove;
      el.addEventListener("animationend", remove);
      toastRemoveTimer = setTimeout(remove, 320);
    }, ms);
  }

  function escapeHtml(str){
    return String(str ?? "").replace(/[&<>"']/g, function(c){
      return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c];
    });
  }

  const overlay = document.getElementById("overlay");
  function closeModal(){
    if(modalBeforeClose && !modalBeforeClose()) return;
    modalBeforeClose = null;
    if(overlay.style.display !== "flex") return;
    let finished = false;
    const finish = function(){
      if(finished) return;
      finished = true;
      overlay.removeEventListener("animationend", finish);
      overlay.style.display = "none";
      overlay.innerHTML = "";
      overlay.classList.remove("closing");
      currentAvatarData = null; currentSchoolIconData = null;
      currentSchoolIconRawData = null; currentSchoolIconBlackBg = false;
      if(pendingHighlightId){
        const id = pendingHighlightId;
        pendingHighlightId = null;
        const cardEl = document.querySelector('.avatar-card[data-student-id="' + id + '"]');
        if(cardEl){
          cancelCardJumpAnimation();
          cardEl.scrollIntoView({ behavior: motionOn("scroll") ? "smooth" : "auto", block: "center" });
          cardEl.classList.remove("just-jumped");
          void cardEl.offsetWidth;
          cardEl.classList.add("just-jumped");
          activeJumpCardEl = cardEl;
          const onJumpAnimEnd = function(){
            cardEl.removeEventListener("animationend", onJumpAnimEnd);
            cardEl.classList.remove("just-jumped");
            if(activeJumpCardEl === cardEl) activeJumpCardEl = null;
            activeJumpAnimEndHandler = null;
            clearTimeout(jumpRemoveTimer);
            jumpRemoveTimer = null;
          };
          activeJumpAnimEndHandler = onJumpAnimEnd;
          cardEl.addEventListener("animationend", onJumpAnimEnd);
          jumpRemoveTimer = setTimeout(onJumpAnimEnd, 1500);
          rippleSpawnFrame = requestAnimationFrame(function(){
            rippleSpawnFrame = null;
            spawnCardRipple(cardEl);
          });
        }
      }
      if(modalOnClose){
        const cb = modalOnClose;
        modalOnClose = null;
        cb();
      }
    };
    overlay.classList.add("closing");
    overlay.addEventListener("animationend", finish);
    setTimeout(finish, 200); // fallback for reduced-motion / animation not firing
  }
  function showModal(html, opts){
    opts = opts || {};
    modalBeforeClose = null;
    modalOnClose = (opts.onClose) || null;
    overlay.classList.remove("closing");
    const classes = "modal" + (opts.wide ? " modal-wide" : "") + (opts.navSwap ? " modal-nav-swap" : "");
    const style = opts.maxWidth ? ' style="max-width:' + opts.maxWidth + '"' : "";
    overlay.innerHTML = '<div class="' + classes + '"' + style + '>' + html + '</div>';
    overlay.style.display = "flex";
  }
  // Only closes the modal when the press that led to this click *started*
  // on the overlay backdrop itself, not just when the click's target
  // happens to be the backdrop. Using the click target alone is fragile:
  // e.g. clicking "儲存" while a text field still has focus fires that
  // field's blur/change handlers first, and if those handlers change the
  // modal's content height (a common case: editing a student's name
  // re-renders the affinity/variant-group reference box above the save
  // button), the save button can shift position between mousedown and
  // mouseup. The click's target then resolves to the backdrop behind where
  // the button used to be, and without this guard that reads as "clicked
  // outside" and silently discards the edit instead of saving it.
  let overlayPressStartedOnOverlay = false;
  overlay.addEventListener("pointerdown", function(e){ overlayPressStartedOnOverlay = (e.target === overlay); });
  overlay.addEventListener("click", function(e){
    if(overlayPressStartedOnOverlay && e.target === overlay) closeModal();
    overlayPressStartedOnOverlay = false;
  });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });

  // Any of these count as "switching to a page or window" for 檢視模式
  // purposes: picking a different school/attribute, switching the sidebar
  // tab, jumping to "all students", entering output-selection mode, or
  // opening any other modal window. Wrapping them here (rather than
  // scattering guard calls at every call site) means view mode reliably
  // tears itself down — with the keep/discard prompt when appropriate —
  // no matter which of these a user triggers next.
  (function(){
    const _selectSchool = selectSchool;
    selectSchool = function(id){ return leaveViewModeThen(function(){ return _selectSchool(id); }, { rendersItself: true }); };

    const _selectAttribute = selectAttribute;
    selectAttribute = function(id){ return leaveViewModeThen(function(){ return _selectAttribute(id); }, { rendersItself: true }); };

    const _switchSidebarTab = switchSidebarTab;
    switchSidebarTab = function(tab){ return leaveViewModeThen(function(){ return _switchSidebarTab(tab); }, { rendersItself: true }); };

    const _goToAllStudents = goToAllStudents;
    goToAllStudents = function(){ return leaveViewModeThen(function(){ return _goToAllStudents(); }, { rendersItself: true }); };

    const _toggleOutputMode = toggleOutputMode;
    toggleOutputMode = function(on){ return leaveViewModeThen(function(){ return _toggleOutputMode(on); }, { rendersItself: true }); };

    const _showModal = showModal;
    showModal = function(html, opts){ return leaveViewModeThen(function(){ return _showModal(html, opts); }); };
  })();

  function schoolIconUploadHtml(initialBlackBg){
    return '<div class="fieldset-title">學校圖標</div>' +
      '<div class="avatar-upload" id="schoolIconUpload" tabindex="0" style="width:90px;height:90px;">' +
        '<img id="schoolIconPreview" style="display:none;">' +
        '<div id="schoolIconPlaceholder" style="font-size:10.5px;">點擊選擇圖片<br>或貼上(Ctrl+V)</div>' +
      '</div>' +
      '<input type="file" id="schoolIconFileInput" accept="image/*" style="display:none">' +

      '<label class="school-icon-blackbg-toggle" for="schoolIconBlackBgCheck">' +
        '<input type="checkbox" id="schoolIconBlackBgCheck"' + (initialBlackBg ? " checked" : "") + '>' +
        '先加上黑色背景（與圖片合併）' +
      '</label>';
  }

  // Bakes a solid black background behind `dataUrl` (a 320x320 square image,
  // as produced by resizeImageFile) so any transparent/white parts of the
  // uploaded image sit on black permanently. Used only for the per-school
  // "先加上黑色背景" option — the result is stored as the school's icon
  // itself, independent of (and unaffected by) the global 圖片/卡片設定
  // category-list toggle.
  function bakeIconBlackBg(dataUrl){
    return new Promise(function(resolve, reject){
      if(!dataUrl){ resolve(null); return; }
      const img = new Image();
      img.onload = function(){
        const size = 320;
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, size, size);
        ctx.drawImage(img, 0, 0, size, size);
        resolve(canvas.toDataURL("image/png"));
      };
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

  function setupSchoolIconUpload(initialIcon, initialRawIcon, initialBlackBg){
    currentSchoolIconRawData = initialRawIcon || initialIcon || null;
    currentSchoolIconBlackBg = !!initialBlackBg;
    currentSchoolIconData = initialIcon || null;
    const box = document.getElementById("schoolIconUpload");
    const preview = document.getElementById("schoolIconPreview");
    const placeholder = document.getElementById("schoolIconPlaceholder");
    const fileInput = document.getElementById("schoolIconFileInput");
    const removeBtn = document.getElementById("removeSchoolIconBtn");
    const blackBgCheck = document.getElementById("schoolIconBlackBgCheck");

    function refresh(){
      if(currentSchoolIconData){
        preview.src = currentSchoolIconData;
        preview.style.display = "block";
        placeholder.style.display = "none";
      } else {
        preview.style.display = "none";
        placeholder.style.display = "flex";
      }
    }
    refresh();

    async function applyNewRaw(rawData){
      currentSchoolIconRawData = rawData;
      currentSchoolIconData = (rawData && currentSchoolIconBlackBg) ? await bakeIconBlackBg(rawData) : rawData;
      refresh();
    }

    box.addEventListener("click", function(){ fileInput.click(); });
    fileInput.addEventListener("change", async function(e){
      const file = e.target.files[0];
      if(!file) return;
      await applyNewRaw(await resizeImageFile(file));
      e.target.value = "";
    });
    box.addEventListener("paste", async function(e){
      const items = e.clipboardData && e.clipboardData.items;
      if(!items) return;
      for(const item of items){
        if(item.type && item.type.indexOf("image/") === 0){
          const blob = item.getAsFile();
          await applyNewRaw(await resizeImageFile(blob));
          e.preventDefault();
          break;
        }
      }
    });
    removeBtn.addEventListener("click", function(){
      currentSchoolIconRawData = null;
      currentSchoolIconData = null;
      refresh();
    });
    if(blackBgCheck){
      blackBgCheck.addEventListener("change", async function(){
        currentSchoolIconBlackBg = blackBgCheck.checked;
        if(currentSchoolIconRawData){
          currentSchoolIconData = currentSchoolIconBlackBg ? await bakeIconBlackBg(currentSchoolIconRawData) : currentSchoolIconRawData;
          refresh();
        }
      });
    }
  }

  async function openAbbrevListModal(){
    // Rows no longer have a fixed height (a row with several meaning chips
    // wraps taller than one with none), so pages are no longer a fixed row
    // count — instead each page packs in as many rows as fit under this
    // pixel budget (matching the footprint ~10 short rows used to take),
    // so a full page never needs its own scrollbar.
    const ROWS_AREA_MAX_HEIGHT = 432;
    await backfillAbbrevFromStudents();
    // Each row's meanings are kept as an array while the modal is open (one
    // chip per meaning), not as a comma-separated string — the comma only
    // ever appears in the underlying storage format for backward
    // compatibility with getMeaningsForPrefix() and friends.
    let rows = loadAbbrevList().map(function(r){
      return {
        abbr: r.abbr || "",
        meanings: String(r.meaning || "").split(",").map(function(m){ return m.trim(); }).filter(Boolean)
      };
    });
    ensureTrailingEmptyRow();
    let currentPage = 0;

    function ensureTrailingEmptyRow(){
      const last = rows[rows.length - 1];
      if(!last || last.abbr.trim() !== "" || last.meanings.length > 0){
        rows.push({ abbr: "", meanings: [] });
      }
    }

    function meaningChipsHtml(row){
      return row.meanings.map(function(m, mi){
        return '<span class="abbrev-chip" data-midx="' + mi + '">' +
          '<span class="abbrev-chip-text">' + escapeHtml(m) + '</span>' +
          '<button type="button" class="abbrev-chip-remove" title="移除這個意義" aria-label="移除這個意義">✕</button>' +
        '</span>';
      }).join("");
    }

    function rowHtml(row, globalIdx){
      return '<div class="abbrev-row" data-idx="' + globalIdx + '">' +
        '<input type="text" class="abbrev-key" placeholder="簡寫，例如 S" value="' + escapeHtml(row.abbr) + '">' +
        '<div class="abbrev-meanings" data-idx="' + globalIdx + '">' +
          meaningChipsHtml(row) +
          '<input type="text" class="abbrev-meaning-input" placeholder="' +
          (row.meanings.length ? "" : "代表意義，例如 Swimsuit") + '">' +
        '</div>' +
        '<button type="button" class="btn btn-ghost btn-sm abbrev-remove" title="刪除這一列" aria-label="刪除這一列">✕</button>' +
      '</div>';
    }

    showModal(
      '<h3>簡寫清單</h3>' +
      '<div class="abbrev-list" id="abbrevListRows"></div>' +
      '<div class="abbrev-pager">' +
        '<button type="button" class="btn btn-ghost btn-sm" id="btnAbbrevPrevPage">上一頁</button>' +
        '<span class="abbrev-page-label" id="abbrevPageLabel"></span>' +
        '<button type="button" class="btn btn-ghost btn-sm" id="btnAbbrevNextPage">下一頁</button>' +
      '</div>' +
      '<div class="modal-actions" style="justify-content:flex-end">' +
        '<button class="btn btn-primary" id="btnAbbrevClose">關閉</button>' +
      '</div>'
    );

    const rowsEl = document.getElementById("abbrevListRows");
    const pageLabelEl = document.getElementById("abbrevPageLabel");
    const prevBtn = document.getElementById("btnAbbrevPrevPage");
    const nextBtn = document.getElementById("btnAbbrevNextPage");

    // Off-screen clone used only to measure row heights before committing
    // to a page break — same width as the real list (set right before each
    // use) so text wraps identically, but invisible and out of flow so it
    // never causes a flash or affects layout/scroll position.
    const measureEl = document.createElement("div");
    measureEl.className = "abbrev-list";
    // position:fixed (rather than absolute) so this never enlarges the
    // modal's own scrollable area — the modal only sets overflow-y, which
    // makes browsers auto-compute overflow-x too, so an absolutely
    // positioned off-screen element here would risk a stray horizontal
    // scrollbar.
    measureEl.style.cssText = "position:fixed; visibility:hidden; pointer-events:none; height:auto; max-height:none; overflow:visible; top:0; left:0;";
    document.body.appendChild(measureEl);

    let pageStarts = [0];

    // Starting from row startIdx, adds rows one at a time to the (hidden)
    // measuring clone until the next one would push the accumulated height
    // over budget, then returns how many rows fit. Always returns at least
    // 1, so a single oversized row (e.g. one abbreviation with many
    // meanings) still gets its own page instead of looping forever.
    function measurePageRowCount(startIdx){
      measureEl.style.width = rowsEl.clientWidth + "px";
      measureEl.innerHTML = "";
      let count = 0;
      for(let i = startIdx; i < rows.length; i++){
        const wrapper = document.createElement("div");
        wrapper.innerHTML = rowHtml(rows[i], i);
        measureEl.appendChild(wrapper.firstElementChild);
        if(count > 0 && measureEl.scrollHeight > ROWS_AREA_MAX_HEIGHT){
          measureEl.removeChild(measureEl.lastElementChild);
          break;
        }
        count++;
      }
      return Math.max(count, 1);
    }

    function computePageStarts(){
      pageStarts = [0];
      let idx = 0;
      while(idx < rows.length){
        idx += measurePageRowCount(idx);
        if(idx < rows.length) pageStarts.push(idx);
      }
    }

    function updatePager(pages){
      pageLabelEl.textContent = "第 " + (currentPage + 1) + " / " + pages + " 頁";
      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = currentPage >= pages - 1;
    }

    function renderPage(){
      computePageStarts();
      const pages = pageStarts.length;
      if(currentPage >= pages) currentPage = pages - 1;
      if(currentPage < 0) currentPage = 0;
      const start = pageStarts[currentPage];
      const end = currentPage + 1 < pages ? pageStarts[currentPage + 1] : rows.length;
      const pageRows = rows.slice(start, end);
      rowsEl.innerHTML = pageRows.map(function(row, i){ return rowHtml(row, start + i); }).join("");
      updatePager(pages);
      syncAllMeaningInputWidths();
    }

    // While viewing (not focused), the input stays collapsed to a sliver
    // (see CSS) so it never has a blank wrapped line to show in the first
    // place. Only once it's actually being typed into does it regain a
    // normal typing width — and only then do we need to check whether
    // *that* width wrapped it onto a line of its own (its top no longer
    // lines up with the last chip's), in which case it stretches to fill
    // that line instead of leaving the rest blank.
    function syncMeaningInputWidth(container){
      const input = container.querySelector(".abbrev-meaning-input");
      if(!input) return;
      const chips = container.querySelectorAll(".abbrev-chip");
      if(!chips.length || !input.classList.contains("active")){
        input.classList.remove("wrap-full");
        return;
      }
      const lastChip = chips[chips.length - 1];
      const wrapped = input.offsetTop > lastChip.offsetTop + (lastChip.offsetHeight / 2);
      input.classList.toggle("wrap-full", wrapped);
    }

    // Measures how wide a string renders in an element's font, so the
    // "add meaning" box can grow to fit exactly what's been typed instead
    // of jumping to some fixed size. A single offscreen canvas is reused
    // across calls since creating one per keystroke would be wasteful.
    let measureCtx = null;
    function textPixelWidth(text, input){
      if(!measureCtx) measureCtx = document.createElement("canvas").getContext("2d");
      const cs = getComputedStyle(input);
      measureCtx.font = cs.fontSize + " " + cs.fontFamily;
      return measureCtx.measureText(text).width;
    }

    // Grows (or shrinks back) the input's width to fit its current value,
    // clamped between a collapsed sliver and a sensible max so one very
    // long meaning can't stretch the box past reasonable bounds — beyond
    // that cap it just scrolls internally like a normal text field.
    function updateMeaningInputWidth(input){
      const w = input.value ? textPixelWidth(input.value, input) + 10 : 6;
      input.style.setProperty("--meaning-input-w", Math.max(6, Math.min(w, 140)) + "px");
    }

    function syncAllMeaningInputWidths(){
      rowsEl.querySelectorAll(".abbrev-meanings").forEach(syncMeaningInputWidth);
    }

    renderPage();

    // Typing an abbreviation into the last row, or adding its first meaning
    // chip, automatically appends a fresh empty row after it (once), instead
    // of requiring a manual "+ add row" button. Only a brand-new row is
    // appended to the live DOM (no full re-render, so nothing else on the
    // page loses focus) — if it doesn't fit under the height budget it's
    // removed again immediately; it'll appear once pagination is next
    // recalculated (see the focusout handler below), which is a cheap way
    // to keep typing responsive without recomputing page breaks on every
    // keystroke.
    function handleTrailingRowGrowth(idx){
      if(idx !== rows.length - 1) return;
      if(rows[idx].abbr.trim() === "" && rows[idx].meanings.length === 0) return;
      rows.push({ abbr: "", meanings: [] });
      const newIdx = rows.length - 1;
      const wrapper = document.createElement("div");
      wrapper.innerHTML = rowHtml(rows[newIdx], newIdx);
      const newRowEl = wrapper.firstElementChild;
      rowsEl.appendChild(newRowEl);
      if(rowsEl.scrollHeight > ROWS_AREA_MAX_HEIGHT){
        rowsEl.removeChild(newRowEl);
      }
    }

    // Re-renders just one row's meaning chips (after adding or removing a
    // chip) and refocuses the "add meaning" input, so entering several
    // meanings in a row feels continuous rather than resetting focus.
    function refreshRowMeanings(idx){
      const container = rowsEl.querySelector('.abbrev-meanings[data-idx="' + idx + '"]');
      if(!container) return;
      const row = rows[idx];
      container.innerHTML = meaningChipsHtml(row) +
        '<input type="text" class="abbrev-meaning-input" placeholder="' +
          (row.meanings.length ? "" : "代表意義，例如 Swimsuit") + '">';
      const newInput = container.querySelector(".abbrev-meaning-input");
      if(newInput) newInput.focus();
      syncMeaningInputWidth(container);
    }

    // Recomputes page breaks immediately after a meaning chip is added or
    // removed on row `idx`, rather than waiting for focus to leave the
    // list — so a row that just grew/shrank past the page's height budget
    // moves to the correct page right away. If the row's own "add meaning"
    // input was what's focused, it's refocused after the move so typing
    // several meanings in a row still feels continuous even across a page
    // break.
    function repaginateAfterMeaningChange(idx){
      const active = document.activeElement;
      const shouldRefocus = !!(active && active.classList.contains("abbrev-meaning-input") &&
        active.closest(".abbrev-meanings") &&
        Number(active.closest(".abbrev-meanings").getAttribute("data-idx")) === idx);

      computePageStarts();
      let page = 0;
      for(let p = 0; p < pageStarts.length; p++){
        if(pageStarts[p] <= idx) page = p;
      }
      currentPage = page;
      renderPage();

      if(shouldRefocus){
        const container = rowsEl.querySelector('.abbrev-meanings[data-idx="' + idx + '"]');
        const input = container && container.querySelector(".abbrev-meaning-input");
        if(input) input.focus();
      }
    }

    // Commits whatever text is sitting in a row's "add meaning" input as a
    // new chip (used on Enter/comma, on blur, and when the modal closes so
    // a half-typed meaning is never silently dropped).
    function addMeaningFromInput(inputEl){
      const container = inputEl.closest(".abbrev-meanings");
      const idx = Number(container.getAttribute("data-idx"));
      const val = inputEl.value.replace(/,$/, "").trim();
      inputEl.value = "";
      if(!val) return;
      if(rows[idx].meanings.indexOf(val) === -1) rows[idx].meanings.push(val);
      refreshRowMeanings(idx);
      handleTrailingRowGrowth(idx);
      repaginateAfterMeaningChange(idx);
    }

    rowsEl.addEventListener("input", function(e){
      const target = e.target;
      if(target.classList.contains("abbrev-meaning-input")){
        updateMeaningInputWidth(target);
        syncMeaningInputWidth(target.closest(".abbrev-meanings"));
        return;
      }
      if(!target.classList.contains("abbrev-key")) return;
      const rowEl = target.closest(".abbrev-row");
      const idx = Number(rowEl.getAttribute("data-idx"));
      rows[idx].abbr = target.value;
      handleTrailingRowGrowth(idx);
    });

    // Enter or comma turns whatever's typed into the "add meaning" box into
    // its own chip; comma is accepted as a fast-typing shortcut but is
    // stripped immediately, so the user never sees a raw comma in the list.
    rowsEl.addEventListener("keydown", function(e){
      if(!e.target.classList.contains("abbrev-meaning-input")) return;
      if(e.key !== "Enter" && e.key !== ",") return;
      e.preventDefault();
      addMeaningFromInput(e.target);
    });

    // The trailing "add meaning" box sits collapsed to a sliver (see CSS)
    // whenever it isn't being typed into, so it never reserves enough width
    // to get pushed onto a blank line of its own. Focusing it doesn't widen
    // it by itself — typing does, character by character (see the "input"
    // handler above) — but size it correctly right away in case it somehow
    // already has a value.
    rowsEl.addEventListener("focusin", function(e){
      const target = e.target;
      if(!target.classList.contains("abbrev-meaning-input")) return;
      target.classList.add("active");
      updateMeaningInputWidth(target);
      syncMeaningInputWidth(target.closest(".abbrev-meanings"));
    });

    // While actively typing, row heights are patched in place (above) so
    // focus never jumps around; that can leave a page slightly over or
    // under its height budget in the meantime (the CSS max-height/scroll
    // is a safety net for that). Once focus actually leaves the rows list
    // — not just moves to another field within it — this recomputes page
    // breaks properly from the current row heights, so the page settles
    // back to exactly what fits, no scrollbar.
    rowsEl.addEventListener("focusout", function(e){
      const target = e.target;
      if(target.classList.contains("abbrev-meaning-input")){
        if(target.value.trim()){
          addMeaningFromInput(target);
        } else {
          target.classList.remove("active");
          target.style.removeProperty("--meaning-input-w");
          syncMeaningInputWidth(target.closest(".abbrev-meanings"));
        }
      }
      setTimeout(function(){
        if(rowsEl.contains(document.activeElement)) return;
        renderPage();
      }, 0);
    });

    rowsEl.addEventListener("click", function(e){
      const meaningsBox = e.target.closest(".abbrev-meanings");
      if(meaningsBox && !e.target.closest(".abbrev-chip") && e.target !== meaningsBox.querySelector(".abbrev-meaning-input")){
        meaningsBox.querySelector(".abbrev-meaning-input").focus();
        return;
      }
      const chipRemove = e.target.closest(".abbrev-chip-remove");
      if(chipRemove){
        const chip = chipRemove.closest(".abbrev-chip");
        const container = chipRemove.closest(".abbrev-meanings");
        const idx = Number(container.getAttribute("data-idx"));
        const mi = Number(chip.getAttribute("data-midx"));
        rows[idx].meanings.splice(mi, 1);
        refreshRowMeanings(idx);
        repaginateAfterMeaningChange(idx);
        return;
      }
      const removeBtn = e.target.closest(".abbrev-remove");
      if(!removeBtn) return;
      const idx = Number(removeBtn.closest(".abbrev-row").getAttribute("data-idx"));
      rows.splice(idx, 1);
      ensureTrailingEmptyRow();
      renderPage();
    });

    prevBtn.addEventListener("click", function(){
      currentPage -= 1;
      renderPage();
    });

    nextBtn.addEventListener("click", function(){
      currentPage += 1;
      renderPage();
    });

    document.getElementById("btnAbbrevClose").addEventListener("click", closeModal);

    // Whenever this modal closes — by the 關閉 button, Escape, or clicking
    // outside — first commit any meaning still sitting unsubmitted in an
    // "add meaning" box (so it isn't lost just because the user didn't
    // press Enter), then merge any rows sharing the same abbreviation
    // (case-insensitive) into one row, combining their meaning chips (so
    // "M" = Maid and "M" = Magical becomes a single "M" row with both
    // meanings), then persist sorted by abbreviation A→Z. The comma-joined
    // string is only the storage format — rows with no abbreviation at all
    // are dropped.
    modalBeforeClose = function(){
      if(measureEl.parentNode) measureEl.parentNode.removeChild(measureEl);
      document.querySelectorAll("#abbrevListRows .abbrev-meanings").forEach(function(container){
        const idx = Number(container.getAttribute("data-idx"));
        const input = container.querySelector(".abbrev-meaning-input");
        if(!input) return;
        const val = input.value.replace(/,$/, "").trim();
        if(val && rows[idx].meanings.indexOf(val) === -1) rows[idx].meanings.push(val);
      });
      const merged = {};
      const order = [];
      rows.forEach(function(r){
        const abbr = r.abbr.trim();
        if(!abbr) return;
        const key = abbr.toLowerCase();
        if(!merged[key]){
          merged[key] = { abbr: abbr, meanings: [] };
          order.push(key);
        }
        r.meanings.forEach(function(m){
          if(merged[key].meanings.indexOf(m) === -1) merged[key].meanings.push(m);
        });
      });
      const cleaned = order
        .map(function(key){ return { abbr: merged[key].abbr, meaning: merged[key].meanings.join(",") }; })
        .sort(function(a, b){ return a.abbr.toLowerCase().localeCompare(b.abbr.toLowerCase()); });
      saveAbbrevList(cleaned);
      // Card names in "完整顯示" style (and the abbrev-warning dots) are
      // derived from this list, so refresh the grid whenever it changes —
      // otherwise a just-edited meaning wouldn't show up until some other
      // unrelated re-render happened to fire.
      renderMain();
      return true;
    };
  }

  // Renders the "圖片設定" (image settings) block: a dropdown choosing which
  // sub-panel to show (background image / title icon / card display), the
  // upload box + adjustment sliders for the image panels, and a lock-icon
  // toggle for the card-display panel. Used both inside the 通用設定 modal
  // (opts.showCardDisplayTab: true, adds the 卡片顯示 option) and inside the
  // 檢視模式 (view mode) dropdown (image tabs only — card display doesn't
  // belong in a background-preview flow). When showViewModeBtn is true, a
  // "檢視模式" button is added to the left of the remove-image button (only
  // shown while on the background-image tab).
  function imageSettingsHtml(draft, opts){
    opts = opts || {};
    const showViewModeBtn = !!opts.showViewModeBtn;
    const showCardDisplayTab = !!opts.showCardDisplayTab;
    const showBgSlots = !!opts.showBgSlots;

      '<div class="field">' +
        '<select id="imgTabSelect">' +
          '<option value="bg">背景圖片</option>' +
          '<option value="icon">標題圖示</option>' +
          (showCardDisplayTab ? '<option value="cardDisplay">卡片顯示</option>' : '') +
          '<option value="categoryList">分類清單</option>' +
          (showCardDisplayTab ? '<option value="editUi">編輯界面</option>' : '') +
        '</select>' +
      '</div>' +
      '<div id="imageUploadPanel">' +
        (showBgSlots ? '<div class="bg-slot-row" id="bgSlotRow"></div>' : '') +
        '<div class="image-upload-row">' +
          '<div class="avatar-upload settings-img-box" id="imgUploadBox" tabindex="0">' +
            '<img id="imgUploadPreview" style="display:none;">' +
            '<div id="imgUploadPlaceholder">選擇圖片</div>' +
          '</div>' +
          '<div class="image-upload-actions">' +
            '<div class="upload-hint" id="imgUploadHint">點擊或貼上(Ctrl+V)</div>' +
            '<div class="image-upload-btn-row">' +
              (showViewModeBtn ? '<button type="button" class="btn btn-ghost btn-sm" id="viewModeBtn">檢視模式</button>' : '') +
              '<button type="button" class="btn btn-ghost btn-sm" id="removeImgBtn">移除圖片</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div id="bgFallbackColorField" style="display:none">' +
          '<div class="fieldset-title">背景底色</div>' +
          '<div class="field">' +
            '<label>沒有上傳背景圖片時使用的底色</label>' +
            '<div class="ripple-color-brightness-row">' +
              '<input type="color" id="st_bgFallbackColor" value="' + (draft.bgFallbackColor || (draft.theme === "dark" ? "#181c29" : "#eef1f6")) + '">' +
              '<button type="button" class="btn btn-ghost btn-sm" id="st_bgFallbackReset">重置為預設</button>' +
            '</div>' +

          '<div class="fieldset-title">標題文字</div>' +

          '<div class="field">' +
            '<div class="theme-toggle-row">' +
              '<button type="button" class="btn btn-sm theme-opt' + (!draft.titleIconOnly ? " active" : "") + '" id="st_titleIconOnlyOff">顯示文字</button>' +
              '<button type="button" class="btn btn-sm theme-opt' + (draft.titleIconOnly ? " active" : "") + '" id="st_titleIconOnlyOn">只顯示圖示</button>' +
            '</div>' +
          '</div>' +
          '<div class="fieldset-title">圖示樣式</div>' +
          '<div class="row2">' +
            '<div class="field"><label for="st_titleIconSize">大小</label><select id="st_titleIconSize">' +
              '<option value="small"' + (draft.titleIconSize === "small" ? " selected" : "") + '>小</option>' +
              '<option value="medium"' + (draft.titleIconSize !== "small" && draft.titleIconSize !== "large" ? " selected" : "") + '>中</option>' +
              '<option value="large"' + (draft.titleIconSize === "large" ? " selected" : "") + '>大</option>' +
            '</select></div>' +
            '<div class="field"><label for="st_titleIconShape">形狀</label><select id="st_titleIconShape">' +
              '<option value="rounded"' + (draft.titleIconShape !== "circle" && draft.titleIconShape !== "square" ? " selected" : "") + '>圓角</option>' +
              '<option value="circle"' + (draft.titleIconShape === "circle" ? " selected" : "") + '>圓形</option>' +
              '<option value="square"' + (draft.titleIconShape === "square" ? " selected" : "") + '>方形</option>' +
            '</select></div>' +
          '</div>' +
          '<div class="field">' +
            '<label>黑色背景</label>' +
            '<div class="theme-toggle-row">' +
              '<button type="button" class="btn btn-sm theme-opt' + (!draft.titleIconBlackBg ? " active" : "") + '" id="st_titleIconBlackBgOff">關閉</button>' +
              '<button type="button" class="btn btn-sm theme-opt' + (draft.titleIconBlackBg ? " active" : "") + '" id="st_titleIconBlackBgOn">開啟</button>' +

            '<option value="schoolPicker"' + (draft.titleClickAction === "schoolPicker" ? " selected" : "") + '>回到選擇學校畫面</option>' +
            '<option value="none"' + (draft.titleClickAction === "none" ? " selected" : "") + '>不做任何事</option>' +

        '</div>' +
        '<div id="bgAdjustRow">' +
          '<div class="bg-param-lock-note" style="display:none; font-size:12.5px; color:var(--ink-soft); margin:4px 0 12px;">護眼模式中已暫時鎖定（數值保留，關閉後恢復）。</div>' +
          sliderField("st_bgOpacity", "透明度", draft.bgOpacity, 10, 100) +
          sliderField("st_bgBrightness", "亮度", draft.bgBrightness, 30, 150) +

          '<div class="field">' +
            '<label>疊加顏色 <span class="slider-val" id="st_bgTintOpacity_val">' + draft.bgTintOpacity + '</span></label>' +
            '<div class="bg-tint-row">' +
              '<input type="color" id="st_bgTintColor" value="' + draft.bgTintColor + '">' +
              '<input type="range" id="st_bgTintOpacity" min="0" max="80" value="' + draft.bgTintOpacity + '">' +
            '</div>' +
          '</div>' +
          '<div class="row2">' +

              '<option value="contain"' + (draft.bgFit === "contain" ? " selected" : "") + '>完整顯示</option>' +
              '<option value="repeat"' + (draft.bgFit === "repeat" ? " selected" : "") + '>小圖平鋪</option>' +
            '</select></div>' +
            '<div class="field"><label for="st_bgPosition">位置</label><select id="st_bgPosition">' +
              '<option value="left top"' + (draft.bgPosition === "left top" ? " selected" : "") + '>左上</option>' +
              '<option value="center top"' + (draft.bgPosition === "center top" ? " selected" : "") + '>上</option>' +
              '<option value="right top"' + (draft.bgPosition === "right top" ? " selected" : "") + '>右上</option>' +
              '<option value="left center"' + (draft.bgPosition === "left center" ? " selected" : "") + '>左</option>' +
              '<option value="center center"' + (draft.bgPosition === "center center" ? " selected" : "") + '>置中</option>' +
              '<option value="right center"' + (draft.bgPosition === "right center" ? " selected" : "") + '>右</option>' +
              '<option value="left bottom"' + (draft.bgPosition === "left bottom" ? " selected" : "") + '>左下</option>' +
              '<option value="center bottom"' + (draft.bgPosition === "center bottom" ? " selected" : "") + '>下</option>' +
              '<option value="right bottom"' + (draft.bgPosition === "right bottom" ? " selected" : "") + '>右下</option>' +
            '</select></div>' +
          '</div>' +
        '</div>' +
        '<input type="file" id="imgUploadFileInput" accept="image/*" style="display:none">' +
      '</div>' +
      (showCardDisplayTab ?
        '<div id="cardDisplayPanel" style="display:none">' +
          '<div class="field">' +
            '<label>好感度封頂顯示</label>' +
            '<div class="theme-toggle-row">' +
              '<button type="button" class="btn btn-sm theme-opt' + (draft.affinityLockIcon ? " active" : "") + '" id="st_affLockOn">鎖頭樣式</button>' +
              '<button type="button" class="btn btn-sm theme-opt' + (!draft.affinityLockIcon ? " active" : "") + '" id="st_affLockOff">普通愛心</button>' +
            '</div>' +
