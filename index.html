  // Wires up the behavior for an imageSettingsHtml() block that was just
  // inserted under `root` (either the settings modal or the view mode
  // dropdown). Mutates `draft` in place and calls onChange() after every
  // edit (which should re-apply live preview + refresh any "unsaved
  // changes" state in the caller). opts.onEnterViewMode, if given, is
  // wired to the 檢視模式 button when present in this block.
  function setupImageSettingsHandlers(root, draft, onChange, opts){
    opts = opts || {};
    // 切換背景方案時會程式性地觸發各控制項的事件來同步畫面；這段期間先不要每個控制項各套用一次，
    // 等整組參數都就位後再統一套用一次。
    let suppressChange = false;
    const rawOnChange = onChange;
    onChange = function(){ if(!suppressChange) rawOnChange(); };
    let activeImageTab = "bg";
    const IMAGE_TAB_CONFIG = {
      bg: { key: "bgImage", resize: resizeBackgroundImageFile, boxLabel: "選擇圖片", hint: "點擊或貼上(Ctrl+V)", removeLabel: "移除背景圖片" },
      icon: { key: "titleIcon", resize: resizeImageFile, boxLabel: "選擇圖示", hint: "點擊或貼上(Ctrl+V)<br>同時套用到瀏覽器分頁圖示", removeLabel: "移除標題圖示" }
    };

    const imgTabSelect = root.querySelector("#imgTabSelect");
    const imageUploadPanel = root.querySelector("#imageUploadPanel");
    const cardDisplayPanel = root.querySelector("#cardDisplayPanel");
    const categoryListPanel = root.querySelector("#categoryListPanel");
    const editUiPanel = root.querySelector("#editUiPanel");
    const imgBox = root.querySelector("#imgUploadBox");
    const imgPreview = root.querySelector("#imgUploadPreview");
    const imgPlaceholder = root.querySelector("#imgUploadPlaceholder");
    const imgHint = root.querySelector("#imgUploadHint");
    const imgFileInput = root.querySelector("#imgUploadFileInput");
    const removeImgBtn = root.querySelector("#removeImgBtn");
    const viewModeBtn = root.querySelector("#viewModeBtn");
    const bgAdjustRow = root.querySelector("#bgAdjustRow");
    const bgSlotRow = root.querySelector("#bgSlotRow");
    const bgFallbackColorField = root.querySelector("#bgFallbackColorField");
    const titleIconExtraFields = root.querySelector("#titleIconExtraFields");
    const affLockOnBtn = root.querySelector("#st_affLockOn");
    const affLockOffBtn = root.querySelector("#st_affLockOff");
    const catBlackBgOnBtn = root.querySelector("#st_catBlackBgOn");
    const catBlackBgOffBtn = root.querySelector("#st_catBlackBgOff");
    const attrPosterGlowOnBtn = root.querySelector("#st_attrPosterGlowOn");
    const attrPosterGlowOffBtn = root.querySelector("#st_attrPosterGlowOff");
    const bgFallbackColorInput = root.querySelector("#st_bgFallbackColor");
    const bgFallbackResetBtn = root.querySelector("#st_bgFallbackReset");
    const titleTextInput = root.querySelector("#st_titleText");
    const titleIconOnlyOffBtn = root.querySelector("#st_titleIconOnlyOff");
    const titleIconOnlyOnBtn = root.querySelector("#st_titleIconOnlyOn");
    const titleIconSizeSelect = root.querySelector("#st_titleIconSize");
    const titleIconShapeSelect = root.querySelector("#st_titleIconShape");
    const titleIconBlackBgOffBtn = root.querySelector("#st_titleIconBlackBgOff");
    const titleIconBlackBgOnBtn = root.querySelector("#st_titleIconBlackBgOn");
    const titleClickActionSelect = root.querySelector("#st_titleClickAction");
    const resetSidebarBtn = root.querySelector("#st_resetSidebarWidth");

    function refreshImagePanel(){
      const isCardDisplay = activeImageTab === "cardDisplay";
      const isCategoryList = activeImageTab === "categoryList";
      const isEditUi = activeImageTab === "editUi";
      imageUploadPanel.style.display = (isCardDisplay || isCategoryList || isEditUi) ? "none" : "block";
      if(cardDisplayPanel) cardDisplayPanel.style.display = isCardDisplay ? "block" : "none";
      if(categoryListPanel) categoryListPanel.style.display = isCategoryList ? "block" : "none";
      if(editUiPanel) editUiPanel.style.display = isEditUi ? "block" : "none";
      if(isCardDisplay || isCategoryList || isEditUi){
        if(bgFallbackColorField) bgFallbackColorField.style.display = "none";
        if(titleIconExtraFields) titleIconExtraFields.style.display = "none";
        return;
      }
      renderBgSlotRow();
      const cfg = IMAGE_TAB_CONFIG[activeImageTab];
      imgPlaceholder.textContent = cfg.boxLabel;
      imgHint.innerHTML = cfg.hint;
      removeImgBtn.textContent = cfg.removeLabel;
      bgAdjustRow.style.display = (activeImageTab === "bg" && draft.bgImage) ? "block" : "none";
      if(bgFallbackColorField) bgFallbackColorField.style.display = (activeImageTab === "bg" && !draft.bgImage) ? "block" : "none";
      if(titleIconExtraFields) titleIconExtraFields.style.display = (activeImageTab === "icon") ? "block" : "none";
      if(viewModeBtn) viewModeBtn.style.display = activeImageTab === "bg" ? "" : "none";
      const value = draft[cfg.key];
      if(value){
        imgPreview.src = value;
        imgPreview.style.display = "block";
        imgPlaceholder.style.display = "none";
      } else {
        imgPreview.style.display = "none";
        imgPlaceholder.style.display = "flex";
      }
    }
    refreshImagePanel();
    syncBgParamLockUi(!!(draft.eyeCare && draft.eyeCareLockParams));

    // ---- 背景圖片方案 ----
    function renderBgSlotRow(){
      if(!bgSlotRow) return;
      bgSlotRow.style.display = activeImageTab === "bg" ? "" : "none";
      const idx = Math.max(1, Math.min(BG_SLOT_MAX, draft.bgSlotIdx || 1));
      let h = '<div class="bg-slot-label">背景方案</div><div class="bg-slot-chips">';
      for(let i = 1; i <= BG_SLOT_MAX; i++){
        h += '<button type="button" class="bg-slot-chip' + (i === idx ? " active" : "") + '" data-slot="' + i + '" title="方案 ' + i + '"><span>' + i + '</span></button>';
      }
      h += '</div>';
      bgSlotRow.innerHTML = h;
      bgSlotRow.querySelectorAll(".bg-slot-chip[data-slot]").forEach(function(b){
        const i = parseInt(b.getAttribute("data-slot"), 10);
        const img = i === idx ? draft.bgImage : (bgSlotGet(i) && bgSlotGet(i).bgImage);
        if(img){ b.style.backgroundImage = 'url("' + img + '")'; b.classList.add("has-img"); }
      });
    }
    // 把 draft 的背景數值同步到畫面上的滑桿／選單（各控制項的原有處理函式會順便更新預覽）
    function syncBgControlsFromDraft(){
      function fire(id, value, evt){
        const el = root.querySelector("#" + id);
        if(!el) return;
        el.value = value;
        el.dispatchEvent(new Event(evt, { bubbles: true }));
      }
      fire("st_bgOpacity", draft.bgOpacity, "input");
      fire("st_bgBrightness", draft.bgBrightness, "input");
      fire("st_bgBlur", draft.bgBlur, "input");
      fire("st_bgSaturation", draft.bgSaturation, "input");
      fire("st_bgTintColor", draft.bgTintColor, "input");
      fire("st_bgTintOpacity", draft.bgTintOpacity, "input");
      fire("st_bgFit", draft.bgFit, "change");
      fire("st_bgPosition", draft.bgPosition, "change");
      if(bgFallbackColorInput) bgFallbackColorInput.value = draft.bgFallbackColor || (draft.theme === "dark" ? "#181c29" : "#eef1f6");
    }
    // 先把圖片載入並解碼完成，再一次套用參數與圖片，避免畫面先出現未就緒的圖片或半套的設定
    function preloadBgImage(src){
      return new Promise(function(resolve){
        if(!src){ resolve(); return; }
        const im = new Image();
        im.onload = function(){ if(im.decode){ im.decode().then(resolve, resolve); } else { resolve(); } };
        im.onerror = resolve;
        im.src = src;
      });
    }
    async function loadBgSlotIntoDraft(target){
      const vals = Object.assign(bgSlotDefaults(), bgSlotGet(target) || {});
      await preloadBgImage(vals.bgImage);
      Object.assign(draft, vals, { bgSlotIdx: target });
      suppressChange = true;
      try{ syncBgControlsFromDraft(); } finally { suppressChange = false; }
      refreshImagePanel();
      onChange();
    }
    let bgSlotBusy = false;
    async function bgSlotAction(fn){
      if(bgSlotBusy) return;
      bgSlotBusy = true;
      try{
        await bgSlotsReady;
        await fn();
      } catch(err){
        showToast("背景方案操作失敗，請再試一次");
      } finally {
        bgSlotBusy = false;
      }
    }
    if(bgSlotRow){
      bgSlotRow.addEventListener("click", function(e){
        const btn = e.target.closest && e.target.closest(".bg-slot-chip[data-slot]");
        if(!btn) return;
        const cur = Math.max(1, Math.min(BG_SLOT_MAX, draft.bgSlotIdx || 1));
        const target = parseInt(btn.getAttribute("data-slot"), 10);
        if(!target || target === cur) return;
        bgSlotAction(async function(){
          bgSlotPending[cur] = bgSlotSnapshot(draft);      // 離開前先暫存這個方案目前的內容（按「儲存」才會寫入）
          await loadBgSlotIntoDraft(target);
        });
      });
    }

    imgTabSelect.addEventListener("change", function(){ activeImageTab = this.value; refreshImagePanel(); });

    if(affLockOnBtn && affLockOffBtn){
      affLockOnBtn.addEventListener("click", function(){
        draft.affinityLockIcon = true;
        affLockOnBtn.classList.add("active");
        affLockOffBtn.classList.remove("active");
        onChange();
      });
      affLockOffBtn.addEventListener("click", function(){
        draft.affinityLockIcon = false;
        affLockOffBtn.classList.add("active");
        affLockOnBtn.classList.remove("active");
        onChange();
      });
    }

    if(catBlackBgOnBtn && catBlackBgOffBtn){
      catBlackBgOnBtn.addEventListener("click", function(){
        draft.schoolIconBlackBg = true;
        catBlackBgOnBtn.classList.add("active");
        catBlackBgOffBtn.classList.remove("active");
        onChange();
      });
      catBlackBgOffBtn.addEventListener("click", function(){
        draft.schoolIconBlackBg = false;
        catBlackBgOffBtn.classList.add("active");
        catBlackBgOnBtn.classList.remove("active");
        onChange();
      });
    }

    if(attrPosterGlowOnBtn && attrPosterGlowOffBtn){
      attrPosterGlowOnBtn.addEventListener("click", function(){
        draft.attributePosterTextGlow = true;
        attrPosterGlowOnBtn.classList.add("active");
        attrPosterGlowOffBtn.classList.remove("active");
        onChange();
      });
      attrPosterGlowOffBtn.addEventListener("click", function(){
        draft.attributePosterTextGlow = false;
        attrPosterGlowOffBtn.classList.add("active");
        attrPosterGlowOnBtn.classList.remove("active");
        onChange();
      });
    }

    // 背景底色 and 標題圖示 (標題文字／圖示樣式／點擊行為) live in the shared
    // icon/bg tabs, which — unlike cardDisplayPanel/categoryListPanel — also
    // render inside 檢視模式's dropdown (see enterViewMode), not just the
    // main 通用設定 modal. So these need to be wired here with the rest of
    // this function (root-scoped, guarded with null checks), not as a
    // one-off document.getElementById block back in doOpenSettingsModal —
    // otherwise they'd render in 檢視模式 but silently do nothing there.
    if(bgFallbackColorInput && bgFallbackResetBtn){
      bgFallbackColorInput.addEventListener("input", function(){
        draft.bgFallbackColor = this.value;
        onChange();
      });
      bgFallbackResetBtn.addEventListener("click", function(){
        draft.bgFallbackColor = "";
        onChange();
        bgFallbackColorInput.value = draft.theme === "dark" ? "#181c29" : "#eef1f6";

    if(titleTextInput){
      titleTextInput.addEventListener("input", function(){
        draft.titleText = this.value;
        onChange();
      });

          titleIconOnlyOnBtn.classList.remove("active");

          draft.titleIconOnly = true; onChange();

    root.querySelector("#st_bgOpacity").addEventListener("input", function(){

    root.querySelector("#st_bgBrightness").addEventListener("input", function(){

    root.querySelector("#st_bgSaturation").addEventListener("input", function(){
      draft.bgSaturation = parseInt(this.value, 10);

    imgBox.addEventListener("click", function(){ imgFileInput.click(); });
    imgFileInput.addEventListener("change", async function(e){
      const file = e.target.files[0];
      if(!file) return;
      const cfg = IMAGE_TAB_CONFIG[activeImageTab];
      draft[cfg.key] = await cfg.resize(file);
      refreshImagePanel();
      onChange();

    });
    imgBox.addEventListener("paste", async function(e){
      const items = e.clipboardData && e.clipboardData.items;
      if(!items) return;
      for(const item of items){
        if(item.type && item.type.indexOf("image/") === 0){
          const blob = item.getAsFile();
          const cfg = IMAGE_TAB_CONFIG[activeImageTab];
          draft[cfg.key] = await cfg.resize(blob);
          refreshImagePanel();
          onChange();
          e.preventDefault();

    removeImgBtn.addEventListener("click", function(){
      const cfg = IMAGE_TAB_CONFIG[activeImageTab];
      if(draft[cfg.key]){
        draft[cfg.key] = null;
        refreshImagePanel();
        onChange();

      viewModeBtn.addEventListener("click", function(){ opts.onEnterViewMode(); });

    // 重置側邊欄寬度 previews immediately (so it's visible right away, same
    // as every other control here) but only actually removes the stored
    // width once the surrounding context commits its changes — Save in

    // returned handle so each caller can hook it into its own save/discard
    // points instead of this function assuming which one applies.
    let pendingSidebarReset = false;
    let sidebarElForReset = null;
    let originalSidebarWidthStyle = "";
    if(resetSidebarBtn){
      sidebarElForReset = document.getElementById("sidebar");
      originalSidebarWidthStyle = sidebarElForReset ? sidebarElForReset.style.width : "";
      resetSidebarBtn.addEventListener("click", function(){
        pendingSidebarReset = true;
        if(sidebarElForReset) sidebarElForReset.style.width = "";
        resetSidebarBtn.textContent = "將於儲存後重置";
        resetSidebarBtn.disabled = true;
        onChange();
      });
    }
    // Picks up a 重置側邊欄寬度 that was already pending in the previous
    // window (settings ⇄ 檢視模式), so it isn't silently dropped when the
    // controls get rebuilt in the other context.
    if(opts.carriedSidebarReset){
      pendingSidebarReset = true;
      if(!sidebarElForReset) sidebarElForReset = document.getElementById("sidebar");
      originalSidebarWidthStyle = opts.carriedSidebarReset.originalWidth;
      if(resetSidebarBtn){
        resetSidebarBtn.textContent = "將於儲存後重置";
        resetSidebarBtn.disabled = true;
      }
    }

    return {
      refreshImagePanel: refreshImagePanel,
      setActiveTab: function(tab){ activeImageTab = tab; refreshImagePanel(); },
      hasPendingSidebarReset: function(){ return pendingSidebarReset; },
      getSidebarResetCarry: function(){
        return pendingSidebarReset ? { originalWidth: originalSidebarWidthStyle } : null;
      },
      commitPendingSidebarReset: function(){
        if(!pendingSidebarReset) return;
        pendingSidebarReset = false;
        localStorage.removeItem("ba-roster-sidebar-width");
      },
      revertPendingSidebarReset: function(){
        if(!pendingSidebarReset) return;
        pendingSidebarReset = false;
        if(sidebarElForReset) sidebarElForReset.style.width = originalSidebarWidthStyle;
      }
    };
  }

  // ----- 檢視模式 (view mode) -----
  // A lightweight, non-modal way to preview image settings full-screen: it
  // closes the 通用設定 modal and shows a slim bar (title + description)
  // with a dropdown on the right holding the same image settings controls.
  // It stays active until the user navigates elsewhere (switches school /
  // attribute / sidebar tab, or opens any other modal/window), at which
  // point it's automatically torn down — prompting to keep or discard any
  // actual changes first (using the same settingsEqual-based detection as
  // the settings modal), then always proceeding with the navigation.
  let viewModeActive = false;
  let viewModeDraft = null;
  // Handle returned by setupImageSettingsHandlers() for whichever image
  // settings dropdown is currently wired inside view mode — reassigned each
  // time enterViewMode() (re)builds it (including every undo/redo jump).
  // Lives at this scope (not inside enterViewMode) so leaveViewModeThen(),
  // a separate top-level function, can still reach it to commit/revert a
  // pending 重置側邊欄寬度 when view mode is torn down.
  let viewModeImageHandlers = null;

  function enterViewMode(draft, sidebarResetCarry){
    viewModeActive = true;
    viewModeDraft = draft;
    modalBeforeClose = null; // switching into view mode isn't "closing" the modal — nothing to prompt about here
    closeModal();

    // Reassigned every time setupImageSettingsHandlers() (re)wires the
    // dropdown below — including on every undo/redo jump, which rebuilds it
    // from scratch — so saveBtn/leaveViewModeThen below always call through
    // to whichever wiring is currently live rather than a stale one.
    viewModeImageHandlers = null;

    const titleEl = document.getElementById("schoolTitle");
    const subEl = document.getElementById("schoolSub");
    const controlsWrap = document.querySelector(".main-head-controls");
    const viewControlsGroup = document.getElementById("viewControlsGroup");
    const normalControls = document.getElementById("normalControls");
    const outputControls = document.getElementById("outputControls");
    const gridEl = document.getElementById("studentGrid");
    const emptyEl = document.getElementById("emptyState");

    titleEl.textContent = "檢視模式";
    subEl.innerHTML = "正在預覽圖片設定效果，切換至其他頁面或視窗時會自動結束";
    viewControlsGroup.style.display = "none";
    normalControls.style.display = "none";
    outputControls.style.display = "none";
    gridEl.style.display = "none";
    emptyEl.style.display = "none";

    const viewModeGroup = document.createElement("div");
    viewModeGroup.className = "control-group";
    viewModeGroup.id = "viewModeControlsGroup";
    viewModeGroup.innerHTML =
      '<button type="button" class="btn btn-ghost btn-sm" id="viewModeUndoBtn">↶</button>' +
      '<button type="button" class="btn btn-ghost btn-sm" id="viewModeRedoBtn">↷</button>' +
      '<button type="button" class="btn btn-ghost btn-sm" id="viewModeSaveBtn" title="儲存目前的圖片設定，不離開檢視模式">儲存設定</button>' +
      '<button type="button" class="btn btn-ghost btn-sm" id="viewModeExitBtn" title="退出檢視模式，回到目前選擇的學校／屬性">退出檢視</button>' +
      '<button type="button" class="btn btn-sm" id="viewModeAdjustBtn">圖片設定 ▾</button>' +
      '<div class="view-mode-dropdown" id="viewModeDropdown" style="display:none;">' +
        imageSettingsHtml(draft, { showViewModeBtn: false, showBgSlots: true }) +
      '</div>';
    controlsWrap.appendChild(viewModeGroup);

    const undoBtn = viewModeGroup.querySelector("#viewModeUndoBtn");
    const redoBtn = viewModeGroup.querySelector("#viewModeRedoBtn");
    const saveBtn = viewModeGroup.querySelector("#viewModeSaveBtn");
    const exitBtn = viewModeGroup.querySelector("#viewModeExitBtn");
    const adjustBtn = viewModeGroup.querySelector("#viewModeAdjustBtn");
    const dropdown = viewModeGroup.querySelector("#viewModeDropdown");

    // Undo/redo history for this view-mode session only: a plain list of
    // draft snapshots plus a pointer into it. Continuous controls (sliders,
    // the color pickers) fire their "input" event on every tiny movement,
    // so committing a snapshot on every single one of those would turn one
    // drag into dozens of undo steps — instead each change schedules a
    // commit a beat later, and further changes just push that back, so a
    // whole drag collapses into a single undo-able step once the user
    // actually stops moving it.
    let history = [Object.assign({}, draft)];
    let historyIndex = 0;
    let historyCommitTimer = null;

    function refreshUndoRedoButtons(){
      const canUndo = historyIndex > 0;
      const canRedo = historyIndex < history.length - 1;
      undoBtn.disabled = !canUndo;
      redoBtn.disabled = !canRedo;
      undoBtn.title = canUndo ? "復原上一步設定變更" : "已經是最初的設定，沒有可以復原的操作";
      redoBtn.title = canRedo ? "重做上一步已復原的設定" : "已經是最新的設定，沒有可以重做的操作";
    }
    refreshUndoRedoButtons();

    function commitHistorySnapshot(){
      if(historyCommitTimer){ clearTimeout(historyCommitTimer); historyCommitTimer = null; }
      const snap = Object.assign({}, draft);
      if(settingsEqual(snap, history[historyIndex])) return; // nothing actually changed since the last step
      history = history.slice(0, historyIndex + 1);
      history.push(snap);
      historyIndex = history.length - 1;
      refreshUndoRedoButtons();
    }

    function scheduleHistoryCommit(){
      if(historyCommitTimer) clearTimeout(historyCommitTimer);
      historyCommitTimer = setTimeout(commitHistorySnapshot, 500);
    }

    // Rebuilds the dropdown's controls to reflect `draft` after an undo/redo
    // jump (sliders, image previews, etc. all need their displayed values
    // updated, not just the underlying draft object), preserving whether it
    // was open or closed.
    function refreshDropdownFromDraft(){
      const wasOpen = dropdown.style.display !== "none";
      dropdown.innerHTML = imageSettingsHtml(draft, { showViewModeBtn: false, showBgSlots: true });
      const carry = viewModeImageHandlers ? viewModeImageHandlers.getSidebarResetCarry() : null;
      viewModeImageHandlers = setupImageSettingsHandlers(dropdown, draft, onImageSettingChange, { carriedSidebarReset: carry });
      dropdown.style.display = wasOpen ? "block" : "none";
    }

    function jumpToHistory(newIndex){
      historyIndex = newIndex;
      Object.assign(draft, history[historyIndex]);
      applySettings(draft);
      refreshDropdownFromDraft();
      refreshUndoRedoButtons();
    }

    adjustBtn.addEventListener("click", function(){
      const willOpen = dropdown.style.display === "none";
      dropdown.style.display = willOpen ? "block" : "none";
      adjustBtn.classList.toggle("active", willOpen);
    });
    undoBtn.addEventListener("click", function(){
      if(historyIndex <= 0){ showToast("已經是最初的設定，沒有可以復原的操作"); return; }
      jumpToHistory(historyIndex - 1);
    });
    redoBtn.addEventListener("click", function(){
      if(historyIndex >= history.length - 1){ showToast("已經是最新的設定，沒有可以重做的操作"); return; }
      jumpToHistory(historyIndex + 1);
    });
    // Persists the current draft as the real settings without leaving view
    // mode, so it stops being a "pending change" — settingsEqual will then
    // see draft/appSettings as identical, so exiting afterwards (退出檢視 or
    // navigating elsewhere) won't prompt to keep/discard anymore.
    saveBtn.addEventListener("click", function(){
      commitHistorySnapshot();
      const changed = !settingsEqual(viewModeDraft, appSettings) || bgSlotsDirty(appSettings);
      appSettings = Object.assign({}, viewModeDraft);
      saveSettings(appSettings);
      applySettings(appSettings);
      bgSlotsCommitPending();
      if(viewModeImageHandlers) viewModeImageHandlers.commitPendingSidebarReset();
      showToast(changed ? "已儲存圖片設定" : "圖片設定沒有變更");
    });
    // Doesn't navigate anywhere — the "action" is a no-op, so leaveViewModeThen
    // just tears down view mode (with the usual keep/discard prompt if the
    // draft settings actually changed) and lands back on whatever school or
    // attribute is currently selected via its own renderMain() call.
    exitBtn.addEventListener("click", function(){
      if(historyCommitTimer){ clearTimeout(historyCommitTimer); historyCommitTimer = null; }
      leaveViewModeThen(function(){});
    });

    function onImageSettingChange(){
      applySettings(draft);
      scheduleHistoryCommit();
    }
    viewModeImageHandlers = setupImageSettingsHandlers(dropdown, draft, onImageSettingChange, { carriedSidebarReset: sidebarResetCarry || null });
  }

  // Runs `action` (which may navigate to another page/school/attribute or
  // open another modal/window). If view mode is active, it's torn down
  // first: any real change (per settingsEqual — adjusting a value back to
  // its original doesn't count) triggers a keep/discard confirmation, then
  // `action` always runs afterwards regardless of that choice.
  //
  // opts.rendersItself should be true when `action` already ends in its own
  // renderMain() call (selectSchool, selectAttribute, switchSidebarTab,
  // goToAllStudents, toggleOutputMode all do). For those, title/sub/grid/
  // empty-state/viewControlsGroup/normalControls are already correctly set
  // by the time `action` resolves, so we only need to reveal the grid and
  // reconcile outputControls — calling renderMain() a second time here would
  // be redundant, and worse, would make populateGrid() see an unchanged
  // "view key" on that second pass and think it's re-rendering the *same*
  // view, which turns off the cards' entrance animation.
  //
  // opts.carryChanges skips the keep/discard prompt and leaves the previewed
  // changes exactly as they are (still applied, neither saved nor reverted)
  // — used when going back into 通用設定, which takes those changes over as
  // its own unsaved draft and asks about them when it is closed.
  //
  // For actions that DON'T render anything themselves (currently just
  // showModal), we call renderMain() ourselves so the main area behind the
  // modal still reflects the current (unchanged) selection correctly —
  // this is the only case where restoring old snapshot values isn't
  // available and something has to explicitly recompute the state.
  //
  // Either way, the student grid stays hidden until that settles, so
  // switching schools/attributes never flashes the old selection's stale
  // cards before the new ones load in.
  function leaveViewModeThen(action, opts){
    opts = opts || {};
    if(!viewModeActive) return action();
    const draft = viewModeDraft;
    const pendingSidebarReset = !!(viewModeImageHandlers && viewModeImageHandlers.hasPendingSidebarReset());
    const changed = !settingsEqual(draft, appSettings) || pendingSidebarReset || bgSlotsDirty(appSettings);
    if(changed && !opts.carryChanges){
      const keep = window.confirm(buildUnsavedChangesMessage(draft, appSettings, pendingSidebarReset));
      if(keep){
        appSettings = Object.assign({}, draft);
        saveSettings(appSettings);
        applySettings(appSettings);
        bgSlotsCommitPending();
        if(viewModeImageHandlers) viewModeImageHandlers.commitPendingSidebarReset();
      } else {
        applySettings(appSettings);
        if(viewModeImageHandlers) viewModeImageHandlers.revertPendingSidebarReset();
      }
    }
    // 離開檢視模式後，沒被儲存的方案暫存一律丟棄（帶著變更回通用設定時除外）
    if(!opts.carryChanges) bgSlotsDiscardPending();
    viewModeActive = false;
    viewModeDraft = null;
    viewModeImageHandlers = null;
    const grp = document.getElementById("viewModeControlsGroup");
    if(grp) grp.remove();

    function settle(value){
      const gridEl = document.getElementById("studentGrid");
      const outputControls = document.getElementById("outputControls");
      if(gridEl) gridEl.style.display = "";
      // renderMain doesn't manage outputControls (only toggleOutputMode
      // does), so it has to be reconciled against the live outputMode
      // flag directly here.
      if(outputControls) outputControls.style.display = outputMode ? "flex" : "none";
      return value;
    }

    function finish(value){
      if(opts.rendersItself) return settle(value);
      // The grid sat hidden throughout view mode, so even if the selected
      // school/attribute didn't change (e.g. the "退出檢視" shortcut, which
      // navigates nowhere), this render should still be treated as a fresh
      // reveal rather than an "incidental re-render" of the same view —
      // otherwise populateGrid() sees a matching view key and skips the
      // entrance animation on cards that, from the user's perspective, are
      // only just now appearing. Resetting it here forces the replay, same
      // as the other "grid was emptied/hidden in between" cases above.
      lastGridViewKey = null;
      return Promise.resolve(renderMain()).then(function(){ return settle(value); });
    }

    const result = action();
    if(result && typeof result.then === "function"){
      return result.then(finish);
    }
    return finish(result);
  }

  // Two mode-specific descriptions for the 搜尋行為 note (see #autoClearNote
  // below) — each explains what actually happens under that mode, rather
  // than always showing the auto-clear description even while "保留搜尋
  // 內容" is selected.
  const AUTO_CLEAR_ON_NOTE = "從搜尋結果點選學生時，自動清空搜尋欄並跳到該學生的分類。";
  const AUTO_CLEAR_OFF_NOTE = "從搜尋結果點選學生時，保留搜尋欄內容，方便繼續瀏覽同一批搜尋結果中的其他學生。";

  function openSettingsModal(){
    if(viewModeActive){
      // Coming back to 通用設定 from 檢視模式 isn't "leaving" the changes
      // behind: no keep/discard prompt here. They carry over into the
      // reopened window, which asks about them when *it* is closed.
      // (Going anywhere else from 檢視模式 still prompts, see
      // leaveViewModeThen.)
      const carry = {
        draft: viewModeDraft,
        sidebarReset: viewModeImageHandlers ? viewModeImageHandlers.getSidebarResetCarry() : null
      };
      leaveViewModeThen(function(){ return doOpenSettingsModal(carry); }, { carryChanges: true });
      return;
    }
    doOpenSettingsModal();
  }

        '</button>' +

    // Category tabs: each 通用設定 section lives on its own page instead of
    // one long scrolling column, so switching tabs just toggles which
    // .settings-page is shown — every field still exists in the DOM the
    // whole time (just hidden), so all the handlers wired up below work
    // exactly the same regardless of which tab is currently visible.
    (function setupSettingsTabs(){
      const tabs = document.querySelectorAll(".settings-tabs .settings-tab");
      const pages = document.querySelectorAll(".settings-modal-body .settings-page");
      tabs.forEach(function(tab){
        tab.addEventListener("click", function(){
          tabs.forEach(function(t){ t.classList.toggle("active", t === tab); });
          pages.forEach(function(p){ p.style.display = (p.dataset.page === tab.dataset.page) ? "block" : "none"; });
          const modalEl = document.querySelector(".overlay .modal");
          if(modalEl) modalEl.scrollTop = 0;
        });
      });
    })();

    // 緊湊排列: turn "title + toggle buttons (+ note)" blocks into one row. Elements are
    // only moved, never recreated, so ids and click handlers keep working.
    (function compactSettingRows(){
      const body = document.querySelector(".settings-modal-body");
      if(!body) return;
      const isToggle = function(el){ return el.classList.contains("theme-toggle-row"); };
      body.querySelectorAll(".fieldset-title").forEach(function(title){
        if(title.closest(".setting-row")) return;
        const ctl = title.nextElementSibling;
        if(!ctl) return;
        const fieldToggle = ctl.classList.contains("field") && ctl.children.length === 1 && isToggle(ctl.children[0]);
        if(!isToggle(ctl) && !fieldToggle) return;
        // Only short toggles fit on one line; longer button groups (e.g. 邊框樣式) keep wrapping.
        const toggleEl = isToggle(ctl) ? ctl : ctl.children[0];
        if(toggleEl.querySelectorAll("button").length > 3 || toggleEl.classList.contains("sp-frame-row")) return;
        const row = document.createElement("div");
        row.className = "setting-row";
        const left = document.createElement("div");
        left.className = "setting-row-label";
        title.parentNode.insertBefore(row, title);
        left.appendChild(title);
        row.appendChild(left);
        row.appendChild(ctl);
      });

      // 說明 → small "?" next to the name; the text shows on hover / keyboard focus / tap.
      body.querySelectorAll(".variant-group-note").forEach(function(note){
        if(note.children.length) return;
        const text = (note.textContent || "").replace(/\s+/g, " ").trim();
        if(!text) return;
        let prev = note.previousElementSibling;
        let anchor = null;
        if(prev && prev.classList.contains("setting-row")){
          anchor = prev.querySelector(".fieldset-title");
        } else if(prev && prev.classList.contains("field") && prev.firstElementChild && prev.firstElementChild.tagName === "LABEL"){
          anchor = prev.firstElementChild;
        } else {
          while(prev && !anchor){
            if(prev.classList.contains("fieldset-title")) anchor = prev;
            else if(prev.classList.contains("setting-row")) anchor = prev.querySelector(".fieldset-title");
            prev = prev.previousElementSibling;
          }
        }
        if(!anchor) return;
        const help = document.createElement("span");
        help.className = "setting-help";
        help.tabIndex = 0;
        help.setAttribute("role", "note");
        help.setAttribute("aria-label", text);
        help.setAttribute("data-tip", text);
        help.textContent = "?";
        const valEl = anchor.querySelector(".slider-val");
        if(valEl) anchor.insertBefore(help, valEl); else anchor.appendChild(help);
        // Open the tooltip toward whichever side has room, so it never gets cut off.
        const flip = function(){
          const modalEl = help.closest(".modal");
          const limit = modalEl ? modalEl.getBoundingClientRect().right - 12 : window.innerWidth - 12;
          const r = help.getBoundingClientRect();
          help.classList.toggle("tip-left", r.left + 244 > limit);
        };
        help.addEventListener("mouseenter", flip);
        help.addEventListener("focus", flip);
        if(note.id){
          // The text of notes with an id is changed by other code (e.g. 搜尋行為), so keep the
          // element hidden and mirror its text into the tooltip whenever it changes.
          note.style.display = "none";
          new MutationObserver(function(){
            const t = (note.textContent || "").replace(/\s+/g, " ").trim();
            help.setAttribute("data-tip", t);
            help.setAttribute("aria-label", t);
          }).observe(note, { childList: true, characterData: true, subtree: true });
        } else {
          note.remove();
        }
      });
    })();

    // 開關: an on/off pair of buttons becomes one switch. The two original buttons stay in the
    // page (hidden) and the switch just clicks them, so saving and change tracking are untouched.
    (function convertOnOffToSwitches(){
      [
        ["st_autoClearOn", "st_autoClearOff"],
        ["st_modalTextBoostOn", "st_modalTextBoostOff"],
        ["st_motionOn", "st_motionOff"],
      ].concat(MOTION_ITEMS.map(function(it){ return ["st_mo_" + it.id + "On", "st_mo_" + it.id + "Off"]; })).concat([
        ["st_titleIconBlackBgOn", "st_titleIconBlackBgOff"],
        ["st_attrPosterGlowOn", "st_attrPosterGlowOff"],
        ["st_catBlackBgOn", "st_catBlackBgOff"],
        ["st_nameMoreHiddenOn", "st_nameMoreHiddenOff"],
        ["st_eyeCareOn", "st_eyeCareOff"],
        ["st_eyeCareLockOn", "st_eyeCareLockOff"],
        ["st_avUpWebpOn", "st_avUpWebpOff"],
        ["st_syncCheckOn", "st_syncCheckOff"],
        ["st_ovHideGroupOn", "st_ovHideGroupOff"],
        ["st_ovHideAttrOn", "st_ovHideAttrOff"]
      ]).forEach(function(pair){
        const onBtn = document.getElementById(pair[0]);
        const offBtn = document.getElementById(pair[1]);
        if(!onBtn || !offBtn || onBtn.parentElement !== offBtn.parentElement) return;
        const toggle = onBtn.parentElement;
        const sw = document.createElement("button");
        sw.type = "button";
        sw.className = "setting-switch";
        sw.setAttribute("role", "switch");
        const sync = function(){
          const on = onBtn.classList.contains("active");
          sw.classList.toggle("on", on);
          sw.setAttribute("aria-checked", on ? "true" : "false");
        };
        sw.addEventListener("click", function(){
          (onBtn.classList.contains("active") ? offBtn : onBtn).click();
          sync();
        });
        const obs = new MutationObserver(sync);
        obs.observe(onBtn, { attributes: true, attributeFilter: ["class"] });
        obs.observe(offBtn, { attributes: true, attributeFilter: ["class"] });
        sync();
        const row = toggle.closest(".setting-row");
        const holder = toggle.parentElement;
        if(row){
          row.appendChild(sw);
        } else if(holder && holder.classList.contains("field")){
          holder.classList.add("has-switch");
          holder.appendChild(sw);
        } else {
          toggle.insertAdjacentElement("afterend", sw);
        }
        toggle.style.display = "none";
        const lab = (holder && holder.querySelector("label")) || (row && row.querySelector(".fieldset-title"));
        if(lab) sw.setAttribute("aria-label", (lab.textContent || "").replace("?", "").trim());
      });
    })();

    // 搜尋設定: type to list matching settings; clicking one jumps to its tab and highlights it.
    (function setupSettingsSearch(){
      const input = document.getElementById("settingsSearch");
      const results = document.getElementById("settingsSearchResults");
      const body = document.querySelector(".settings-modal-body");
      const tabsEl = document.querySelector(".settings-tabs");
      const wrap = document.getElementById("settingsSearchWrap");
      const openBtn = document.getElementById("settingsSearchBtn");
      const closeBtn = document.getElementById("settingsSearchClose");
      if(!input || !results || !body || !wrap || !openBtn) return;
      const pageNames = {};
      document.querySelectorAll(".settings-tabs .settings-tab").forEach(function(t){ pageNames[t.dataset.page] = t.textContent; });
      function collect(){
        const list = [];
        const seen = {};
        body.querySelectorAll(".fieldset-title, .field > label, .field-label").forEach(function(el){
          const clone = el.cloneNode(true);
          clone.querySelectorAll(".setting-help").forEach(function(h){ h.remove(); });
          const text = (clone.textContent || "").replace(/\s+/g, " ").trim();
          const pageEl = el.closest(".settings-page");
          if(!text || !pageEl) return;
          const key = pageEl.dataset.page + "|" + text;
          if(seen[key]) return;
          seen[key] = true;
          list.push({ text: text, page: pageEl.dataset.page, el: el });
        });
        return list;
      }
      function showBrowse(){
        results.style.display = "none";
        body.style.display = "";
        if(tabsEl) tabsEl.style.display = "";
      }
      function openSearch(){
        wrap.style.display = "flex";
        openBtn.setAttribute("aria-expanded", "true");
        input.focus();
      }
      function closeSearch(){
        input.value = "";
        showBrowse();
        wrap.style.display = "none";
        openBtn.setAttribute("aria-expanded", "false");
      }
      openBtn.addEventListener("click", function(){
        if(wrap.style.display === "none") openSearch(); else closeSearch();
      });
      if(closeBtn) closeBtn.addEventListener("click", closeSearch);
      input.addEventListener("input", function(){
        const q = input.value.trim().toLowerCase();
        if(!q){ showBrowse(); return; }
        const hits = collect().filter(function(it){ return it.text.toLowerCase().indexOf(q) !== -1; }).slice(0, 30);
        body.style.display = "none";
        if(tabsEl) tabsEl.style.display = "none";
        results.style.display = "flex";
        results.innerHTML = "";
        if(!hits.length){
          const empty = document.createElement("div");
          empty.className = "settings-search-empty";
          empty.textContent = "找不到符合的設定";
          results.appendChild(empty);
          return;
        }
        hits.forEach(function(it){
          const b = document.createElement("button");
          b.type = "button";
          b.className = "settings-search-item";
          const label = document.createElement("span");
          label.textContent = it.text;
          const pg = document.createElement("span");
          pg.className = "page";
          pg.textContent = pageNames[it.page] || "";
          b.appendChild(label); b.appendChild(pg);
          b.addEventListener("click", function(){
            closeSearch();
            const tab = document.querySelector('.settings-tabs .settings-tab[data-page="' + it.page + '"]');
            if(tab) tab.click();
            const target = it.el.closest(".setting-row") || it.el;
            target.scrollIntoView({ block: "center", behavior: motionOn("scroll") ? "smooth" : "auto" });
            target.classList.remove("setting-flash");
            void target.offsetWidth;
            target.classList.add("setting-flash");
          });
          results.appendChild(b);
        });
      });
      input.addEventListener("keydown", function(e){
        if(e.key === "Escape"){ e.stopPropagation(); closeSearch(); }
      });
    })();

    // 輸出模式 sub-tabs: same idea as the top-level tabs — every field stays in the DOM,
    // only the visible sub-page changes, so the handlers below don't care which is showing.
    (function setupOutputSubtabs(){
      const subtabs = document.querySelectorAll(".output-subtabs .output-subtab");
      const subpages = document.querySelectorAll(".output-subpage");
      subtabs.forEach(function(tab){
        tab.addEventListener("click", function(){
          subtabs.forEach(function(t){ t.classList.toggle("active", t === tab); });
          subpages.forEach(function(p){ p.style.display = (p.dataset.osub === tab.dataset.osub) ? "block" : "none"; });
        });
      });
    })();

    (async function refreshStorageUsage(){
      const barEl = document.getElementById("storageBarFill");
      const textEl = document.getElementById("storageUsageText");
      if(!barEl || !textEl) return;
      try{
        let localBytes = 0;
        for(let i = 0; i < localStorage.length; i++){
          const k = localStorage.key(i);
          localBytes += (k.length + (localStorage.getItem(k) || "").length) * 2;
        }
        const localMB = (localBytes / 1024 / 1024).toFixed(2);
        if(navigator.storage && navigator.storage.estimate){
          const est = await navigator.storage.estimate();
          const usageBytes = est.usage || 0;
          const usageMB = (usageBytes / 1024 / 1024).toFixed(2);
          const quotaMB = est.quota ? Math.round(est.quota / 1024 / 1024) : null;
          const pct = est.quota ? Math.min(100, (usageBytes / est.quota) * 100) : 0;
          barEl.style.width = pct + "%";
          barEl.classList.toggle("storage-bar-warn", pct >= 70);
          textEl.innerHTML =
            '總用量（含角色資料庫）：<b>' + usageMB + ' MB</b>' +
            (quotaMB ? '　／　瀏覽器配額約 <b>' + quotaMB.toLocaleString() + ' MB</b>　(<b>' + pct.toFixed(1) + '%</b>)' : '') +

    (function setupCloudSync(){
      const cfg = syncLoadCfg();
      const elRepo = document.getElementById("st_syncRepo");
      const elToken = document.getElementById("st_syncToken");
      const elDevice = document.getElementById("st_syncDevice");
      const elStatus = document.getElementById("syncStatus");
      const btnIds = ["btnSyncTest", "btnSyncPush", "btnSyncPull", "btnSyncClear"];
      elRepo.value = cfg.repo; elToken.value = cfg.token; elDevice.value = cfg.device;
      elDevice.placeholder = "例如：" + syncDefaultDevice();
      elStatus.textContent = syncStatusIdle(cfg);
      function readInputs(){
        cfg.repo = elRepo.value.trim();
        cfg.token = elToken.value.trim();
        cfg.device = elDevice.value.trim();
        syncSaveCfg(cfg);
      }
      [elRepo, elToken, elDevice].forEach(function(el){ el.addEventListener("input", readInputs); });
      // 換了 repo 之後，舊的「上次同步版本」就不適用了
      elRepo.addEventListener("change", function(){ cfg.lastSha = null; cfg.lastSyncAt = null; syncSaveCfg(cfg); elStatus.textContent = syncStatusIdle(cfg); });
      function refreshCheckToggle(){
        document.getElementById("st_syncCheckOff").classList.toggle("active", cfg.checkOnOpen === false);
        document.getElementById("st_syncCheckOn").classList.toggle("active", cfg.checkOnOpen !== false);
      }
      refreshCheckToggle();
      document.getElementById("st_syncCheckOff").addEventListener("click", function(){
        cfg.checkOnOpen = false; syncSaveCfg(cfg); refreshCheckToggle(); syncHideHint();
      });
      document.getElementById("st_syncCheckOn").addEventListener("click", function(){
        cfg.checkOnOpen = true; syncSaveCfg(cfg); refreshCheckToggle(); syncCheckRemote(true);
      });
      const BK_BTNS = { never: "st_syncBkNever", same: "st_syncBkSame", edit: "st_syncBkEdit", always: "st_syncBkAlways" };
      function refreshBackupToggle(){
        const saved = cfg.pullBackup === "numeric" ? "edit" : cfg.pullBackup;   // 舊版的「僅數值」選項視同新的「僅學生資料」
        const cur = BK_BTNS[saved] ? saved : "always";
        Object.keys(BK_BTNS).forEach(function(k){ document.getElementById(BK_BTNS[k]).classList.toggle("active", k === cur); });
      }
      refreshBackupToggle();
      Object.keys(BK_BTNS).forEach(function(k){
        document.getElementById(BK_BTNS[k]).addEventListener("click", function(){
          cfg.pullBackup = k; syncSaveCfg(cfg); refreshBackupToggle();
        });
      });
      async function run(fn){
        // 背景檢查還沒結束時稍等一下（通常不到一秒），不要把使用者的點擊吞掉
        for(let i = 0; i < 50 && syncOpBusy; i++) await new Promise(function(r){ setTimeout(r, 100); });
        if(syncOpBusy) return;
        readInputs();
        syncOpBusy = true;
        btnIds.forEach(function(id){ document.getElementById(id).disabled = true; });
        const say = function(t){ elStatus.textContent = t; };
        try{ await fn(cfg, say); }
        catch(err){ say("❌ " + ((err && err.message) || err)); }
        syncOpBusy = false;
        btnIds.forEach(function(id){ document.getElementById(id).disabled = false; });
        syncRefreshHintAfterOp();
      }
      // 「連線測試」與在欄位按 Enter 都走表單送出，這樣密碼管理員才有機會判斷成登入而詢問是否儲存
      const loginForm = document.getElementById("syncLoginForm");
      loginForm.addEventListener("submit", function(ev){ ev.preventDefault(); run(syncTest); });
      document.getElementById("btnSyncTest").addEventListener("click", function(){
        if(loginForm.requestSubmit) loginForm.requestSubmit(); else run(syncTest);
      });
      document.getElementById("st_syncShowToken").addEventListener("change", function(){
        elToken.type = this.checked ? "text" : "password";
      });
      document.getElementById("btnSyncPush").addEventListener("click", function(){ run(syncPush); });
      document.getElementById("btnSyncPull").addEventListener("click", function(){ run(syncPull); });
      document.getElementById("btnSyncClear").addEventListener("click", function(){
        if(!window.confirm("要清除這台裝置上的雲端連線資料（repo、token、裝置名稱、同步記錄）嗎？\n\n學生資料與雲端的備份都不會被刪除。")) return;
        localStorage.removeItem(SYNC_KEY);
        const fresh = syncLoadCfg();
        Object.keys(cfg).forEach(function(k){ cfg[k] = fresh[k]; });
        elRepo.value = ""; elToken.value = ""; elDevice.value = "";
        elStatus.textContent = "已清除連線資料。";
        syncHideHint(); refreshCheckToggle();
      });
    })();

    // 一次把資料庫裡已存的 PNG／JPEG 卡片圖片轉成 WebP（只在變小時才替換）
    document.getElementById("btnAvatarToWebp").addEventListener("click", async function(){
      const btn = this;
      const note = document.getElementById("avatarToWebpStatus");
      const say = function(t){ note.style.display = ""; note.textContent = t; };
      if(!window.confirm("要把現有的 PNG／JPEG 卡片圖片轉換成 WebP 嗎？\n\n• 保留透明背景，只替換轉換後比較小的卡片圖片\n• WebP 是有損壓縮，轉換後無法還原成原圖\n• 會立即寫入資料庫，不需要按「儲存」\n\n建議先匯出備份。")) return;
      btn.disabled = true;
      try{
        const all = await getAllStudents();
        const targets = all.filter(function(st){ return typeof st.avatar === "string" && /^data:image\/(png|jpeg);/.test(st.avatar); });
        let converted = 0, skipped = 0, savedBytes = 0;
        for(let i = 0; i < targets.length; i++){
          say("轉換中… " + (i + 1) + " / " + targets.length);
          const st = targets[i];
          try{
            const img = await new Promise(function(res, rej){
              const im = new Image(); im.onload = function(){ res(im); }; im.onerror = rej; im.src = st.avatar;
            });
            const c = document.createElement("canvas");
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            c.getContext("2d").drawImage(img, 0, 0);
            const webp = c.toDataURL("image/webp", 0.9);
            if(!/^data:image\/webp/.test(webp)){ say("此瀏覽器不支援輸出 WebP，無法轉換。"); btn.disabled = false; return; }
            if(webp.length < st.avatar.length){
              savedBytes += st.avatar.length - webp.length;
              st.avatar = webp;
              await putStudent(st);
              converted++;
            } else { skipped++; }
          } catch(_){ skipped++; }
        }
        say("完成：已轉換 " + converted + " 張，略過 " + skipped + " 張（轉換後沒有比較小或無法讀取）；共節省約 " + (savedBytes / 1024).toFixed(0) + " KB。");
        if(converted) renderMain();
      } catch(err){
        say("轉換失敗：" + ((err && err.message) || err));
      }
      btn.disabled = false;
    });

      markDirty();
      applySettings(draft);
    }, {
      onEnterViewMode: function(){ enterViewMode(draft, imageHandlers.getSidebarResetCarry()); },
      carriedSidebarReset: carry ? carry.sidebarReset : null
    });

    function doSave(){
      appSettings = Object.assign({}, draft);
      saveSettings(appSettings);
      applySettings(appSettings);
      bgSlotsCommitPending();
      imageHandlers.commitPendingSidebarReset();
      renderMain();
    }

    document.getElementById("btnSettingsSave").addEventListener("click", function(){
      doSave();
      closeModal();
    });

    modalBeforeClose = function(){
      if(settingsEqual(draft, appSettings) && !imageHandlers.hasPendingSidebarReset() && !bgSlotsDirty(appSettings)){
        bgSlotsDiscardPending();
        return true;

      const wantsSave = window.confirm(buildUnsavedChangesMessage(draft, appSettings, imageHandlers.hasPendingSidebarReset()));

  function starLabelText(value){
    if(value <= 0) return "無";
    if(value <= 5) return value + "星";
    return "專" + (value - 5);
  }

  function starWidgetHtml(id, value){
    let stars = "";
    for(let i=1;i<=9;i++){
      const filled = i <= value;
      const colorClass = i <= 5 ? "gold" : "blue";
      stars += '<button type="button" class="star ' + (filled ? "filled "+colorClass : "") + '" data-i="' + i + '">&#9733;</button>';
    }
    return '<div class="field">' +
      '<label>星級</label>' +
      '<div class="star-widget" id="' + id + '" data-value="' + value + '">' + stars + '</div>' +
      '<div class="star-widget-label" id="' + id + '_label">' + starLabelText(value) + '</div>' +
    '</div>';
  }

  // The star widget is a single shared track: the first 5 (gold) pips are
  // the character's own star rating (1-5), and the last 4 (blue) pips are
  // the exclusive weapon's refinement (專1-專4), only reachable once the
  // character is already at 5 gold stars. So "character star" for the
  // purpose of skill visibility is just the gold-star portion of this value.
  function deriveCharStar(weaponStar){
    if(!weaponStar || weaponStar <= 0) return 0;
    return Math.min(weaponStar, 5);
  }

  // 1-star characters have neither Enhance (强化) nor Sub (輔助) skill.
  // 2-star characters have Enhance but no Sub. The slider itself always stays
  // 1-10 (1 is the lowest a *visible* skill can show); 0 is only the value we
  // save for a skill that isn't shown at all (handled at save time, not here).
  // Note: a range input silently clamps any value below its min up to that
  // min, so reading enhInput.value back can never actually be < 1 even when
  // the field is still hidden — checking that would miss the transition.
  // We instead check whether the field *was* hidden a moment ago.
  function updateSkillVisibility(charStar){
    const hideEnh = charStar <= 1;
    const hideSub = charStar <= 2;
    const enhWrap = document.getElementById("field_f_skillEnh");
    const enhInput = document.getElementById("f_skillEnh");
    const enhVal = document.getElementById("f_skillEnh_val");
    const enhWasHidden = enhWrap && enhWrap.style.display === "none";
    if(enhWrap) enhWrap.style.display = hideEnh ? "none" : "";
    if(!hideEnh && enhWasHidden && enhInput){
      enhInput.value = 1; if(enhVal) enhVal.textContent = "1";
    }
    const subWrap = document.getElementById("field_f_skillSub");
    const subInput = document.getElementById("f_skillSub");
    const subVal = document.getElementById("f_skillSub_val");
    const subWasHidden = subWrap && subWrap.style.display === "none";
    if(subWrap) subWrap.style.display = hideSub ? "none" : "";
    if(!hideSub && subWasHidden && subInput){
      subInput.value = 1; if(subVal) subVal.textContent = "1";
    }
  }

  function bindStarWidget(containerId, onChange){
    const container = document.getElementById(containerId);
    const label = document.getElementById(containerId + "_label");
    function setStar(next){
      next = Math.max(1, next);   // 角色至少有 1 顆星，不能取消到 0
      container.setAttribute("data-value", next);
      container.querySelectorAll(".star").forEach(function(s){
        const si = parseInt(s.getAttribute("data-i"), 10);

      if(onChange) onChange(next);

      btn.addEventListener("click", function(){
        const i = parseInt(btn.getAttribute("data-i"), 10);
        const current = parseInt(container.getAttribute("data-value"), 10);
        setStar((current === i) ? i - 1 : i);
      });

  function computeWeaponLevelMax(weaponStar){
    const blueStars = Math.max(0, Math.min(4, weaponStar - 5));
    const table = [20, 30, 40, 50, 60];
    return table[blueStars];
  }

  function computeAffinityMax(weaponStar){
    if(weaponStar >= 5) return 100;
    if(weaponStar === 4) return 30;
    if(weaponStar === 3) return 20;
    return 10;
  }

  // Works out how full the affinity heart icon should look, according to
  // whichever of the four affinityFillMode styles is active (see the
  // definitions next to affinityFillMode's declaration above). Returns
  // both the fill percentage (0-100) and whether the value has reached the
  // character's real max — the latter only matters for mode "4", where the
  // fill is always drawn against a flat 100 and so needs a separate signal
  // to show a low-max character has actually maxed out despite the heart
  // looking far from full.
  function computeAffinityFill(value, max, mode){
    const v = Math.max(0, value || 0);
    const m = max > 0 ? max : 0;
    const linearPct = m > 0 ? Math.min(100, (v / m) * 100) : 0;
    const isCapped = m > 0 && v >= m;
    switch(mode){
      case "1":
        return { pct: linearPct, capped: isCapped };
      case "2":
        if(m === 100) return { pct: Math.min(100, (v / 50) * 100), capped: isCapped };
        return { pct: linearPct, capped: isCapped };
      case "4":
        return { pct: Math.min(100, v), capped: isCapped };
      case "3":
      default:
        if(m === 100){
          if(v <= 50) return { pct: Math.min(75, (v / 50) * 75), capped: isCapped };
          return { pct: Math.min(100, 75 + ((v - 50) / 50) * 25), capped: isCapped };
        }
        return { pct: linearPct, capped: isCapped };
    }
  }

  // Renders a small heart icon that's filled bottom-to-top by `pct` (0-100)
  // — e.g. 50% affinity draws a heart that's half solid pink (from the
  // bottom up), half white — rather than the flat "&#9829;" glyph used
  // elsewhere. Built from two stacked copies of the same heart path (a
  // plain white one underneath, a pink one on top clipped to the bottom
  // `pct`% of the heart's height) so the fill amount is pixel-precise
  // regardless of font/platform, unlike trying to gradient-clip the text
  // glyph itself.
  let heartSvgIdCounter = 0;
  const AFFINITY_HEART_PATH = "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z";
  function affinityHeartSvg(pct, opts){
    opts = opts || {};
    const size = opts.size || 13;
    const clampPct = Math.max(0, Math.min(100, pct || 0));
    // clip-path ids are global to the document, so every heart drawn needs
    // its own unique id — otherwise every card's clip rect would resolve to
    // whichever heart defined that id first, and they'd all show the same
    // fill amount.
    const clipId = "affinityHeartClip" + (heartSvgIdCounter++);
    const fillHeight = (24 * clampPct / 100).toFixed(2);
    const fillY = (24 - fillHeight).toFixed(2);
    return '<svg class="affinity-heart-svg" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="' + AFFINITY_HEART_PATH + '" fill="#fff" fill-opacity="0.85"></path>' +
      '<defs><clipPath id="' + clipId + '"><rect x="0" y="' + fillY + '" width="24" height="' + fillHeight + '"></rect></clipPath></defs>' +
      '<path d="' + AFFINITY_HEART_PATH + '" fill="var(--affinity)" clip-path="url(#' + clipId + ')"></path>' +
    '</svg>';
  }

  // Same bottom-to-top fill trick as affinityHeartSvg (a plain white base
  // shape plus a var(--affinity)-colored copy clipped to the bottom `pct`%
  // of its height), applied to the heart body only — drawn as a heart-
  // shaped padlock instead of a plain heart. The heart body is the same
  // AFFINITY_HEART_PATH scaled down slightly and shifted down so it (plus
  // a shackle ring above it) fits the exact same 24x24 box as a plain
  // heart — so both icons render at identical on-card size. The ring
  // itself is a fixed light-gray "metal" color (AFFINITY_LOCK_RING_COLOR)
  // that doesn't participate in the pct fill at all — only the heart body
  // shows affinity progress, which reads more like an actual metal
  // shackle attached to a colored lock body than a ring that changes
  // color with the rest of the icon. The ring's legs deliberately run a
  // little way down into the heart body (like a real shackle inserting
  // into a lock), so ring and heart do overlap there — but the heart's
  // own base/overlay opacity is applied at the GROUP level rather than on
  // each shape individually, so that overlap doesn't double up into a
  // visible seam. The keyhole is punched out via an SVG mask rather than
  // drawn as a solid dark shape, so it always shows whatever is actually
  // behind the icon instead of a hardcoded color. Used in place of
  // affinityHeartSvg once an affinity fill mode actually caps out.
  const AFFINITY_LOCK_RING_PATH = "M6.15,8 L6.15,6.8 A5.85,5.85 0 0 1 17.85,6.8 L17.85,8 L14.25,8 L14.25,6.8 A2.25,2.25 0 0 0 9.75,6.8 L9.75,8 Z";
  const AFFINITY_LOCK_HEART_TRANSFORM = "translate(1.21,4.802) scale(0.8992)"; // maps the heart's own y=3..21.35 span onto y=7.5..24
  const AFFINITY_LOCK_TOP_Y = 0.95;  // top of the ring's outer arc
  const AFFINITY_LOCK_BOTTOM_Y = 24; // bottom tip of the heart
  const AFFINITY_LOCK_KEYHOLE_SVG = '<circle cx="12" cy="14" r="1.9" fill="#000"></circle><path d="M10.9,14.9 L13.1,14.9 L13.9,19 L10.1,19 Z" fill="#000"></path>';
  const AFFINITY_LOCK_RING_COLOR = "#B9BCC2"; // fixed light-gray "metal" ring; only the heart body fills with affinity progress
  function affinityLockHeartSvg(pct, opts){
    opts = opts || {};
    const size = opts.size || 13;
    const clampPct = Math.max(0, Math.min(100, pct || 0));
    const uid = heartSvgIdCounter++;
    const maskId = "affinityLockMask" + uid;
    const clipId = "affinityLockClip" + uid;
    const totalHeight = AFFINITY_LOCK_BOTTOM_Y - AFFINITY_LOCK_TOP_Y;
    const fillHeight = (totalHeight * clampPct / 100);
    const fillY = (AFFINITY_LOCK_BOTTOM_Y - fillHeight).toFixed(2);

      '</defs>' +
      '<g mask="url(#' + maskId + ')">' +
        '<path d="' + AFFINITY_LOCK_RING_PATH + '" fill="' + AFFINITY_LOCK_RING_COLOR + '"></path>' +

  function computeGearBondMax(affinity){
    if(affinity >= 20) return 2;
    if(affinity >= 15) return 1;

    if(parseInt(slider.value, 10) < 1) slider.value = 1;

    updateGearBondCap();

  const GEAR_SLOT_UNLOCK = [["f_gearAtk", 1], ["f_gearSurv", 10], ["f_gearPend", 20]];
  // 未解鎖的欄位只隱藏，不會歸零；數值保留，等級調回去就會原樣出現。

  // 拖動滑桿（進度條）時鎖住視窗大小：拖動途中欄位可能顯示／隱藏（例如專武星級到 6 星、
  // 好感度到 15／20 級），視窗高度一變就會重新置中，滑桿會從滑鼠下跑掉。
  // 按下時先把視窗固定在目前的大小，放開後才恢復自動大小。
  // 編輯區的上拉／下拉：與技能優先級視窗的設定面板同款（高度＋淡入淡出，260ms），
  // 同樣受 外觀設定 › 動畫效果 › 設定面板 控制。
  function seSlidePanel(panel, opening, onDone){
    if(!panel || !panel.animate || !motionOn("panel")){ if(onDone) onDone(); return; }
    if(panel._seAnim){ panel._seAnim.cancel(); panel._seAnim = null; }
    const cs = getComputedStyle(panel);
    const full = { height: panel.offsetHeight + "px", paddingTop: cs.paddingTop, paddingBottom: cs.paddingBottom,
      marginTop: cs.marginTop, marginBottom: cs.marginBottom, borderTopWidth: cs.borderTopWidth, borderBottomWidth: cs.borderBottomWidth, opacity: 1 };
    const none = { height: "0px", paddingTop: "0px", paddingBottom: "0px", marginTop: "0px", marginBottom: "0px",
      borderTopWidth: "0px", borderBottomWidth: "0px", opacity: 0 };
    const prevOverflow = panel.style.overflow;
    panel.style.overflow = "hidden";
    const anim = panel.animate(opening ? [none, full] : [full, none], { duration: 260, easing: "ease-out" });
    panel._seAnim = anim;
    anim.onfinish = function(){ panel.style.overflow = prevOverflow; panel._seAnim = null; if(onDone) onDone(); };
    anim.oncancel = function(){ panel.style.overflow = prevOverflow; };
  }
  function seSlideResize(panel, fromH){
    if(!panel || !panel.animate || !motionOn("panel")) return;
    const toH = panel.offsetHeight;
    if(Math.abs(toH - fromH) < 2) return;
    if(panel._seAnim){ panel._seAnim.cancel(); panel._seAnim = null; }
    const prevOverflow = panel.style.overflow;
    panel.style.overflow = "hidden";
    const anim = panel.animate([{ height: fromH + "px" }, { height: toH + "px" }], { duration: 260, easing: "ease-out" });
    panel._seAnim = anim;
    anim.onfinish = function(){ panel.style.overflow = prevOverflow; panel._seAnim = null; };
    anim.oncancel = function(){ panel.style.overflow = prevOverflow; };
  }

  let lockedModalEl = null;
  function lockModalSize(modal){
    unlockModalSize();
    if(!modal) return;
    const r = modal.getBoundingClientRect();
    const cs = getComputedStyle(modal);
    let w = r.width, h = r.height;
    if(cs.boxSizing !== "border-box"){
      w -= parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
      h -= parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
    }
    modal.style.width = w + "px";
    modal.style.height = h + "px";
    lockedModalEl = modal;
  }
  function unlockModalSize(){
    if(!lockedModalEl) return;
    lockedModalEl.style.height = "";
    lockedModalEl.style.width = "";
    lockedModalEl = null;
  }
  document.addEventListener("pointerdown", function(e){
    const t = e.target;
    if(!t || !t.closest || t.type !== "range") return;
    lockModalSize(t.closest(".modal"));
  }, true);
  ["pointerup", "pointercancel", "blur"].forEach(function(evt){
    window.addEventListener(evt, unlockModalSize, true);
  });

  // asWebp：只有角色卡片圖片會傳 true（標題圖示等其他呼叫端維持原本的 PNG／JPEG）。
  // WebP 保留透明又比 PNG 小；瀏覽器不支援輸出 WebP（例如 Safari）時會自動退回原本的做法。
  function resizeImageFile(file, asWebp){
    return new Promise(function(resolve, reject){
      const reader = new FileReader();
      reader.onload = function(e){
        const img = new Image();
        img.onload = function(){
          const size = 320;
          const canvas = document.createElement("canvas");
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext("2d");
          const scale = Math.max(size / img.width, size / img.height);
          const w = img.width * scale, h = img.height * scale;
          const x = (size - w) / 2, y = (size - h) / 2;
          ctx.drawImage(img, x, y, w, h);
          const isTransparent = file.type === "image/png" || file.type === "image/gif" || file.type === "image/webp";
          if(asWebp){
            const webp = canvas.toDataURL("image/webp", 0.9);
            if(/^data:image\/webp/.test(webp)){ resolve(webp); return; }
          }
          resolve(isTransparent ? canvas.toDataURL("image/png") : canvas.toDataURL("image/jpeg", 0.85));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function setupAvatarUpload(initialAvatar){
    currentAvatarData = initialAvatar || null;
    const box = document.getElementById("avatarUpload");
    const preview = document.getElementById("avatarPreview");
    const placeholder = document.getElementById("avatarPlaceholder");
    const fileInput = document.getElementById("avatarFileInput");
    const removeBtn = document.getElementById("removeAvatarBtn");
    const undoBtn = document.getElementById("undoAvatarBtn");
    let removedAvatarData = null;   // 剛被移除的卡片圖片，可用「復原」放回來

    function refresh(){
      if(currentAvatarData) removedAvatarData = null;   // 已經有卡片圖片（換了新圖或已復原）就不再需要
      if(undoBtn) undoBtn.style.display = (!currentAvatarData && removedAvatarData) ? "" : "none";
      if(currentAvatarData){
        preview.src = currentAvatarData;
        preview.style.display = "block";
        placeholder.style.display = "none";
      } else {
        preview.style.display = "none";
        placeholder.style.display = "flex";
      }
      if(removeBtn) removeBtn.style.display = currentAvatarData ? "" : "none";
    }
    refresh();

    box.addEventListener("click", function(){ fileInput.click(); });
    // 手機沒有 Ctrl+V：提供明確的「選擇圖片」與「貼上」按鈕
    const pickBtn = document.getElementById("avatarPickBtn");
    const pasteBtn = document.getElementById("avatarPasteBtn");
    if(pickBtn) pickBtn.addEventListener("click", function(){ fileInput.click(); });
    if(pasteBtn){
      if(!(navigator.clipboard && navigator.clipboard.read)){ pasteBtn.hidden = true; }
      pasteBtn.addEventListener("click", async function(){
        try{
          const items = await navigator.clipboard.read();
          for(const it of items){
            const type = it.types.find(function(t){ return t.indexOf("image/") === 0; });
            if(type){
              const blob = await it.getType(type);
              currentAvatarData = await resizeImageFile(blob, appSettings.avatarUploadWebp !== false);
              refresh();
              box.dispatchEvent(new Event("change", { bubbles: true }));
              return;
            }
          }
          showToast("剪貼簿裡沒有圖片");
        } catch(err){
          showToast("無法讀取剪貼簿，請改用「選擇圖片」");
        }
      });
    }
    fileInput.addEventListener("change", async function(e){
      const file = e.target.files[0];
      if(!file) return;
      try{
        currentAvatarData = await resizeImageFile(file, appSettings.avatarUploadWebp !== false);
      } catch(err){
        showToast("這張圖片無法讀取，請換一張");
        e.target.value = "";
        return;
      }
      refresh();
      box.dispatchEvent(new Event("change", { bubbles: true }));   // 解碼完成後再觸發自動儲存
      e.target.value = "";
    });
    // Paste works anywhere while this window is open (no need to focus the box first).
    async function onDocPaste(e){
      if(!box.isConnected){ document.removeEventListener("paste", onDocPaste); return; }
      const items = e.clipboardData && e.clipboardData.items;
      if(!items) return;
      for(const item of items){
        if(item.type && item.type.indexOf("image/") === 0){
          e.preventDefault();
          currentAvatarData = await resizeImageFile(item.getAsFile(), appSettings.avatarUploadWebp !== false);
          refresh();
          box.dispatchEvent(new Event("change", { bubbles: true }));
          break;
        }
      }
    }
    document.addEventListener("paste", onDocPaste);
    removeBtn.addEventListener("click", function(e){
      e.stopPropagation();
      removedAvatarData = currentAvatarData;
      currentAvatarData = null;
      refresh();
      box.dispatchEvent(new Event("change", { bubbles: true }));   // 讓自動儲存與「還原」按鈕狀態跟上
    });
    if(undoBtn) undoBtn.addEventListener("click", function(e){
      e.stopPropagation();
      if(!removedAvatarData) return;
      currentAvatarData = removedAvatarData;
      refresh();
      box.dispatchEvent(new Event("change", { bubbles: true }));
    });
  }

  async function openStudentModal(student, navOpts){
    const isNew = !student;
    const isNavSwap = !!(navOpts && navOpts.navTransition);
    const initialEditTab = "attrArmor";   // 分頁列本身已隱藏，初始化後由總覽接管（seHidePages）
    const st = student ? Object.assign({}, student) : {
      id: uid(), schoolId: currentSchoolId, name:"", avatar:null, level:1,
      gearAtk:0, gearSurv:0, gearPend:0, gearBond:0,
      skillEx:1, skillN:1, skillEnh:1, skillSub:1,
      weaponStar:1, weaponLevel:0,
      release1:0, release2:0, release3:0,
      affinity:1, variantGroupId:null, attribute:null, armor:null
    };
    st.affinity = Math.max(1, st.affinity || 1);
    st.weaponStar = Math.max(1, st.weaponStar || 0);   // 角色至少有 1 顆星
    const initialCharStar = deriveCharStar(st.weaponStar);
    if(initialCharStar <= 1) st.skillEnh = 0;
    else if(!st.skillEnh) st.skillEnh = 1;
    if(initialCharStar <= 2) st.skillSub = 0;
    else if(!st.skillSub) st.skillSub = 1;
    const modalSchoolId = isNew ? currentSchoolId : st.schoolId;
    let isBorrowedMode = !!st.borrowed;

    // 上一位/下一位 navigation: based on whichever grid view (school/attribute/
    // all students/search/撤銷模式) was on screen when this modal was opened.
    // Only offered for an existing student that's actually part of that list —
    // a brand-new student, or one opened from somewhere the list doesn't
    // cover, simply gets no arrows.
    let navPrevStudent = null, navNextStudent = null;
    if(!isNew){
      const gridIdx = currentGridStudents.findIndex(function(s){ return s.id === st.id; });
      if(gridIdx !== -1){
        // 循環切換：第一位的上一位是最後一位，最後一位的下一位是第一位（只有一位時不顯示箭頭）
        const navCount = currentGridStudents.length;
        if(navCount > 1){
          navPrevStudent = currentGridStudents[(gridIdx - 1 + navCount) % navCount];
          navNextStudent = currentGridStudents[(gridIdx + 1) % navCount];
        }
      }
    }

    let variantGroupId = effectiveGroupId(st);
    let currentBaseName = getBaseVariantName(st.name);
    // Remembered so that, after saving or deleting, we can check whether the
    // group this student is leaving behind is now empty and auto-remove it.
    const originalGroupId = variantGroupId;
    const originalBaseName = currentBaseName;
    // Custom groups created via the "+" button during this modal session —
    // if the modal closes without ever saving a student into one of these,
    // it's purged so it doesn't linger around empty.
    const sessionCreatedGroups = [];
    let rawMatches = st.name ? await findRawVariantMatches(st.name, st.id) : [];
    let abbrevMeaningSelection = st.abbrevMeaning || "";

    // If the student's name prefix (e.g. "M" from "M.Hanako") maps to an
    // abbreviation with 2+ meanings (comma-separated in the abbrev list,
    // e.g. "Maid,Magical"), show a select so the user can pick which one
    // this particular character is. With 0 or 1 meaning there's nothing to
    // choose between, so the field is hidden entirely.
    function abbrevMeaningBoxHtml(name){
      const prefix = getVariantPrefix(name);
      if(prefix === "O") return "";
      const meanings = getMeaningsForPrefix(prefix);
      if(meanings.length < 2) return "";
      return '<div class="fieldset-title">簡寫意義</div>' +
        '<div class="field"><label for="f_abbrevMeaning">「' + escapeHtml(prefix) + '」代表的意義</label>' +
        '<select id="f_abbrevMeaning">' +
          '<option value="">請選擇...</option>' +
          meanings.map(function(m){
            return '<option value="' + escapeHtml(m) + '"' + (m === abbrevMeaningSelection ? ' selected' : '') + '>' + escapeHtml(m) + '</option>';
          }).join("") +
        '</select></div>';
    }

    // Siblings (other same-base-name students already saved) that share
    // this student's *current* group selection — these are the only ones
    // whose affinity is shown as a reference, and the only ones this
    // student's affinity will be cross-referenced/exported with.
    function groupSiblings(){
      return rawMatches.filter(function(s){ return effectiveGroupId(s) === variantGroupId; });
    }

    function variantGroupControlsHtml(){
      const storedGroups = getVariantGroupsForBase(currentBaseName);
      const selectedValue = variantGroupId || "";
      // "組別1" (the default/no-group state) always displays as the plain
      // character name with no prefix — e.g. "Kayoko" rather than a generic
      // "組別1" label — since that's what it actually represents. Custom
      // groups (2+) keep whatever name the user gave them; this naming
      // shortcut applies to 組別1 only.
      const options = [{ id: "", name: currentBaseName || "組別1" }].concat(storedGroups);
      const isCustomGroupSelected = storedGroups.some(function(g){ return g.id === selectedValue; });

      const selectHtml = '<select id="variantGroupSelect">' +
        options.map(function(o){
          return '<option value="' + escapeHtml(o.id) + '"' + (o.id === selectedValue ? ' selected' : '') + '>' + escapeHtml(o.name) + '</option>';
        }).join("") +
      '</select>';

      return '<div class="field"><label for="variantGroupSelect" class="variant-group-field-label">角色分組</label>' +
        '<div class="variant-group-row">' +
          selectHtml +
          '<button type="button" class="btn btn-ghost btn-sm variant-group-icon-btn" id="btnAddVariantGroup" title="新增組別">+</button>' +
          '<button type="button" class="btn btn-ghost btn-sm variant-group-icon-btn" id="btnRenameVariantGroup" title="重命名組別"' + (isCustomGroupSelected ? "" : " disabled") + '>\u270E</button>' +
          '<button type="button" class="btn btn-ghost btn-sm variant-group-icon-btn" id="btnDeleteVariantGroup" title="刪除組別"' + (isCustomGroupSelected ? "" : " disabled") + '>\u{1F5D1}</button>' +
        '</div></div>';
    }

    function variantBoxHtml(){
      if(!rawMatches.length) return "";
      const sibs = groupSiblings();
      const refHtml = sibs.length
        ? '<div class="variant-group-title variant-group-title-nodivider">同組角色版本 · 好感度參考</div>' +
          sibs.map(function(s){
            const max = computeAffinityMax(s.weaponStar || 0);
            return '<div class="field variant-item">' +
              '<div class="variant-item-name">' + escapeHtml(s.name) + ' 好感度</div>' +
              affinityMiniHtml(s.affinity || 0, max) +
            '</div>';
          }).join("")
        : '<div class="variant-group-note">偵測到同名版本，但分屬不同組別，好感度不列入參考。</div>';

      return '<div id="variantInfoLine">' +
        variantGroupControlsHtml() +
        refHtml +
      '</div>';
    }

    function showAddVariantGroupInline(){
      const container = document.getElementById("variantBoxContainer");
      container.innerHTML =
        '<div class="field"><label for="newVariantGroupInput">新增組別名稱</label>' +
        '<div class="variant-group-rename-row">' +
          '<input type="text" id="newVariantGroupInput" placeholder="例如：泳裝限定">' +
          '<button type="button" class="btn btn-primary btn-sm" id="confirmAddVariantGroupBtn">新增</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" id="cancelAddVariantGroupBtn">取消</button>' +
        '</div></div>';
      const input = document.getElementById("newVariantGroupInput");
      input.focus();
      const cancel = function(){ renderVariantBox(); };
      document.getElementById("cancelAddVariantGroupBtn").addEventListener("click", cancel);
      const confirmAdd = function(){
        const name = input.value.trim();
        if(!name){ cancel(); return; }
        const groups = getVariantGroupsForBase(currentBaseName);
        const newGroup = { id: uid(), name: name };
        groups.push(newGroup);
        setVariantGroupsForBase(currentBaseName, groups);
        sessionCreatedGroups.push({ baseName: currentBaseName, groupId: newGroup.id });
        variantGroupId = newGroup.id;
        renderVariantBox();
      };
      document.getElementById("confirmAddVariantGroupBtn").addEventListener("click", confirmAdd);
      input.addEventListener("keydown", function(e){
        if(e.key === "Enter"){ e.preventDefault(); confirmAdd(); }
        else if(e.key === "Escape"){ e.preventDefault(); cancel(); }
      });
    }

    function showRenameVariantGroupInline(){
      const groups = getVariantGroupsForBase(currentBaseName);
      const current = groups.find(function(g){ return g.id === variantGroupId; });
      if(!current) return;
      const container = document.getElementById("variantBoxContainer");
      container.innerHTML =
        '<div class="field"><label for="renameVariantGroupInput">重命名組別</label>' +
        '<div class="variant-group-rename-row">' +
          '<input type="text" id="renameVariantGroupInput" value="' + escapeHtml(current.name) + '">' +
          '<button type="button" class="btn btn-primary btn-sm" id="confirmRenameVariantGroupBtn">儲存</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" id="cancelRenameVariantGroupBtn">取消</button>' +
        '</div></div>';
      const input = document.getElementById("renameVariantGroupInput");
      input.focus(); input.select();
      const cancel = function(){ renderVariantBox(); };
      document.getElementById("cancelRenameVariantGroupBtn").addEventListener("click", cancel);
      const confirmRename = function(){
        const name = input.value.trim();
        if(!name){ cancel(); return; }
        current.name = name;
        setVariantGroupsForBase(currentBaseName, groups);
        renderVariantBox();
      };
      document.getElementById("confirmRenameVariantGroupBtn").addEventListener("click", confirmRename);
      input.addEventListener("keydown", function(e){
        if(e.key === "Enter"){ e.preventDefault(); confirmRename(); }
        else if(e.key === "Escape"){ e.preventDefault(); cancel(); }
      });
    }

    async function handleDeleteVariantGroup(){
      const groups = getVariantGroupsForBase(currentBaseName);
      const current = groups.find(function(g){ return g.id === variantGroupId; });
      if(!current) return;
      if(!confirm('確定要刪除組別「' + current.name + '」嗎？此組別中的其他角色會被移回「' + (currentBaseName || "組別1") + '」。')) return;
      const remaining = groups.filter(function(g){ return g.id !== current.id; });
      setVariantGroupsForBase(currentBaseName, remaining);

    function renderVariantBox(){

      syncGroupAbbrevTab();
